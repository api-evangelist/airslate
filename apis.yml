- aid: airslate:signnow
  name: signNow API
  description: >-
    REST API for signNow, airSlate's electronic signature product. Covers documents, signatures, templates,
    users, groups, fields, and webhooks. Supports OAuth 2.0 with production base api.signnow.com and evaluation
