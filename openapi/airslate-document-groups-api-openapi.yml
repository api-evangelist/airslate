                  - code: 19062001
                    message: Attachment size exceeded 10 Megabyte.
                Permission error:
                  errors:
                  - code: 19061001
                    message: Insufficient rights to send the document group via email.
                Incorrect payload:
                  errors:
                  - code: 19001000
                    message: Invalid payload
