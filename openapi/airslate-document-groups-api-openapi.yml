  /v2/document-groups/{dg_id}/invite/{dg_invite_id}/correction:
    post:
      operationId: post-v2-document-groups-document-group-id-invite-document-group-invite-id-correction
      summary: Initiate DG correction
      description: 'This endpoint allows API users to put a document group invite into correction mode. After that, complete the correction to change the signers, documents, and invite settings.


        A correction can be initiated after some recipients have already signed. When the correction starts:


        * Invites in steps that are not yet completed are cancelled. Pending recipients cannot access the documents until the correction is completed.

        * Completed steps and everything already signed are kept and locked.


        **Notes**


        * The invite must be in `pending` status.

        * A document group cannot be corrected if:

        * the invite includes a guest signer who wasn''t sent a short link, an approver, or an SMS invite,

        * the invite is embedded or includes email groups,

        * the document group was declined or is already in correction mode,

        * the document group contains multirole or conditional fields,

        * the document group is in a shared folder.'
      parameters:
      - in: path
        name: dg_id
        required: true
        description: ID of the document group.
        schema:
          type: string
      - in: path
        name: dg_invite_id
        required: true
        description: ID of the document group invite.
        schema:
          type: string
      responses:
        '204':
          description: Success, no content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: '* Group has a guest signer who wasn''t sent a short link.

            * Group invite is not pending.

            * Group invite is embedded.

            * Document group is already in a correction state.

            * Document group contains multirole fields.

            * Field invites with email groups are present.

            * Document group is in a shared folder.

            * Document group has conditional fields.

            * Group invite includes approvers.

            * Group invite includes SMS invites.

            * Document group is declined.

            * `client_timestamp` is not an integer.

            * `client_timestamp` is out of the allowed range.

            * `client_timestamp` is null.'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Email group issue:
                  errors:
                  - code: 19066007
                    message: Field invites with emails groups are present
                DG in shared folder:
                  errors:
                  - code: 19066008
                    message: Cannot initiate correction for DG in the shared folder.
                DG in declined state:
                  errors:
                  - code: 19066012
                    message: Do not allow initiate correction for document group in declined state
                Embedded group invite:
                  errors:
                  - code: 19066004
                    message: Invite should not be embedded
                DG in correction state:
                  errors:
                  - code: 19066005
                    message: Document Group is already in correction state
                DG with multirole fields:
                  errors:
                  - code: 19066006
                    message: Document Group contains multirole fields
                Group has a guest signer:
                  errors:
                  - code: 19066001
                    message: Could not initiate correction mode when guest signer present
                Group invite not pending:
                  errors:
                  - code: 19066003
                    message: Invite should be pending
                client_timestamp is null:
                  errors:
                  - code: 19070003
                    message: Client timestamp should not be null.
                DG with conditional fields:
                  errors:
                  - code: 19066009
                    message: Document group should not have conditional fields.
                client_timestamp not integer:
                  errors:
                  - code: 19070001
                    message: Client timestamp should be a integer.
                client_timestamp out of range:
                  errors:
                  - code: 19070002
                    message: The client timestamp should be between 0 and 4294967295.
                Group invite includes approvers:
                  errors:
                  - code: 19066010
                    message: Do not allow initiate correction with approvers
                Group invite includes SMS invites:
                  errors:
                  - code: 19066011
                    message: Do not allow initiate correction with invites with type sms
        '403':
          description: User is not a document group owner
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                User is not a document group owner:
                  errors:
                  - code: 19001010
                    message: Current user is not document group owner.
        '404':
          description: '* Document group is not found.

            * Document group invite is not found.'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Invite not found:
                  errors:
                  - code: 19002005
                    message: Document group invite `a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0` not found.
                Invite doesn't belong to this group:
                  errors:
                  - code: 19001011
                    message: Document group `{uniqueId}` not found.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - client_timestamp
              properties:
                client_timestamp:
                  type: integer
                  description: The timestamp of when the correction mode has been initiated.
                  x-stoplight:
                    id: h5wjik7o8ikuv
        required: true
      tags:
      - Document Groups
