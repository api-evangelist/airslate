                  errors:
                  - code: 19053003
                    message: Exceeded daily email limit.
                '`to` must be an array':
                  errors:
                  - code: 19060001
                    message: '''The `to` value should be of type array.'
                '`to` must not be null':
                  errors:
                  - code: 19060002
                    message: The `to` value should not be null.
                '`email` must be a string':
