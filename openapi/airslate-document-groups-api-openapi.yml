    post:
      operationId: generate-link-for-embedded-invite-document-group
      summary: Generate embedded invite link
      description: 'This endpoint allows users to generate a link for the doc group embedded invite.


        Copy the document group embedded invite `id` from the response `POST /v2/document-groups/{{document_group_id}}/embedded-invites`.


        In your request specify:

        * `email`: Signer''s email address.


        * `auth_method`: Pre-defined in `POST /v2/document-groups/{document_group_id}/embedded-invites` request method used to authenticate the signer within the integrated application.'
      parameters:
      - in: path
        name: embedded_invite_id
        required: true
        description: ID of the embedded document group invite.
        schema:
          type: string
      - in: path
        name: document_group_id
        required: true
        description: Document group ID.
        schema:
          type: string
      responses:
        '200':
          description: Success. Returns a link for embedded invite.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      link:
                        type: string
              example:
                application/json:
                  data:
                    link: https://example.com/document_group/01XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        '400':
          description: '* 19020009 - `session_expiration` is not an integer.

            * 19020010 - `session_expiration` is out of range.'
          content:
            application/json:
              schema:
                type: object
              example:
                session_expiration not integer:
                  errors:
                  - code: 19020009
                    message: The `session_expiration` field must be an integer.
                session_expiration out of range:
                  errors:
                  - code: 19020010
                    message: The `session_expiration` field must be between 15 and 1440.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - auth_method
              properties:
                email:
                  type: string
                  example: signer1@email.com
                  description: Recipient's email address.
                auth_method:
                  type: string
                  description: 'Defines the method used to authenticate the recipient within the integrated application. Allowed values: `password`, `email`, `mfa`, `social`, `biometric`, `other`, `none`. Must match the value specified when creating the embedded invite.'
