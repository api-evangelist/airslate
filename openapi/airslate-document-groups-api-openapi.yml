  /v2/document-groups/{document_group_id}/copy:
    post:
      operationId: post-v2-document-groups-document-group-id-copy
      summary: Create a copy of doc group
      description: This endpoint allows users to copy a document group in any status and set a new name to it.
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group.
        schema:
          type: string
      responses:
        '202':
          description: The document group copy has been scheduled.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: '* Request with any of cases: invalid token, expired token, empty header, authorization = null, authorization without value

            * Incorrect type of `document_group_name` field

            * Incorrect type of `client_timestamp field`, not integer

            * `client_timestamp field` length limits'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Authorization issues:
                  code: 1537
                  message: invalid_token
                '`client_timestamp field` length limits':
                  code: 13020000
                  message: The client_timestamp should be between 0 and 4294967295
                Incorrect type of document_group_name field:
                  code: 13020000
                  message: The document_group_name field must be string type
                Incorrect type of `client_timestamp` field, not integer:
                  code: 13020000
                  message: The client_timestamp field must be an integer
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - document_group_name
              properties:
                client_timestamp:
                  type: integer
                  description: The timestamp in UNIX code.
                document_group_name:
                  type: string
                  description: The name of the new document group copy.
              x-examples:
                Example 1:
                  client_timestamp: 1635953805
                  document_group_name: New name of Document Group
        required: true
      tags:
      - Document Groups
  /v2/document-groups/{document_group_id}/move:
    post:
      operationId: post-v2-document-groups-document-group-id-move
      summary: Move document group
      description: This endpoint allows users to move a document group to another folder. When a document group is moved, all its documents are moved to the same folder except documents in the Deleted folder (Deleted from Trash) and documents that are located in the Shared folders.
      parameters:
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group
        schema:
          type: string
      responses:
        '204':
          description: Success, no content
          content:
            application/json:
              schema:
                type: object
        '400':
          description: '* `folder_id` is not a string

            * Incorrect `folder_id`

            * Empty `folder_id`

            * The user does not have a folder with this ID

            * `with_shared_documents` is not a boolean

            * `with_shared_documents` is TRUE and the folder is not Trash '
          content:
            application/json:
              example:
                Empty folder_id:
                  errors:
                  - code: 13009019
                    message: 'The `folder_id` field must not be empty. '
                Folder not Trash:
                  errors:
                  - code: 13009026
                    message: The `7c5409cce69843e698e793162d103e2b79a0bcf0` folder is not support shared documents.
                No such folder_id:
                  errors:
                  - code: 13009017
                    message: User folder `4ab6ea1d58a84bc085b3ef2c880w78d35e4881b5` is not found.
                Incorrect folder_id:
                  errors:
                  - code: 13009003
                    message: The `folder_id` field value is invalid.
                folder_id not string:
                  errors:
                  - code: 13009002
                    message: The `folder_id` field must be a string.
                with_shared_documents not boolean:
                  errors:
                  - code: 13009025
                    message: The `with_shared_documents` field must be a bool.
        '403':
          description: '* The user is not an owner of the document group.

            * The folder is not owned by or shared with the user''s team.

            * The user does not have permissions to move document groups to this folder.

            * To move a document group, a user must be its owner. To move a document group that is located in the Shared folder, a user must be a team admin.

            * This folder does not support document groups in correction state.

            * It is forbidden to move this document group to the Deleted folder.'
          content:
            application/json:
              example:
                Team issue:
                  errors:
                  - code: 13009029
                    message: The `%s` folder is not owned folder or shared folder of Team where user is member.
                Ownership issue:
                  errors:
                  - code: 13009028
                    message: Only owner of document group or Team admin (if document group is located in Shared Folder) can move document group.
                Permission error:
                  errors:
                  - code: 13009018
                    message: User Folder permissions is not executable.
                User doesn't own DG:
                  errors:
                  - code: 13009006
                    message: User is not owner of `64cfc09a50c6852e5cc4bb427c33cf9b5ee4620a` document group.
                Moving to Deleted forbidden:
                  errors:
                  - code: 13009030
                    message: Move to `Deleted` folder is not allowed
                Document group in correction state:
                  errors:
                  - code: 13009031
                    message: The `%s` folder does not support document group in correction state.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - folder_id
              properties:
                folder_id:
                  type: string
                  example: 2cb6ea1d58a84bc085b3ef2c880378d35e4881b5
                  description: "ID of the folder to move the document group to. Allowed folder types: \n\n* Documents and custom folders\n* Archive and its custom folders\n* Shared Documents folders "
                  x-stoplight:
                    id: 97neqkaeuy8wm
                with_shared_documents:
                  type: boolean
                  default: false
                  description: Whether to move shared documents that are in this document group. With this parameter, a document group can only be moved to trash.
                  x-stoplight:
                    id: qf1kwsujca7vi
        required: true
      tags:
      - Document Groups
  /v2/document-groups/{doc_group_id}/document-group-template:
    post:
      operationId: post-v2-document-groups-document-group-uid-document-group-template
      summary: Create doc group template from doc group
      description: 'This endpoint allows API users to create a new document group template from a document group in any status.


        As a result, user gets one document group template and separate templates from each document in the document group.


        To collect signatures, create a document group from the template with Create doc group from template, then send that group. For the full flow, see Documents, doc groups, and templates.'
      parameters:
      - in: path
        name: doc_group_id
        required: true
        description: ID of the document group.
        schema:
          type: string
      responses:
        '202':
          description: Document group template copy has been scheduled
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: '* Authorization issues: invalid token of user, expired token of user, empty header, authorization = null, authorization without value

            * Incorrect type of name field

            * Unsupported symbols in the name field

            * Length of the name field is too long

            * Incorrect type of folder_id field

            * Incorrect value of folder_id field

            * Empty name field

            * With non-Template(or its sub-folder) folder_id'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Empty name field:
                  code: 23003006
                  message: The `name` field must not be empty.
                Authorization issues:
                  code: 1537
                  message: invalid_token
                Incorrect type of name field:
                  code: 23003003
                  message: The `name` field must be a string.
                Incorrect type of folder_id field:
                  code: 23003001
                  message: The `folder_id` field must be a string.
                Incorrect value of folder_id field:
                  code: 23003001
                  message: The `folder_id` field value must be valid unique_id.
                Length of the name field is too long:
                  code: 23003005
                  message: The `name` must not exceed 255 chars.
                Unsupported symbols in the name field:
                  code: 23003004
                  message: 'Unsupported symbol at `name` field value. Allowed symbols: A-Z, a-z, 0-9, ''_'', ''.'', ''-'', '' ''.'
                With non-Template(or its sub-folder) folder_id:
                  code: 23003009
                  message: Document Group Template could be create in folder or sub-folders of Templates only.
        '403':
          description: '* Forbidden access to the Document Group

            * Forbidden access to the provided folder'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Forbidden access to the Document Group:
                  code: 13020001
                  message: You do not own this DocumentGroup
                Forbidden access to the provided folder:
                  code: 23003008
                  message: User don`t have access to folder.
        '404':
          description: '* Folder does not exist

            * Document Group does not exist or is deleted'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Folder does not exist:
                  code: 23003007
                  message: User folder not found.
                Document Group does not exist or deleted:
                  code: 23001015
                  message: Document Group `{dg_uid}` not found.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Name for a new Document group template.
                  x-stoplight:
                    id: 8k87jesg0p3i6
                folder_id:
                  type: string
                  description: The folder where to save the new Document group template. Must be saved to a Templates folder or any of its sub-folders.
                  x-stoplight:
                    id: 9265xix62sar1
        required: true
      tags:
      - Document Groups
  /v2/document-groups/{dg_id}/invite/{dg_invite_id}:
    put:
      operationId: put-v2-document-groups-document-group-id-invite-document-group-invite-id-correction
      summary: Complete DG correction
      description: 'This endpoint allows API users to complete a document group correction and apply the new signers, documents, and invite settings. With this endpoint, you can:


        * Change the signers and viewers of the document group

        * Update the invite settings

        * Reorder and remove documents that were not signed yet

        * Add new documents to the document group


        Before completing the correction, initiate it.


        **Partially signed invites**


        A recipient counts as having signed once they complete their signing action or fill in at least one field on any document in the group. The document does not need to be fully completed.


        When some recipients have already signed:


        * Add new signers and viewers to the last step that was at least partially signed, or to any later step. Earlier steps are locked.

        * A recipient who already signed a document in the last signed step can be added to that step as a viewer of another document.

        * The role of a recipient who already signed keeps its email address.


        Steps that were cancelled when the correction started are recreated when you complete it:


        * If the last signed step is complete, the next step''s invites are sent right away. Adding only viewers to the completed step does not change this.

        * If you add a signer to the last completed step, the step returns to pending. The next step''s invites are sent once the new signer finishes.


        *For example*, an invite has three steps, and steps 1 and 2 are signed. You can add new signers to steps 2 and 3. If you add a signer to step 2, step 3''s invites are sent after that signer completes step 2.'
      parameters:
      - in: path
        name: dg_id
        required: true
        description: ID of the document group.
        schema:
          type: string
      - in: path
        name: dg_invite_id
        required: true
        description: ID of the document group invite.
        schema:
          type: string
      responses:
        '204':
          description: Success, no content
          content:
            application/json:
              schema:
                type: object
        '400':
          description: '* Document group is not in correction state.

            * All documents should be in the document group.

            * Role `role` does not exist.

            * Role `role` must be used in the invite.

            * Authentication is required for this organization.

            * Field `phone` is not a phone number.

            * Email subject must not be empty or default.

            * Phone authentication can''t be used for user with trial or no subscription.

            * At least one document must contain fields.

            * Reassign is not allowed for viewers.

            * Authentication is not allowed for viewers.

            * Invite is not pending.

            * This user doesn''t have an active mail provider.

            * Currency is not supported.

            * A short link invite is not in the first step (`order: 1`).

            * A short link invite contains an email address.

            * `is_short_link_invite` is not a boolean.

            * A signer has already completed a document on the last completed step and cannot be added as a signer of another document on this step.

            * A step is not the last completed step and cannot be edited.

            * The recipient with this role has already completed a document and cannot be edited.

            * `invites` is not an array.

            * `invites` value is not an array.

            * `cc` is not an array.

            * `cc` value is not an array.

            * `completion_emails` is not an array.

            * `completion_emails` value is not an array.

            * `order` is not an integer.

            * `signers` is not an array.

            * `signers` value is not an array.

            * `signers.email` is not a string.

            * `documents` is not an array.

            * `documents` value is not an array.

            * `message` is not a string.

            * `subject` is not a string.

            * `expiration_days` is not an integer.

            * `decline_by_signature` is not a boolean.

            * `reassign` is not a boolean.

            * `documents.id` is not a string.

            * `documents.role` is not a string.

            * `authentication.type` is not a string.

            * `authentication.phone` is not a string.

            * `authentication.method` is not a string.

            * `authentication.sms_message` is not a string.

            * `authentication.password` is not a string.

            * `cc.email` is not a string.

            * `completion_emails.email` is not a string.

            * `completion_emails.disabled` is not a boolean.

            * `completion_emails.disable_document_attachment` is not a boolean.

            * `authentication` is not an object.

            * `reminder` is not an object.

            * `redirect_uri` is not a string.

            * `decline_redirect_uri` is not a string.

            * `close_redirect_uri` is not a string.

            * `mail_provider` is not a string.'
          content:
            application/json:
              schema:
                type: object
              example:
                cc not array:
                  errors:
                  - code: 19067004
                    message: Field `cc` should be of type array.
                invites not array:
