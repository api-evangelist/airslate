    get:
      operationId: get-document-group-info-v2
      summary: Get document group info (v.2)
      description: 'This endpoint allows API users to retrieve detailed information about a specific document group, including its documents, assigned roles, field and FreeForm invites, share info, owner details, and originator organization settings.


        Available to the document group owner and to any user invited on any step, regardless of the current invite or step status.


        **Notes**


        * Use the `include` query parameter to add optional data to the response. To request several values, separate them with commas, for example `?include=documents.fields,reminder`. Unknown values are ignored.

        * With `?include=documents.fields`, each item in `documents` contains a `fields` array. Without it, the response doesn''t include `fields`, so existing integrations are not affected.

        * The objects in `fields` have the same format as the `fields` array of `GET /document/{document_id}` and cover all field types it returns.

        * The response doesn''t include dropdown options (`enumeration_options`) or checkbox groups (`checkbox_groups`). `GET /document/{document_id}` returns them at the document level, so call it for each document that needs them.

        * To add or update fields, call `PUT /document/{document_id}` for each document.'
      parameters:
      - in: query
        name: include=document_group_attributes
        required: false
        description: If used, the response will contain document group attributes.
        schema:
          type: string
      - in: query
        name: include=reminder
        required: false
        description: If used, the response includes `general_expiration_time`, `general_expiration_days`, and `general_reminder` — defaults applied to all recipients in the invite.
        schema:
          type: string
      - in: query
        name: include=documents.fields
        required: false
        description: If used, each item in `documents` contains a `fields` array with the fields of that document.
        schema:
          type: string
      - in: query
        name: include=documents.freeform_invites
        required: false
        description: If used, each item in `documents` contains a `freeform_invites` array with the FreeForm invites sent for that document.
        schema:
          type: string
      - in: query
        name: include=documents.signatures
        required: false
        description: If used, each item in `documents` contains a `signatures` array with the signatures added to that document.
        schema:
          type: string
      - in: query
        name: include=entity_labels
        required: false
        description: 'If used, the response contains `entity_labels`: the labels assigned to the document group.'
        schema:
          type: string
      - in: query
        name: include=origin_dgt
        required: false
        description: 'If used, the response contains `origin_dgt`: the document group template the document group was created from.'
        schema:
          type: string
      - in: query
        name: include=recently_used
        required: false
        description: 'If used, the response contains `recently_used`: the Unix timestamp of the last activity on the document group.'
        schema:
          type: string
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group.
        schema:
          type: string
      responses:
        '200':
          description: '- Request with correct token

            - Request with email group

            - Request with FreeForm invite

            - Request with `include=documents.fields`

            - Request with `include=documents.signatures,entity_labels,origin_dgt,recently_used`

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the document group.
                      name:
                        type: string
                        description: Display name of the document group.
                      owner:
                        type: object
                        properties:
                          id:
                            type: string
                          email:
                            type: string
                          organization:
                            type: object
                            properties:
                              id:
                                type: string
                        description: Information about the document group owner, including organization details.
                      state:
                        enum:
                        - created
                        - pending
                        - canceled
                        - completed
                        - declined
                        - correction
                        type: string
                        description: 'Current state of the document group. Possible values: `created` — the document group has been created; `pending` — an invite has been sent and is awaiting signing; `canceled` — the document group invite was canceled; `completed` — all signing steps are completed; `declined` — one of the signers declined to sign; `correction` — the document group is in correction mode.'
                      created:
                        type: integer
                        description: Unix timestamp when the document group was created.
                      updated:
                        type: integer
                        description: Unix timestamp of the last update to the document group.
