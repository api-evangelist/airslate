                  errors:
                  - code: 19067009
                    message: Field `order` in `invites` should be of type integer.
                signers not array:
                  errors:
                  - code: 19067012
                    message: Field `signers` in `invites` should be of type array.
                Invite not pending:
                  errors:
                  - code: 19068012
                    message: Invite should be pending
