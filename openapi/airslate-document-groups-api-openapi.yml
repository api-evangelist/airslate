  /v2/document-groups/{document_group_id}/invites/{document_group_invite_id}/full-decline:
    post:
      operationId: post-v2-document-groups-document-group-id-invites-document-group-invite-id-full-decline
      summary: Decline group invite
      description: Allows API users to decline signing a document group invite.
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group.
        schema:
          type: string
      - in: path
        name: document_group_invite_id
        required: true
        description: ID of the document group invite.
        schema:
          type: string
      responses:
        '204':
          description: Successfully declined.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: The access token is incorrect.
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Incorrect access token:
                  code: 1537
                  error: invalid_token
        '403':
          description: User does not have access to this action
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: '* Requested document group or group invite not found or are not related to each other

            * No pending invites for you in this document group.

            * The group can not be declined as it is not in pending state.'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Doc group not found:
                  errors:
                  - code: 19001011
                    message: Document group `aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa` not found
                Doc group invite not found:
                  errors:
                  - code: 19002005
                    message: Document group invite `aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa` not found
                No pending invites for you in this document group.:
                  errors:
                  - code: 19006002
                    message: No pending invites for you in this document group.
                The group can not be declined as it is not in pending state.:
                  errors:
                  - code: 19006001
                    message: The group can not be declined as it is not in pending state.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - decline
              properties:
                decline:
                  type: string
                  description: The reason for decline.
                client_timestamp:
                  type: integer
                  description: Unix timestamp of decline.
              x-examples:
                Example 1:
                  decline: decline reason
                  client_timestamp: 1586523305
        required: true
      tags:
      - Document Groups
