  /v2/templates/{template_id}/copy:
    post:
      operationId: post-v2-templates-template-id-copy
      summary: Duplicate a template
      description: 'This endpoint allows API users to create a new template by making a copy of an existing template and editing the copy.


        The result is another template. To collect signatures, generate a document from it with Create document from template and send that document, or reach many signers at once with Bulk invite.'
      parameters:
      - in: path
        name: template_id
        required: true
        description: ID of the source template.
        schema:
          type: string
      responses:
        '200':
          description: Successfully created new template copy
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Successfully created new template copy:
                  id: 29XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                  name: New sample template
        '400':
          description: '* Request with any of cases: invalid token, expired token, empty header, authorization = null, authorization without value

            * The `template_name` field must be a string.

            * The `template_name` field is required and must not be empty.

            * The `template_name` field must be a valid string.

            * The `folder_id` field must be a string.

            * The `folder_id` field must be a valid unique id.

            * Cannot copy a deleted template.

            * Folder of Templates only available.

            * The `clear_recipient_details` field must be a boolean.'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Authorization issues:
                  code: 1537
                  message: invalid_token
                Cannot copy a deleted template.:
                  errors:
                  - code: 13021009
                    message: Copy deleted template is not possible.
                Folder of Templates only available.:
                  errors:
                  - code: 13021005
                    message: Folder of Templates only available.
                The `folder_id` field must be a string.:
                  errors:
                  - code: 13021002
                    message: The `folder_id` field must be a string.
                The `template_name` field must be a string.:
                  errors:
                  - code: 13021001
                    message: The `template_name` field must be a string.
                The `folder_id` field must be a valid unique id.:
                  errors:
                  - code: 13021003
                    message: The `folder_id` field must be a valid unique id.
                The `template_name` field must be a valid string.:
                  errors:
                  - code: 13021011
                    message: The `template_name` field must be a valid string.
                The `clear_recipient_details` field must be a boolean.:
                  errors:
                  - code: 13021012
                    message: The `clear_recipient_details` field must be a boolean.
                The `template_name` field is required and must not be empty.:
                  errors:
                  - code: 13021010
                    message: The `template_name` field is required and must not be empty.
        '403':
          description: '* Access denied to specific template.

            * Access denied to specific folder.'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Access denied to specific folder.:
                  errors:
                  - code: 13021004
                    message: Access denied to {unique_id} folder.
                Access denied to specific template.:
                  errors:
                  - code: 13021008
                    message: Access denied to {unique_id} template.
        '404':
          description: Template is not found.
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Template is not found.:
                  errors:
                  - code: 13021006
                    message: Template {unique_id} is not found.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - template_name
              properties:
                folder_id:
                  type: string
                  description: ID of the folder where the new template copy must be saved. If not specified, the new template will be saved to a Template folder.
                template_name:
                  type: string
                  description: The new template name.
                clear_recipient_details:
                  type: boolean
                  description: Whether or not to overwrite the recipients roles and actions in the template. `True` - yes, delete the recipients details from the template copy, `false` - no overwriting, use the recipients' details from the source template.
              x-examples:
                Example 1:
                  folder_id: 586ef233a1f9ec860bb0221e58ee5c57f760e39e
                  template_name: new template
                  clear_recipient_details: false
        required: true
      tags:
      - Templates
  /v2/templates/{template_id}/roles:
    post:
      operationId: post-v2-templates-template-id-roles
      summary: Share template
      description: 'This endpoint allows an owner of a template to share it with other users (as a viewer or sender).


        **Note**: A template can be shared only once with the same user. The user will receive an email notification about the shared template.'
      parameters:
      - in: path
        name: template_id
        required: true
        description: ID of the template.
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the user with whom the template has been shared.
                  role:
                    type: string
                    description: Role of the user. Can be `sender` or `viewer`.
                  email:
                    type: string
                    description: Email of the user with whom the template has been shared.
                x-examples:
                  Example 1:
                    id: a0XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    role: sender
                    email: user@email.com
              example:
                Example 1:
                  id: a0XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                  role: sender
                  email: user@email.com
                Successful request:
                  id: a0XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                  role: sender
                  email: user@mail.com
        '400':
          description: '- The template has already been shared with this user.

            - You are not a template owner.

            - Trial users can share up to 10 entities.

            - The user email is not valid.

            - `email` is not a string.

            - `email` is required.

            - `role` must be one of: `viewer`, `sender`.

            - `role` is not a string.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 12029008
                      message: Template can only be shared once.
              example:
                Example 1:
                  errors:
                  - code: 12029008
                    message: Template can only be shared once.
                Invalid role:
