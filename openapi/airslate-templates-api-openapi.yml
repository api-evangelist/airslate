openapi: 3.2.0
info:
  title: SignNow Templates API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Templates
paths:
  /v2/templates/{template_id}/copies:
    get:
      operationId: get-v2-templates-template-id-copies
      summary: Get list of documents from template
      description: 'The endpoint allows users to retrieve a list of all the documents created from a template.


        **Example of a request with query parameters**


        ```json


        /v2/templates/{template_id}/copies?sort_by=created&sort_order=desc&per_page=20&filters[signing_status]=pending`


        ```'
      parameters:
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      - in: query
        name: sort_by
        required: false
        description: 'Field to sort documents by. Possible values: `updated`, `created`, `document_name`.'
        schema:
          type: string
          default: updated
      - in: query
        name: sort_order
        required: false
        description: 'Sort the list in ascending or descending order. Possible values: `asc`, `desc`.'
        schema:
          type: string
          default: desc
      - in: query
        name: page
        required: false
        description: Page number to view.
        schema:
          type: integer
          default: 1
      - in: query
        name: per_page
        required: false
        description: Number of documents per page.
        schema:
          type: integer
          default: 15
      - in: query
        name: filters[signing_status]
        required: false
        description: 'Signing status to filter documents by. Possible values: `waiting-for-me`, `waiting-for-others`, `signed`, `pending`, `has-invites`, `expired`.'
        schema:
          type: string
      - in: query
        name: filters[entity_labels]
        required: false
        description: 'Label to filter documents by. Possible values: `declined` (the invite was declined), `undelivered` (the invite email wasn''t delivered). You can use both values together.'
        schema:
          type: string
      - in: query
        name: search_key
        required: false
        description: Search by a key word, part of word, or phrase.
        schema:
          type: string
      - in: query
        name: search_by
        required: false
        description: 'Field to search by. Possible values: `document-name`, `signer-email`, `inviter-email`, `document-text`, `document-id`.'
        schema:
          type: string
      - in: query
        name: exclude
        required: false
        description: 'Entities to exclude from the response. Possible value: `doc-from-dg` (documents that are in document groups).'
        schema:
          type: string
      - in: path
        name: template_id
        required: true
        description: The ID of the template.
        schema:
          type: string
      responses:
