openapi: 3.2.0
info:
  title: SignNow Folder API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Folder
paths:
  /folder/{folder_unique_id}/documents:
    put:
      operationId: put-folder-folder-unique-id-documents
      summary: Move documents in bulk
      description: This endpoint allows users to move their documents in bulk to the specified folder.
      parameters:
      - in: path
        name: folder_unique_id
        required: true
        description: ID of the target folder to move documents
        schema:
          type: string
      responses:
        '200':
          description: Documents moved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                x-examples:
                  Example 1:
                    status: success
              example:
                Example 1:
                  status: success
                'Documents moved successfully ':
                  status: success
        '400':
          description: "- Document limit (maximum: 25) is exceeded.\n- Bad request, including:\n  - Document does not exist;\n  - Operation is not allowed (user tries to move Document into Template folder etc.);\n  - User does not have rights to move the Document.\n- Target folder does not exist.\n- Invalid document ID."
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 65536
                      message: Invalid payload length
              example:
                Example 1:
                  errors:
                  - code: 65536
                    message: Invalid payload length
                Bad request:
                  code: 160
                  errors:
                  - code: 75
                    message: Resource doesn't exist
                    unique_id: abc42eecf4sc41aabe1803280d379562930a1964
                  - code: 79
                    message: operation not allowed
                    unique_id: b605d4d971cd48d1ba3af6b15eaa467aa091e282
                  - code: 74
                    message: not readable
                    unique_id: 398392b4f4ac421c92bbffa74a04d706a75fc969
                  message: Bad request
                Invalid document ID:
                  errors:
                  - code: 65536
                    message: Invalid unique id
                Document limit exceeded:
                  errors:
                  - code: 65536
                    message: Invalid payload length
                Target folder does not exist:
                  errors:
                  - code: 65611
                    message: folder Resource doesn't exist
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                - unique_id
                properties:
                  unique_id:
                    type: string
                    description: 'ID of moving documents. Limit: 25 documents.'
              x-examples:
                Example 1:
                - unique_id: abc42eecf44c41aabe1803280d379562930a1964
                - unique_id: ebe10d8381b34fca86ed09d87b8a4130b146e80d
        required: true
      tags:
      - Folder
  /folder/{folder_id}:
    get:
      operationId: get-folder-by-id
      summary: Get folder by id
      description: 'This endpoint allows API users to retrieve the details of a folder, including its subfolders and the documents it contains. Use query parameters to filter, sort, and paginate the document list.


        **Notes**


        * `total_documents` is the total number of documents in the folder. The `documents` array contains only the page selected by `limit` and `offset`.

        * To include document group templates, set `entity_type` to `dgt` or `all`. By default, a templates folder returns only templates.

        * Each document''s `document_group_template_info` lists the active document group templates that include it. For a document that isn''t part of any document group template, the array is empty.'
      parameters:
      - in: path
        name: folder_id
        required: true
        description: ID of the folder to return.
        schema:
          type: string
      - in: query
        name: filter-values
        required: false
        description: 'Value for the filter set in `filters`. For `filters=signing-status`, one of: `signed`, `pending`, `waiting-for-me`, `waiting-for-others`, `unsent`, `expired`. For `filters=documents-created` or `filters=documents-updated`, a Unix timestamp: the response includes documents created or updated after this time.'
        schema:
          type: string
      - in: query
        name: sortby
        required: false
        description: 'Field to sort documents by. Possible values: `updated`, `created`, `document-name`.'
        schema:
          type: string
      - in: query
        name: order
        required: false
        description: 'Order of sorting. Can be used only with `sortby`. Possible values: `asc`, `desc`.'
        schema:
          type: string
          default: desc
      - in: query
        name: offset
        required: false
        description: Number of documents to skip before the returned page starts.
        schema:
          type: integer
      - in: query
        name: limit
        required: false
        description: 'Maximum number of documents to return. Max: `100`.'
        schema:
          type: integer
      - in: query
        name: entity_type
        required: false
        description: 'Entities to include in the response. Possible values: `document-all` (documents, including documents in document groups), `document` (documents that aren''t in document groups), `document-group` (document groups only), `template` (templates only), `dgt` (document group templates only), `all` (documents and document groups, or templates and document group templates in a templates folder).'
        schema:
          type: string
          default: document-all
      - in: query
        name: entity_labels
        required: false
        description: 'Label to filter documents and document groups by. Possible values: `declined` (the invite was declined), `undelivered` (the invite email wasn''t delivered). To use both, separate them with a comma: `declined,undelivered`.'
        schema:
          type: string
      - in: query
        name: filters
        required: false
        description: 'Filter to apply to the document list. Possible values: `signing-status`, `documents-created`, `documents-updated`. Use with `filter-values`. The `documents-created` and `documents-updated` filters exclude templates.'
        schema:
          type: string
      - in: query
        name: include_documents_subfolders
        required: false
        description: 'Whether to include subfolders to the response. Allowed values: `1`, `0`.'
        schema:
          type: boolean
      - in: query
        name: with_team_documents
        required: false
        description: Whether to display Team Documents folders.
        schema:
          type: boolean
      - in: query
        name: only_favorites
        required: false
        description: Whether to show only favorite documents and document groups.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: '* Success

            * With document group where user is a signer (+email group)

            * With document group where user is the owner (+email group)

            * With viewer field invites (+email group)

            * With `entity_type=document-group` query

            * With `entity_type=dgt` query'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the folder.
                  name:
                    type: string
                    description: Name of the folder.
                  shared:
                    type: boolean
                    description: Whether the folder is shared.
                  created:
                    type: string
                    description: Folder creation time as a Unix timestamp.
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID of the subfolder.
                        name:
                          type: string
                          description: Name of the subfolder.
                        shared:
                          type: boolean
                          description: Whether the subfolder is shared.
                        created:
                          type: string
                          description: Unix timestamp of when the subfolder was created, as a string.
                        team_id:
                          type: string
                          description: ID of the team. Team folders only.
                        user_id:
                          type: string
                          description: ID of the subfolder owner.
                        team_name:
                          type: string
                          description: Name of the team. Team folders only.
                        team_type:
                          type: string
                          description: Access type of the team folder, for example `VIEWABLE`. Team folders only.
                        folder_count:
                          type: string
                          description: Number of subfolders inside the subfolder, as a string.
                        document_count:
                          type: string
                          description: Number of documents in the subfolder, as a string.
                        template_count:
                          type: string
                          description: Number of templates in the subfolder, as a string.
                    description: Subfolders of the folder. Empty if the folder has no subfolders.
                  team_id:
                    type: string
                    description: ID of the team. Team folders only.
                  user_id:
                    type: string
                    description: ID of the folder owner.
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID of the document, template, document group, or document group template.
                        tags:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Name of the tag.
                              type:
                                type: string
                                description: Type of the tag, for example `system`.
                          description: List of tags assigned to the document. Documents and templates only.
                        lines:
                          type: array
                          items:
                            type: object
                          description: List of line elements drawn on the document. Documents and templates only.
                        owner:
                          type: string
                          description: Email address of the owner.
                        roles:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Name of the role, for example `Signer 1`.
                              unique_id:
                                type: string
                                description: ID of the role.
                              signing_order:
                                type: string
                                description: Position of the role in the signing order, as a string.
                          description: List of signer roles defined for the document. Documents and templates only.
                        seals:
                          type: array
                          items:
                            type: object
                          description: List of applied seal elements on the document. Documents and templates only.
                        state:
                          type: string
                          description: State of the document group, such as `created`, `pending`, or `completed`. Can be `null` for document group templates. Document groups and document group templates only.
                        texts:
                          type: array
                          items:
                            type: object
                          description: List of text elements added to the document. Documents and templates only.
                        checks:
                          type: array
                          items:
                            type: object
                          description: List of checkmark elements added to the document. Documents and templates only.
                        fields:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: ID of the field.
                              role:
                                type: string
                                description: Name of the role the field is assigned to.
                              type:
                                type: string
                                description: Field type, for example `text`, `signature`, `initials`, `checkbox`, or `enumeration`.
                              role_id:
                                type: string
                                description: ID of the role the field is assigned to.
                              field_id:
                                type: string
                                description: ID of the field the element belongs to. Can be `null`.
                              fulfiller:
                                type: string
                                description: Email address of the user who filled in the field. `null` until the field is filled.
                              element_id:
                                type: string
                                description: ID of the element that fills the field. `null` until the field is filled.
                              originator:
                                type: string
                                description: Email address of the document owner.
                              json_attributes:
                                type: object
                                properties:
                                  x:
                                    type: integer
                                    description: Horizontal position of the field on the page, in pixels.
                                  y:
                                    type: integer
                                    description: Vertical position of the field on the page, in pixels.
                                  bold:
                                    type: boolean
                                    description: '`true` if the text is bold.'
                                  font:
                                    type: string
                                    description: Font name, for example `Arial`.
                                  name:
                                    type: string
                                    description: Name of the field.
                                  size:
                                    type: integer
                                    description: Font size in the SignNow editor scale.
                                  align:
                                    type: string
                                    description: Horizontal text alignment, for example `left`.
                                  color:
                                    type: string
                                    description: Text color as a 6-character hex code without `#`, for example `000000`.
                                  label:
                                    type: string
                                    description: Label of the field shown to the recipient. Returned only if a label is set.
                                  width:
                                    type: integer
                                    description: Width of the field, in pixels.
                                  height:
                                    type: integer
                                    description: Height of the field, in pixels.
                                  italic:
                                    type: boolean
                                    description: '`true` if the text is italic.'
                                  valign:
                                    type: string
                                    description: Vertical text alignment, for example `top`.
                                  required:
                                    type: boolean
                                    description: '`true` if the recipient must fill in the field.'
                                  font_size:
                                    type: integer
                                    description: Font size on the document page, in PDF points.
                                  max_chars:
                                    type: integer
                                    description: Maximum number of characters. `0` means no limit.
                                  max_lines:
                                    type: integer
                                    description: Maximum number of lines. `0` means no limit.
                                  underline:
                                    type: boolean
                                    description: '`true` if the text is underlined.'
                                  arrangement:
                                    type: string
                                    description: 'How the text is laid out in the field. `none`: regular text. `cells`: one character per cell.'
                                  page_number:
                                    type: integer
                                    description: Zero-based number of the page the field is on.
                                  stretch_mode:
                                    type: string
                                    description: How the field resizes to fit its content, for example `fixed`.
                                  validator_id:
                                    type: string
                                    description: ID of the validator applied to the field. See `field_validators`.
                                  allowed_types:
                                    type: array
                                    items:
                                      type: string
                                    description: 'For `signature` fields: the ways the recipient can add a signature. Possible values: `type`, `draw`, `upload`.'
                                  prefilled_text:
                                    type: string
                                    description: Default value of the field. Returned only if set.
                                  lock_to_sign_date:
                                    type: boolean
                                    description: 'For date fields: `true` if the field is filled with the signing date and cannot be changed.'
                                  lock_to_sign_prefill:
                                    type: boolean
                                    description: '`true` if the prefilled value cannot be changed by the recipient.'
                                description: Position, size, and settings of the field. The set of keys depends on the field type.
                              field_request_id:
                                type: string
                                description: ID of the field invite the field belongs to. Can be `null`.
                              template_field_id:
                                type:
                                - string
                                - 'null'
                                description: ID of the corresponding field in the source template. Can be `null`.
                              field_request_canceled:
                                type:
                                - string
                                - 'null'
                                description: Whether the field request was canceled. Can be `null`.
                          description: List of fillable fields defined on the document. Documents and templates only.
                        pinned:
                          type: boolean
                          description: Whether the entity is pinned.
                        status:
                          type: string
                          description: Status of the document group. Document groups only.
                        created:
                          description: Unix timestamp of when the entity was created. A string for documents and templates, an integer for document groups and document group templates.
                        inserts:
                          type: array
                          items:
                            type: object
                          description: List of text inserts added to the document. Documents and templates only.
                        invites:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: ID of the invite.
                              email:
                                type: string
                                description: Email address of the recipient.
                              order:
                                type: integer
                                description: Step of the invite in the signing order.
                              action:
                                type: string
                                description: Action requested from the recipient.
                              status:
                                type: string
                                description: Status of the invite.
                              created:
                                type: integer
                                description: Unix timestamp of when the invite was created.
                              updated:
                                type: integer
                                description: Unix timestamp of the last invite update.
                              compliance:
                                type: object
                                properties:
                                  cfr:
                                    description: 21 CFR Part 11 settings. Can be `null`.
                                description: Compliance settings of the invite.
                              document_id:
                                type: string
                                description: ID of the document.
                              email_group:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: ID of the email group. Can be `null`.
                                  name:
                                    type: string
                                    description: Name of the email group. Can be `null`.
                                description: Email group the invite was sent to. `id` and `name` are `null` if the invite was sent to a single recipient.
                              is_embedded:
                                type: boolean
                                description: Whether the invite is an embedded invite.
                              document_name:
                                type: string
                                description: Name of the document.
                              authentication:
                                type: string
                                description: Authentication method required from the recipient, for example `password`. `null` if none.
                              signature_type:
                                description: Type of signature required from the recipient. Can be `null`.
                              expiration_time:
                                type: integer
                                description: Unix timestamp of when the invite expires. Can be `null`.
                              is_draft_exists:
                                description: Whether the recipient has saved a draft.
                              password_method:
                                type: string
                                description: Method used to deliver the invite password. Empty if no password is set.
                              payment_request:
                                description: Payment request attached to the invite. Can be `null`.
                              is_full_declined:
                                type: boolean
                                description: Whether the recipient declined the invite.
                              sms_sent_statuses:
                                type: array
                                items:
                                  type: object
                                description: SMS delivery events for the invite. Empty for email invites.
                              is_document_locked:
                                type: string
                                description: '`"1"` if the document is locked for this recipient, otherwise `"0"`.'
                              password_protected:
                                type: string
                                description: '`"1"` if the invite is password-protected, otherwise `"0"`.'
                              email_sent_statuses:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    status:
                                      type: string
                                      description: Delivery status.
                                    created_at:
                                      type: integer
                                      description: Unix timestamp of when the status was first recorded.
                                    last_reaction_at:
                                      type: integer
                                      description: Unix timestamp of the latest status update.
                                description: Delivery statuses of the invite email.
                              signer_phone_invite:
                                type: string
                                description: Phone number the SMS invite was sent to. `null` for email invites.
                          description: Invites sent for the document group. Document groups and document group templates only.
                        updated:
                          description: Unix timestamp of the last update. A string for documents and templates, an integer for document groups and document group templates.
                        user_id:
                          type: string
                          description: ID of the owner.
                        requests:
                          type: array
                          items:
                            type: object
                          description: List of document requests. Documents and templates only.
                        settings:
                          type:
                          - object
                          - 'null'
                          description: Account and organization settings that apply to the document, keyed by setting name, for example `require_drawn_signatures` or `restrict_download`. The set of keys depends on the account and can change. Documents and templates only. Can be `null`.
                          additionalProperties: true
                        template:
                          type: boolean
                          description: Indicates whether the document is a template. `true` if it is a template, `false` otherwise. Documents and templates only.
                        documents:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: ID of the document.
                              name:
                                type: string
                                description: Name of the document.
                              roles:
                                type: array
                                items:
                                  type: string
                                description: Names of the roles in the document.
                              updated:
                                type: integer
                                description: Unix timestamp of the last document update.
                              settings:
                                type:
                                - object
                                - 'null'
                                description: Settings of the document in the group, for example `advanced_signing_flow`. Can be `null`.
                                additionalProperties: true
                              thumbnail:
                                type: object
                                properties:
                                  large:
                                    type: string
                                    description: URL of the large thumbnail.
                                  small:
                                    type: string
                                    description: URL of the small thumbnail.
                                  medium:
                                    type: string
                                    description: URL of the medium thumbnail.
                                description: Links to the document thumbnail images.
                              has_fields:
                                type: boolean
                                description: Whether the document has fillable fields.
                              page_count:
                                type: integer
                                description: Number of pages in the document. Can be `null` for templates in a document group template.
                              signatures:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: ID of the signature.
                                    created:
                                      type: string
                                      description: Unix timestamp of when the signature was added.
                                    user_id:
                                      type: string
                                      description: ID of the signer.
                                description: Signatures applied to the document.
                          description: Documents in the group. Document groups and document group templates only.
                        invite_id:
                          type: string
                          description: ID of the document group invite. Can be `null`. Document groups and document group templates only.
                        parent_id:
                          type: string
                          description: ID of the folder that contains the entity.
                        thumbnail:
                          type: object
                          properties:
                            large:
                              type: string
                              description: URL of the large thumbnail.
                            small:
                              type: string
                              description: URL of the small thumbnail.
                            medium:
                              type: string
                              description: URL of the medium thumbnail.
                          description: Links to the document thumbnail images in `small`, `medium`, and `large` sizes. Documents and templates only.
                        page_count:
                          type: string
                          description: Number of pages in the document, as a string. Documents and templates only.
                        share_info:
                          type: object
                          properties:
                            role:
                              type: string
                              description: 'Access level of the current user. Possible values: `sender`, `viewer`, `owner`.'
                          description: Sharing information. Templates only.
                        signatures:
                          type: array
                          items:
                            type: object
                            properties:
                              x:
                                type: string
                                description: Horizontal position of the signature, in pixels, as a string.
                              y:
                                type: string
                                description: Vertical position of the signature, in pixels, as a string.
                              id:
                                type: string
                                description: ID of the signature.
                              data:
                                type: string
                                description: Base64-encoded image of the signature.
                              email:
                                type: string
                                description: Email address of the user who added the signature.
                              width:
                                type: string
                                description: Width of the signature, in pixels, as a string.
                              height:
                                type: string
                                description: Height of the signature, in pixels, as a string.
                              created:
                                type: string
                                description: Unix timestamp of when the signature was added, as a string.
                              user_id:
                                type: string
                                description: ID of the user who added the signature.
                              page_number:
                                type: string
                                description: Zero-based number of the page the signature is on, as a string.
                          description: List of applied signature elements on the document. Documents and templates only.
                        attachments:
                          type: array
                          items:
                            type: object
                          description: List of file attachments on the document. Documents and templates only.
                        entity_type:
                          type: string
                          description: 'Type of the entity. Possible values: `document`, `template`, `document-group`, `dgt`.'
                        is_favorite:
                          type: boolean
                          description: Whether the entity is marked as a favorite.
                        integrations:
                          type: array
                          items:
                            type: object
                          description: List of third-party integrations associated with the document. Documents and templates only.
                        radiobuttons:
                          type: array
                          items:
                            type: object
                          description: List of radio button groups on the document. Documents and templates only.
                        version_time:
                          type: string
                          description: Unix timestamp of the document version. Documents and templates only.
                        viewer_roles:
                          type: array
                          items:
                            type: object
                            x-stoplight:
                              id: 6ftboaddm6opk
                          description: List of viewer roles defined for the document. Documents and templates only.
                          x-stoplight:
                            id: om4q3nh5hu360
                        document_name:
                          type: string
                          description: Name of the document. Documents and templates only.
                        entity_labels:
                          type: array
                          items:
                            type: object
                          description: System labels assigned to the entity, such as `declined` or `undelivered`.
                        field_invites:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: ID of the field invite.
                              role:
                                type: string
                                description: Name of the signer role.
                              email:
                                type: string
                                description: Email address of the signer. For an SMS invite, a generated placeholder address.
                              pfrid:
                                type:
                                - string
                                - 'null'
                                description: ID of the payment request.
                              status:
                                type: string
                                description: Status of the invite, for example `pending`, `fulfilled`, or `declined`.
                              created:
                                type: string
                                description: Unix timestamp of when the invite was created, as a string.
                              pfrtype:
                                type:
                                - string
                                - 'null'
                                description: Type of the payment request.
                              role_id:
                                type: string
                                description: ID of the signer role.
                              updated:
                                type: string
                                description: Unix timestamp of the last invite update, as a string.
                              declined:
                                type: array
                                items:
                                  type: object
                                description: Decline details. Empty if the signer has not declined.
                              reassign:
                                type: string
                                description: '`"1"` if the signer can reassign the invite, otherwise `"0"`.'
                              reminder:
                                type: string
                                description: '`"1"` if reminders are enabled for the invite, otherwise `"0"`.'
                              pframount:
                                type:
                                - string
                                - 'null'
                                description: Amount of the payment request.
                              pfrstatus:
                                type:
                                - string
                                - 'null'
                                description: Status of the payment request.
