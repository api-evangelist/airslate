                    description: 'Current state of the document group. Possible values: `created` — the document group has been created; `pending` — an invite has been sent and is awaiting signing; `canceled` — the document group invite was canceled; `completed` — all signing steps are completed; `declined` — one of the signers declined to sign; `correction` — the document group is in correction mode.'
