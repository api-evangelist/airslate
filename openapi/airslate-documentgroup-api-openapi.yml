        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                application/json:
                  status: success
        '400':
          description: '* Incorrect email

            * Incorrect group invite id in endpoint

            * Incorrect group id in endpoint

