  /documentgroup:
    post:
      operationId: create-document-group
      summary: Create document group
      description: 'Creates a document group from a list of document ids


        All documents:

        * Must be owned by the person creating the document group.

        * Cannot be templates.

        * Cannot already be a part of another document group (delete document group first to add them).

        * Cannot have active or fulfilled invites.


        For more information, check out our video tutorial.


        **Video tutorial**


        Note: The design shown in the video is outdated, but the flow is still accurate. You can go ahead and follow the steps as demonstrated.


        Video tutorial'
      responses:
        '200':
          description: Document group successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                x-examples:
                  Example 1:
                    id: 68XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
              example:
                Example 1:
                  id: 68XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                application/json:
                  id: 68XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        '400':
          description: "\t\nRequest with incorrect authorization:\n\n* incorrect token\n* expired token\n* empty authorization header\n* authorization = null\n* authorization header without value\n\nOther errors:\n* Incorrect payload\n* Incorrect `document_ids` property\n* `document_ids` array not containing documents\n* Document not found\n* Document not found or belongs to another user\n* Document is a template\n* Document already part of another document group\n* Missing `group_name` property\n* Document has active or fulfilled invites"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                x-examples:
                  Example 1:
                    code: 1537
                    message: invalid_token
              example:
                Example 1:
                  code: 1537
                  message: invalid_token
                Incorrect token:
                  code: 1537
                  message: invalid_token
                Incorrect payload:
                  errors:
                  - code: 65536
                    message: Invalid payload
                Document not found:
                  errors:
                  - code: 65582
                    message: Document "{document_id}" could not be found, make sure the id is correct and the user owns the document
                document_ids empty:
                  errors:
                  - code: 65582
                    message: No documents provided
                Document has invites:
                  errors:
                  - code: 65582
                    message: Document {document_id} already has active or fulfilled invites.
                Document is template:
                  errors:
                  - code: 65582
                    message: Document {template_id} is a template
                Incorrect document_ids:
                  errors:
                  - code: 65582
                    message: document_ids property is missing, empty, or not an array
                Missing group_name property:
                  errors:
                  - code: 65582
                    message: group_name property is empty
                Document is part of another document group:
                  errors:
                  - code: 65582
                    message: Document {document_id} is already part of a document group
                Document not found or belongs to another user:
                  errors:
                  - code: 65582
                    message: Document "{document_id}" could not be found, make sure the id is correct and the user owns the document
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - document_ids
              - group_name
              properties:
                group_name:
                  type: string
                document_ids:
                  type: array
                  items:
                    type: string
        required: true
      tags:
      - Documentgroup
