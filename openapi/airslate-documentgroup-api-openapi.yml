              properties:
                invite_steps:
                  type: array
                  items:
                    type: object
                    required:
                    - order
                    - invite_actions
                    properties:
                      order:
                        type: integer
                        example: 1
                        description: 'Signing order step. All signers assigned to a specific order step (e.g., order: 1) receive the invite email simultaneously. Emails for the next order step (e.g., order: 2) are sent only after all actions in the previous order step are completed.'
                      invite_emails:
                        type: array
                        items:
                          type: object
                          required:
                          - email
                          properties:
                            email:
                              type: string
                              example: signer@email.com
                              description: Recipient email address.
                        description: An array of recipient emails within this step.
                      invite_actions:
                        type: array
                        items:
                          type: object
                          properties:
                            email:
                              type: string
                              example: signer@email.com
                              description: Recipient email address.
                            action:
                              type: string
                              example: sign
                              description: 'The action required from the recipient in the document. Allowed values: `sign`, `view`, `approve`.'
                            role_name:
                              type: string
                              example: Signer
                              description: Recipient role name.
                            document_id:
                              type: string
                              example: d31bb646ccca47aa9ab91eeb04c27458aeyyyyye
                              description: ID of the document on which the action is required.
                            payment_request:
                              type: object
                              required:
                              - type
                              - currency
                              - merchants
                              - field_type
                              - field_id
                              - amount
                              properties:
                                type:
                                  type: string
                                  example: fixed
                                  description: 'The type of the payment request. Allowed values: `fixed`, `calculated`.'
                                amount:
                                  type: string
                                  example: '1000'
                                  description: Payment amount. Required for the `fixed` payment type.
                                currency:
                                  type: string
                                  example: USD
                                  description: Payment currency in ISO format.
                                field_id:
                                  type: string
                                  example: eb1dc1e1946f47cd87fa4a63664803bddbazzzz
                                  description: The ID of the field that defines the payment amount. Required for the `calculated` payment type. Can be found in the [Get document](/docs/document/operations/get-document) response.
                                merchants:
                                  type: array
                                  items:
                                    type: string
                                  description: IDs of connected payment service accounts. Can be found in the [Get merchant account](/docs/request-payments/operations/get-organizations-org-id-merchantaccount-merchant-account-id) response.
                                field_name:
                                  type: string
                                  example: payment_field
                                  description: The name of the field that defines the payment amount. Used for the `calculated` payment type. Can be found in the [Get document](/docs/document/operations/get-document) response.
                                field_type:
                                  type: string
                                  example: text_fields
                                  description: The field type that defines the payment amount. Required for the `calculated` payment type. Allowed value is `text_fields`.
                              description: An object with the payment request configuration.
                        description: An array of objects, where each object defines a recipient, their role, and the corresponding action for a document.
                  description: Steps of the document group invite. Every step contains the `order` number, `invite_emails` and `invite_actions` within this step.
              x-examples:
