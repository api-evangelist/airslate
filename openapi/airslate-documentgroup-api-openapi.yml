  /documentgroup/{group_id}/groupinvite:
    post:
      operationId: post
      summary: Send doc group invite with payment request
      description: 'This endpoint allows users to send a document group invite with a payment request. Recipients will be redirected to the payment page after completing the documents.


        > To request a payment, users must either connect to the payment service individually or accept an invitation to an organization already connected to the payment service.


        - To connect your organization to the payment service, see Connect to merchant account.


        - To connect a personal SignNow account to the payment service, see Connect to personal merchant account.


        A payment request can be linked to a specific field (`calculated` type) or set as a fixed amount (`fixed`type).


        This article lists only the parameters required for a payment request. For other document group invite parameters, see Invite to sign doc group.


        **Use additional attributes to customize the request**


        | Parameter | Description | Example |

        | --- | --- | --- |

        | `field_type` | Type of the field that sets the payment amount. Required if the request `type` is `calculated`. For a payment request invite, `filed_type` is `text_fields`. | |

        | `field_name` | Name of the field that sets the payment amount. Used if the `type` is `calculated`. Can be found in the Get document response (fields.name). | See the screenshot above. |

        | `type` | Defines how the payment amount is set. Allowed values: `fixed` (the amount is set in the amount field) and `calculated` (set using a document field).


        Learn how to add a payment request field. | |

        | `currency` | Payment currency in ISO format. | |

        | `amount` | Amount of payment. Required if `type` is ''fixed''. | See the screenshot above. |'
      parameters:
      - in: path
        name: group_id
        required: true
        description: ID of the document group
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  pending_invite_link:
                    type: 'null'
                x-examples:
                  Example 1:
                    id: XXXXe0ea656944f3b833d0baeb1067f02490YYYY
                    pending_invite_link: null
              example:
                Example 1:
                  id: XXXXe0ea656944f3b833d0baeb1067f02490YYYY
                  pending_invite_link: null
        '400':
          description: "- `field_id` is empty or missing. \n- `field_type` is missing or incorrect.\n- `amount` is empty or missing.\n- `currency` is missing.\n- `type` is missing.\n- `merchants` is empty.\n- Merchant ID is incorrect."
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 65536
                      message: 'Invalid field type, valid types are: text_fields'
              example:
                Example 1:
                  errors:
                  - code: 65536
                    message: 'Invalid field type, valid types are: text_fields'
                Merchants empty:
                  errors:
                  - code: 65536
                    message: Required at least one merchant account in payment request
                currency missing:
                  errors:
                  - code: 65536
                    message: Must provide currency type for payments
                Merchant ID incorrect:
                  errors:
                  - code: 65536
                    message: Invalid merchant_id in payment_field_request
                amount empty or missing:
                  errors:
                  - code: 65536
                    message: For fixed payment types, please enter non zero amount
                field_id empty or missing:
                  errors:
                  - code: 65536
                    message: Invalid field id provided
                field_type missing or incorrect:
                  errors:
                  - code: 65536
                    message: 'Invalid field type, valid types are: text_fields'
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
