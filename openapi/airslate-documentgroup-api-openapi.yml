  /documentgroup/{document_group_id}/scheduled-invite:
    post:
      operationId: post-document-group-scheduled-invite
      summary: Create scheduled invite
      description: 'This endpoint allows API users to create a scheduled document group invite. At the moment specified by `scheduled_timestamp`, the invite is sent to recipients automatically. Both freeform invite and field invite can be sent.


        **Notes**


        * A paid API plan or Site License is required to create a scheduled invite.

        * `scheduled_timestamp` must be a Unix timestamp (in seconds) that points to a moment in the future.

        * The invite type is detected from the `invite_data` payload shape:

        * If the documents in the group do **not** contain fields, pass a freeform invite payload in `invite_data`.

        * If the documents in the group contain fields, pass a field invite payload in `invite_data`.

        * Each document group can have only one scheduled invite in the `active` status.'
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group for which the scheduled invite is created.
        schema:
          type: string
      responses:
        '204':
          description: Returned when the scheduled invite passes validation and is stored with the `active` status. The response body is empty.
        '400':
          description: 'Validation errors for the scheduled invite payload:


            * `scheduled_timestamp` is missing, null, not an integer, or points to a moment in the past.

            * `invite_data` is missing, null, of the wrong type, or empty.

            * The document group already has an active scheduled invite.

            * The document group already has an active group invite.

            * The user is not the document group owner.


            In addition, all validation errors that apply to the regular invite payload also apply to the contents of `invite_data`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                invite_data is null:
                  errors:
                  - code: 65536
                    message: The `invite_data` value should not be null.
                invite_data is empty:
                  errors:
                  - code: 65536
                    message: The `invite_data` value must not be an empty array.
                invite_data wrong type:
                  errors:
                  - code: 65536
                    message: The `invite_data` value should be of type array.
                Incorrect scheduled time:
                  errors:
                  - code: 65582
                    message: Incorrect scheduled time for invite.
                Group invite already exists:
                  errors:
                  - code: 65582
                    message: An invite already exists for this document group.
                scheduled_timestamp is null:
                  errors:
                  - code: 65536
                    message: The `scheduled_timestamp` value should not be null.
                scheduled_timestamp wrong type:
                  errors:
                  - code: 65536
                    message: The `scheduled_timestamp` value should be of type int.
                Scheduled invite already exists:
                  errors:
                  - code: 65582
                    message: A scheduled invite already exists.
                User is not document group owner:
                  errors:
                  - code: 65582
                    message: User is not document group owner
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - scheduled_timestamp
              - invite_data
              properties:
                invite_data:
                  type: object
                  description: 'The full document group invite payload. The invite type is detected from the payload shape:


                    * Send the same body as the [Create freeform document group invite](/docs/doc-group-freeform-invite/operations/post-v2-document-groups-document-group-id-free-form-invites) endpoint when the documents in the group do not contain fields.

                    * Send the same body as the [Create field invite](/docs/doc-group-field-invite/operations/invite-to-sign-document-group) endpoint when the documents in the group contain fields.'
                scheduled_timestamp:
                  type: integer
                  example: 1820000000
                  description: Unix timestamp (in seconds) of the moment when the prepared invite must be sent. Must be a positive integer that points to a moment in the future.
              x-examples:
                Field invite (document group with fields):
                  invite_data:
                    cc:
                    - cc-recipient@email.com
                    order_type: recipient_order
                    invite_steps:
                    - order: 1
                      invite_emails:
                      - email: approver@email.com
                        message: Review and approve before sending to the signer.
                        subject: Please approve the document
                        expiration_days: 30
                      invite_actions:
                      - email: approver@email.com
                        action: approve
                        role_name: Approver
                        document_id: 30XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        redirect_uri: https://example.com/
                        authentication:
                          type: phone
                          phone: '+12025550123'
                          method: phone_call
                        redirect_target: blank
                    - order: 2
                      invite_emails:
                      - email: signer1@email.com
                        message: Hi, please sign this document group.
                        subject: Please sign
                        reminder:
                          remind_after: 5
                          remind_before: 3
                          remind_repeat: 2
                        expiration_days: 30
                      invite_actions:
                      - email: signer1@email.com
                        action: sign
                        role_name: Signer 1
                        document_id: 30XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        redirect_uri: https://example.com/
                        allow_reassign: '0'
                        authentication:
                          type: password
                          value: '123456'
                        redirect_target: blank
                        decline_by_signature: '0'
                        decline_redirect_uri: https://example.com/
                    - order: 3
                      invite_emails:
                      - email: viewer@email.com
                        message: The document has been signed. You can view it.
                        subject: Signed document
                      invite_actions:
                      - email: viewer@email.com
                        action: view
                        role_name: Viewer
                        document_id: 30XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    sign_as_merged: false
                  scheduled_timestamp: 1820000000
                Freeform invite (document group without fields):
                  invite_data:
                    cc:
                    - email: cc-recipient@email.com
                    to:
                    - email: signer1@email.com
                      language: en
                      redirect_uri: https://example.com/
                      redirect_target: blank
                    message: Please sign this document group.
                    subject: Please sign this document group
                    redirect_uri: https://example.com/
                    client_timestamp: 1820000000
                  scheduled_timestamp: 1820000000
        required: true
      tags:
      - Documentgroup
    put:
      operationId: put-document-group-scheduled-invite
      summary: Update scheduled invite
      description: 'This endpoint allows API users to update the `scheduled_timestamp` of an active scheduled document group invite. Only the timing can be changed; to change the invite payload itself, cancel the active scheduled invite and create a new one.


        **Notes**


        * A paid API plan or Site License is required.

        * The new `scheduled_timestamp` must be a Unix timestamp (in seconds) that points to a moment in the future.

        * The document group must have a scheduled invite in the `active` status.'
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group for which the scheduled invite is created.
        schema:
          type: string
      responses:
        '200':
          description: Returned when the scheduled invite is successfully rescheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                x-examples:
                  Success:
                    result: success
              example:
                Success:
                  result: success
        '400':
          description: 'Validation errors for the update payload:


            * `scheduled_timestamp` is missing, null, not an integer, or points to a moment in the past.

            * The document group does not have an active scheduled invite.

            * The user is not the document group owner.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                Incorrect scheduled time:
                  errors:
                  - code: 65582
                    message: Incorrect scheduled time for invite.
                scheduled_timestamp is null:
                  errors:
                  - code: 65536
                    message: The `scheduled_timestamp` value should not be null.
                scheduled_timestamp wrong type:
                  errors:
                  - code: 65536
                    message: The `scheduled_timestamp` value should be of type int.
                User is not document group owner:
                  errors:
                  - code: 65582
                    message: User is not document group owner
                Active scheduled invite not found:
                  errors:
                  - code: 65582
                    message: Active scheduled invite not found.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - scheduled_timestamp
              properties:
                scheduled_timestamp:
                  type: integer
                  example: 1820000000
                  description: New Unix timestamp (in seconds) of the moment when the prepared invite must be sent. Must be a positive integer that points to a moment in the future.
              x-examples:
                Correct request:
                  scheduled_timestamp: 1820000000
        required: true
      tags:
      - Documentgroup
    delete:
      operationId: delete-document-group-scheduled-invite
      summary: Cancel scheduled invite
      description: This endpoint allows API users to cancel an active scheduled document group invite. Once cancelled, the scheduled invite is no longer in the `active` status and will not be sent at the originally scheduled time. After cancellation, a new scheduled invite can be created for the same document group.
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group for which the scheduled invite is created.
        schema:
          type: string
      responses:
        '200':
          description: Returned when the active scheduled invite is successfully cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                x-examples:
                  Success:
                    result: success
              example:
                Success:
                  result: success
        '400':
          description: 'Errors:


            * The document group does not have an active scheduled invite.

            * The user is not the document group owner.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                User is not document group owner:
                  errors:
                  - code: 65582
                    message: User is not document group owner
                Active scheduled invite not found:
                  errors:
                  - code: 65582
                    message: Active scheduled invite not found.
      security:
      - Bearer: []
      tags:
      - Documentgroup
  /documentgroup/{document_group_id}/scheduled-invite/send:
    post:
      operationId: post-document-group-scheduled-invite-send
      summary: Send scheduled invite
      description: This endpoint allows API users to send an active scheduled document group invite immediately, bypassing the originally scheduled time. After the invite is sent, the scheduled record is removed from the `active` status.
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group whose scheduled invite is sent immediately.
        schema:
          type: string
      responses:
        '200':
          description: 'Returned when the scheduled invite is sent successfully. The response shape depends on the invite type: field invite returns `id` and `pending_invite_link`; freeform invite returns a `data` object that contains `id`.'
          content:
            application/json:
              schema:
                type: object
                description: 'Field invite shape: `{id, pending_invite_link}`. <br> Freeform invite shape: `{data: {id}}`. <br> See examples.'
              example:
                Field invite:
                  id: cf167dedcbe2466287033ddffb32fb18c4ad5340
                  pending_invite_link: null
                Freeform invite:
                  data:
                    id: cf167dedcbe2466287033ddffb32fb18c4ad5346
        '400':
          description: 'Errors:


            * The document group does not have an active scheduled invite.

            * The user is not the document group owner.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                User is not document group owner:
                  errors:
                  - code: 65582
                    message: User is not document group owner
                Active scheduled invite not found:
                  errors:
                  - code: 65582
                    message: Active scheduled invite not found.
      security:
      - Bearer: []
      tags:
      - Documentgroup
components:
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
    Basic:
      type: http
      scheme: basic
