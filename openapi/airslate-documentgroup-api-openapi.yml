openapi: 3.2.0
info:
  title: SignNow Documentgroup API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Documentgroup
paths:
  /documentgroup/{document_group_id}/groupinvite/{invite_id}:
    get:
      operationId: get-document-group-invite
      summary: Get doc group invite
      description: 'This endpoint returns document group invite information, including the status of each field invite, step and action.


        Here is the list of possible invite, action and step statuses:

        - `created`: invite, action, or step has been created but is not waiting to be signed.

        - `pending`: emails have been sent out for this invite action or step and are waiting to be viewed or signed.

        - `fulfilled`: the invite, action, or step has been completed by signing, viewing or approving.

        - `correction`: the step recipient is modifying the invite.

        - `canceled`: the invite or step has been canceled by the recipient.


        Possible invite actions are:

        - `view`: The recipient can only review the document without making changes.

        - `sign`: The recipient can sign or fill out the document.

        - `approve`: The recipient can review the document to approve or decline it.'
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group.
        schema:
          type: string
      - in: path
        name: invite_id
        required: true
        description: ID of the document group invite.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID of the document group invite.
                      steps:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: ID of the invite step.
                            order:
                              type: integer
                              description: Position of the step in the signing order, starting at `1`.
                            status:
                              type: string
                              description: Status of the step. One of `created`, `pending`, `fulfilled`, `correction`, or `canceled`.
                            actions:
                              type: array
                              items:
                                type: object
                                properties:
                                  email:
                                    type:
                                    - string
                                    - 'null'
                                    description: Email address of the recipient. `null` when the recipient is invited by SMS (see `signer_phone_invite`).
                                  action:
                                    type: string
                                    description: Action assigned to the recipient. One of `sign`, `approve`, or `view`.
                                  status:
                                    type: string
                                    description: Status of the action. One of `created`, `pending`, `fulfilled`, `correction`, or `canceled`.
                                  role_name:
                                    type: string
                                    description: Name of the recipient's role in the document.
                                  document_id:
                                    type: string
                                    description: ID of the document within the document group this action applies to.
                                  signer_phone_invite:
                                    type:
                                    - string
                                    - 'null'
                                    description: Phone number of the recipient invited by SMS, in E.164 format (`+` followed by up to 13 digits). `null` when the recipient is invited by email. Use this value as `phone_invite_to_update` when calling [Update doc group invite](/docs/doc-group-field-invite/operations/update-document-group-invite).
                              description: Recipients and the actions assigned to them within this step.
                        description: Ordered list of invite steps in the document group invite.
                      status:
                        type: string
                        description: Status of the document group invite. One of `created`, `pending`, `fulfilled`, `correction`, or `canceled`.
                    description: The document group invite.
                x-examples:
                  Success:
                    invite:
                      id: b1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                      steps:
                      - id: abXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        order: 1
                        status: pending
                        actions:
                        - email: signer1@email.com
                          action: sign
                          status: pending
                          role_name: Signer 1
                          document_id: ddXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          signer_phone_invite: null
                        - action: sign
                          status: pending
                          role_name: Signer 1
                          document_id: ddXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          email_group:
                            id: unique_id_of_the_group
                            name: group name
                          signer_phone_invite: null
                        - email: signer2@email.com
                          action: sign
                          status: pending
                          role_name: Signer 2
                          document_id: cdXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          signer_phone_invite: null
                        - email: null
                          action: sign
                          status: pending
                          role_name: Signer 2 (SMS)
                          document_id: cdXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          signer_phone_invite: '+14075985199'
                      - id: deXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        order: 2
                        status: created
                        actions:
                        - email: signer3@email.com
                          action: sign
                          status: created
                          role_name: Signer 3
                          document_id: ddXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          signer_phone_invite: null
                        - email: signer4@email.com
                          action: sign
                          status: created
                          role_name: Signer 4
                          document_id: ddXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          signer_phone_invite: null
                      - id: c1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        order: 3
                        status: created
                        actions:
                        - email: signer5@email.com
                          action: sign
                          status: created
                          role_name: Signer 5
                          document_id: cdXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          signer_phone_invite: null
                        - email: signer6@email.com
                          action: sign
                          status: created
                          role_name: Signer 6
                          document_id: cdXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                          signer_phone_invite: null
                      status: pending
              example:
                Success:
                  invite:
                    id: b1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    steps:
                    - id: abXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                      order: 1
                      status: pending
                      actions:
                      - email: signer1@email.com
                        action: sign
                        status: pending
                        role_name: Signer 1
                        document_id: ddXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        signer_phone_invite: null
                      - action: sign
                        status: pending
                        role_name: Signer 1
                        document_id: ddXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        email_group:
                          id: unique_id_of_the_group
                          name: group name
                        signer_phone_invite: null
                      - email: signer2@email.com
                        action: sign
                        status: pending
                        role_name: Signer 2
                        document_id: cdXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        signer_phone_invite: null
                      - email: null
                        action: sign
                        status: pending
                        role_name: Signer 2 (SMS)
                        document_id: cdXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        signer_phone_invite: '+14075985199'
                    - id: deXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                      order: 2
                      status: created
                      actions:
                      - email: signer3@email.com
                        action: sign
                        status: created
                        role_name: Signer 3
                        document_id: ddXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        signer_phone_invite: null
                      - email: signer4@email.com
                        action: sign
                        status: created
                        role_name: Signer 4
                        document_id: ddXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        signer_phone_invite: null
                    - id: c1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                      order: 3
                      status: created
                      actions:
                      - email: signer5@email.com
                        action: sign
                        status: created
                        role_name: Signer 5
                        document_id: cdXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        signer_phone_invite: null
                      - email: signer6@email.com
                        action: sign
                        status: created
                        role_name: Signer 6
                        document_id: cdXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        signer_phone_invite: null
                    status: pending
        '400':
          description: '* Incorrect group invite id in the endpoint

            * Incorrect group id in the endpoint'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 65582
                      message: unable to find document group invite of f1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
              example:
                Example 1:
                  errors:
                  - code: 65582
                    message: unable to find document group invite of f1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                Incorrect group id in the endpoint:
                  errors:
                  - code: 65582
                    message: unable to find document group
                Incorrect group invite id in the endpoint:
                  errors:
                  - code: 65582
                    message: unable to find document group invite of f1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      security:
      - Bearer: []
      tags:
      - Documentgroup
  /documentgroup/{document_group_id}/groupinvite/{invite_id}/invitestep/{step_id}/emails:
    get:
      operationId: get-emails-invite-step
      summary: Get emails of the invite step
      description: Returns emails and other parameters of a particular invite step in the document group invite.
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: invite_id
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: step_id
        required: true
        description: ID of a step in the invite.
        schema:
          type: string
      responses:
        '200':
          description: Returns signer's email addresses in the invite step and email settings for each of them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    type: object
                    properties:
                      id:
                        type: string
                      steps:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            order:
                              type: integer
                            status:
                              type: string
                            actions:
                              type: array
                              items:
                                type: object
                                properties:
                                  email:
                                    type: string
                                  action:
                                    type: string
                                  status:
                                    type: string
                                  role_name:
                                    type: string
                                  document_id:
                                    type: string
                      status:
                        type: string
              example:
                application/json:
                  emails:
                  - email: signer1@email.com
                    message: document_owner@email.com invited you to sign pdf
                    subject: document_owner@email.com Needs Your Signature
                    disabled: null
                    reminder:
                      remind_after: 3
                      remind_before: 0
                      remind_repeat: 5
                    expiration_days: 30
                  - email: signer2@email.com
                    message: document_owner@email.com invited you to sign pdf
                    subject: document_owner@email.com Needs Your Signature
                    disabled: null
                    reminder:
                      remind_after: 2
                      remind_before: 1
                      remind_repeat: 3
                    expiration_days: 30
                  - email: signer3@email.com
                    message: document_owner@email.com invited you to sign pdf
                    subject: document_owner@email.com Needs Your Signature
                    disabled: null
                    reminder:
                      remind_after: 0
                      remind_before: 0
                      remind_repeat: 0
                    expiration_days: 30
      security:
      - Bearer: []
      tags:
      - Documentgroup
  /documentgroup/{document_group_id}/groupinvite/{invite_id}/pendinginvites:
    get:
      operationId: get-pending-document-group-invites
      summary: Get pending group invites
      description: 'This endpoint allows users to retrieve all pending document group invite information.

        If the caller is the document owner, the response includes both pending invites for that user and all fulfilled actions for the entire group invite.


        Possible invite actions are:

        - `sign`: The recipient can sign or fill out the document.

        - `approve`: The recipient can review the document to approve or decline it.

        - `view`: The recipient can only review the document without making changes.'
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: ID of the document group.
        schema:
          type: string
      - in: path
        name: invite_id
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        link:
                          type: string
                        action:
                          type: string
                        status:
                          type: string
                        document_name:
                          type: string
                        inviter_email:
                          type: string
                  document_group_name:
                    type: string
              example:
                application/json:
                  invites:
                  - link: https://example.com/cdXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    action: sign
                    status: fulfilled
                    document_name: Sample Document
                    inviter_email: signer1@email.com
                  - link: https://example.com/ddXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    action: sign
                    status: pending
                    document_name: Contract 2
                    inviter_email: signer2@email.com
                  document_group_name: Contracts
      security:
      - Bearer: []
      tags:
      - Documentgroup
  /documentgroup/{document_group_id}/groupinvite:
    post:
      operationId: invite-to-sign-document-group
      summary: Invite to sign doc group
      description: 'This endpoint allows users to create an invite for signing a document group. You can configure a multistep workflow, where different recipients act on the document group at different stages.


        Recipients can receive the invite by email or by SMS: identify a recipient by `email` for email delivery or by `phone_invite` for SMS delivery. You can combine email and SMS recipients in a single request. For more information, see the SMS invite guide.


        Each invite step includes:


        - `order`: the sequence number of the step.

        - `invite_actions`: an array of objects specifying who is invited and the action they must perform:


        - **`sign`**: The recipient can sign or fill out the document.

        - **`approve`**: The recipient can review the document to approve or decline it.

        - **`view`**: The recipient can only review the document without making changes.


        - `invite_emails`: an array for customizing the emails sent to recipients at that step.

        - `invite_sms`: an array for customizing the SMS invites sent to recipients at that step: custom SMS text (`sms_message`), expiration, and reminder settings.


        Once all invite actions in a step are completed, the system sends the emails or SMS messages for the next step. When all steps are complete, completion emails are triggered.


        To invite a **signing group**, use the `email_groups` field. A signing group includes multiple email addresses, and the step is marked complete as soon as any member of the group signs. You can either use an existing group or define a new one by providing a 40-character ID, a group name, and the list of recipient emails.


        To create a signing group separately, see Create contact group.


        Learn more about an Invite to sign a document group.


        **Use additional attributes to customize signing experience**


        Parameter | Description | Example

        ---------|----------|---------

        `reassign` | A recipient can forward the invite by clicking **More Actions** > **Forward Invite** and entering an email address. |

        `force_new_signature` | A recipient must create a new signature for each signature field. |

        `prefill_signature_name` | A string with a signature name that appears when a signer clicks a signature field. The signer can edit the signature.|

        `required_preset_signature_name` | A string with a signature name that appears when a signer clicks a signature field. The signer cannot edit the signature. |

        `decline_by_signature` | When a signer clicks a signature field, they see two options: sign the fields and decline the document group. |

        `authentication_type` | Requires a recipient to enter a password or a code before viewing the document group. For more information, see Two-factor authentication. |'
      parameters:
      - in: path
        name: document_group_id
        required: true
        description: The ID of the document group
        schema:
          type: string
      responses:
        '200':
          description: Document group invite created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the created document group invite.
                  pending_invite_link:
                    type:
                    - string
                    - 'null'
                    description: Link for signers with pending invites.
                x-examples:
                  example-1:
                    id: 5e7d9934e1f544d187ba2fde985594342933d9d2
                    pending_invite_link: null
              example:
                example-1:
                  id: 5e7d9934e1f544d187ba2fde985594342933d9d2
                  pending_invite_link: null
                application/json:
                  id: 5e7d9934e1f544d187ba2fde985594342933d9d2
                  pending_invite_link: null
        '400':
          description: '* `invite_actions` consists of more than one action with the same `email_group` and the same `document_id`.

            * `role` not found.

            * `group_id` not found.

            * Invite already exists.


            **Validation errors**:


            * `language` is not a string.

            * Incorrect `language`.

            * One recipient must have the same `language`.

            * `redirect_uri` is not a string.

            * Empty `redirect_uri`.

            * `redirect_uri` is not a correct URL.

            * `redirect_uri` is longer than 2048 characters.

            * One recipient must have the same `redirect_uri`.

            * `decline_redirect_uri` is not a string.

            * Empty `decline_redirect_uri`.

            * `decline_redirect_uri` is not a correct URL.

            * `decline_redirect_uri` is longer than 2048 characters.

            * `decline_redirect_uri` cannot be used with the `view`.

            * One recipient must have the same `decline_redirect_uri`.

            * `close_redirect_uri` is not a string.

            * Empty `close_redirect_uri`.

            * `close_redirect_uri` is not a correct URL address

            * `close_redirect_uri` is longer than 2048 characters.

            *  One recipient must have the same `close_redirect_uri`.

            * `redirect_target` is not a string.

            * Incorrect `redirect_target`. Allowed values: `self`, `blank`.

            * One of redirect URLs is required if `redirect_target` is added.

            * One recipient must have the same `redirect_target`.

            * `invite_emails` contains both `email` and `email_group` (must contain only one of these).

            * `allow_reassign` is not allowed for an email group.

            * Incorrect format of `email_groups`.

            * Email group `id` or email group `name` is missing.

            * Email group `id` is not a string.

            * Email group `id` is not a correct unique id.

            * Email group `name` is not a string.

            * Email group `name` contains forbidden characters (4-byte characters, such as emojis).

            * Emails in `email_groups` are missing.

            * Emails in `email_groups` is not an array of arrays.

            * Emails in `email_groups` contains more than 15 emails.

            * Emails in an email group must be unique.

            * Email in `email_groups.emails` is not a string.

            * Email in `email_groups.emails` is not a correct email address.

            * `signature.type` is missing.

            * Incorrect `signature.type`. Allowed values: `eideasy`,`eideasy-pdf`, `nom151`.

            * Missing or different QES settings for one or more signers.

            * The `prefill_signature_name` format is wrong.

            * The `prefill_signature_name` is empty.

            * The`prefill_signature_name` contains unsupported characters.

            * The `prefill_signature_name` is too long.


            **SMS invite (`phone_invite`) errors**:


            * `phone_invite` type incorrect.

            * `phone_invite` empty.

            * `phone_invite` too long.

            * `phone_invite` format incorrect.

            * `phone_invite` in `invite_sms` type is incorrect.

            * `phone_invite` in `invite_sms` is empty.

            * `phone_invite` in `invite_sms` is too long.

            * `phone_invite` in `invite_sms` format is incorrect.

            * `expiration_days` in `invite_sms` type incorrect.

            * `expiration_days` in `invite_sms` range incorrect.

            * `remind_after` range incorrect.

            * `remind_before` range incorrect.

            * `remind_repeat` range incorrect.

            * `phone_invite` with CFR org setting enabled.

            * `phone_invite` with consent org setting enabled.

            * `phone_invite` with `require_login` setting enabled.

            * Incorrect phone number.

            * `allow_reassign` not allowed for `phone_invite`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                role not found:
                  errors:
                  - code: 65582
                    message: Role Signer 1 on document edXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX was not specified in any invite_actions. All roles must be used in all document groups
                Email not string:
                  errors:
                  - code: 65582
                    message: Field `email` in `email_groups.emails` should be of type string.
                Empty redirect_uri:
                  errors:
                  - code: 65536
                    message: Field `redirect_uri` must not be an empty string.
                Incorrect language:
                  errors:
                  - code: 65536
                    message: 'The `language` field is invalid, allowed values: "en", "es", "fr".'
                group_id not found:
                  errors:
                  - code: 65582
                    message: unable to find document group
                phone_invite empty:
                  errors:
                  - code: 65536
                    message: The `phone_invite` must not be empty string.
                CFR org restriction:
                  errors:
                  - code: 65582
                    message: The phone_invite cannot be used with the CFR setting enabled.
                consent restriction:
                  errors:
                  - code: 65582
                    message: The phone_invite cannot be used with the consent setting enabled.
                language not string:
                  errors:
                  - code: 65536
                    message: The `language` field must be a string.
                Missing redirect URL:
                  errors:
                  - code: 65536
                    message: The one of `redirect_uri` fields is required when `redirect_target` is added.
                Invite already exists:
                  errors:
                  - code: 65582
                    message: An group invite already exists for this document group.
                phone_invite too long:
                  errors:
                  - code: 65536
                    message: The `phone_invite` value is too long. It should have 14 characters.
                redirect_uri too long:
                  errors:
                  - code: 65536
                    message: The `redirect_uri` field must contain no more than 2048 characters.
                Duplicate viewer email:
                  errors:
                  - code: 65582
                    message: Two viewer actions in one order should not have one user email for document
                Incorrect phone number:
                  errors:
                  - code: 104833
                    message: The phone_invite value holds a non-existent phone number.
                Missing email group id:
                  errors:
                  - code: 65582
                    message: Field `id` in `email_groups` should not be blank.
                Missing signature.type:
                  code: 66390
                  message: Signature type could not be blank
                redirect_uri not a URL:
                  errors:
                  - code: 65536
                    message: Field `redirect_uri` must be a valid URL.
                Unmatching redirect_uri:
                  errors:
                  - code: 65536
                    message: The `redirect_uri` must be equal for the same signer.
                redirect_uri not string:
                  errors:
                  - code: 65536
                    message: Field `redirect_uri` must be of type string.
                Empty close_redirect_uri:
                  errors:
                  - code: 65536
                    message: The `close_redirect_uri` field must not be empty.
                Incorrect signature.type:
                  code: 66390
                  message: 'The signature_type must be one of the following types: eideasy, eideasy-pdf, nom151'
                Incorrect email_groups.id:
                  errors:
                  - code: 65582
                    message: Field `id` in `email_groups` should be a valid unique id.
                Incorrect redirect_target:
                  errors:
                  - code: 65536
                    message: 'The `redirect_target` field is invalid, allowed values: self, blank.'
                Missing email_groups.name:
                  errors:
                  - code: 65582
                    message: Field `name` in `email_groups` should not be blank.
                Missing emails in a group:
                  errors:
                  - code: 65582
                    message: Field `emails` in `email_groups` should not be blank.
                require_login restriction:
                  errors:
                  - code: 65582
                    message: The phone_invite cannot be used with the require_login_for_signing setting enabled.
                Empty decline_redirect_uri:
                  errors:
                  - code: 65536
                    message: The `decline_redirect_uri` field must not be empty.
                Too many emails in a group:
                  errors:
                  - code: 65582
                    message: Email group cannot contain more than 15 emails.
                Unmatching redirect_target:
                  errors:
                  - code: 65536
                    message: The `redirect_target` fields must be the same for the one signer.
                email not an email address:
                  errors:
                  - code: 65582
                    message: Field `email` in `email_groups.emails` should be a valid email address.
                email_groups.id not string:
                  errors:
                  - code: 65582
                    message: Field `id` in `email_groups` should be of type string.
                redirect_target not string:
                  errors:
                  - code: 65536
                    message: The `redirect_target` field must be a string.
                Duplicate emails in a group:
                  errors:
                  - code: 65582
                    message: Email in email group should be unique.
                close_redirect_uri too long:
                  errors:
                  - code: 65536
                    message: The `close_redirect_uri` field must contain no more than 2048 characters.
                emails not array of arrays.:
                  errors:
                  - code: 65582
                    message: Field `emails` in `email_groups` must be an array of arrays.
                phone_invite type incorrect:
                  errors:
                  - code: 65536
                    message: The `phone_invite` value should be of type string.
                close_redirect_uri not a URL:
                  errors:
                  - code: 65536
                    message: The `close_redirect_uri` field contains a URL in an invalid format.
                email_groups.name not string:
                  errors:
                  - code: 65582
                    message: Field `name` in `email_groups` should be of type string.
                remind_after range incorrect:
                  errors:
                  - code: 65536
                    message: The remind_after attribute cannot be less than 0
                Unmatching close_redirect_uri:
                  errors:
                  - code: 65536
