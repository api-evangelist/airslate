  /v2/document-group-templates/{document_group_template_id}:
    get:
      operationId: get-document-group-template-info
      summary: Get doc group template info
      description: 'This endpoint allows API users to retrieve information about a specific document group template, including its documents, the roles assigned to each document, and, optionally, the fields in each document.


        Available to the document group template owner and to users the template is shared with.


        **Notes**


        * Use the `include` query parameter to add optional data to the response. Unknown values are ignored.

        * With `?include=documents.fields`, each item in `documents` contains a `fields` array. Without it, the response doesn''t include `fields`.

        * The objects in `fields` have the same format as the `fields` array of `GET /document/{document_id}`. Template fields don''t contain a `data` key. Default values set in the template, such as `prefilled_text` for text fields, are returned inside `json_attributes`.

        * The response doesn''t include dropdown options (`enumeration_options`) or checkbox groups (`checkbox_groups`). `GET /document/{document_id}` returns them at the document level, so call it for each document that needs them.

        * `roles` contains role names only. To get the signing order and other recipient settings, call `GET /v2/document-group-templates/{document_group_template_id}/recipients`.

        * To add or update fields, call `PUT /document/{document_id}` for each document.

        * To work with a document in the template, call this endpoint to get the current document IDs right before you use them.

        * For document groups, use `GET /v2/document-groups/{document_group_id}`.'
      parameters:
      - in: query
        name: include=documents.fields
        required: false
        description: If used, each item in `documents` contains a `fields` array with the fields of that document.
        schema:
          type: string
      - in: path
        name: document_group_template_id
        required: true
        description: ID of the document group template.
        schema:
          type: string
      responses:
        '200':
          description: '- Request with correct token

            - Request with `include=documents.fields`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the document group template.
                      name:
                        type: string
                        description: Name of the document group template.
                      owner:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique identifier of the owner.
                          email:
                            type: string
                            description: Email address of the owner.
                        description: Owner of the document group template.
                      created:
                        type: integer
                        description: Unix timestamp (seconds) when the document group template was created.
                      updated:
                        type: integer
                        description: Unix timestamp (seconds) of the last update to the document group template.
                      documents:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the document. Can change when the template is converted, so don't store it as a permanent key.
                            roles:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    description: Name of the role, for example `Signer 1`.
                              description: Active roles assigned to the document. An empty array if the document has no roles.
                            fields:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: Unique identifier of the field.
                                  role:
                                    type: string
                                    description: Name of the role the field is assigned to.
                                  type:
                                    enum:
                                    - text
                                    - signature
                                    - checkbox
                                    - initials
                                    - enumeration
                                    - attachment
                                    - radiobutton
                                    - hyperlink
                                    - stamp
                                    type: string
                                    description: Field type.
                                  radio:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        x:
                                          type: integer
                                          description: Horizontal position of the button, in pixels.
                                        y:
                                          type: integer
                                          description: Vertical position of the button, in pixels.
                                        value:
                                          type: string
                                          description: Value of the button.
                                        width:
                                          type: integer
                                          description: Width of the button, in pixels.
                                        height:
                                          type: integer
                                          description: Height of the button, in pixels.
                                        checked:
                                          type: integer
                                          description: '`1` if the button is selected, `0` otherwise.'
                                        created:
                                          type: integer
                                          description: Unix timestamp when the button was created.
                                        radio_id:
                                          type: string
                                          description: Unique identifier of the radio button.
                                        page_number:
                                          type: integer
                                          description: Zero-based number of the page the button is on.
                                        json_attributes:
                                          type: array
                                          items: {}
                                          description: Additional button attributes. Empty array if none.
                                    description: 'For `radiobutton` fields only: the buttons in the radio group.'
                                  role_id:
                                    type: string
                                    description: 'Unique identifier of the role the field is assigned to. Role IDs are unique per document: a role with the same name has a different `role_id` in each document of the template. To match roles across documents, use `role`.'
                                  field_id:
                                    type:
                                    - string
                                    - 'null'
                                    description: Always `null` for a document group template field. Kept for compatibility with `GET /document/{document_id}`.
                                  fulfiller:
                                    type:
                                    - string
                                    - 'null'
                                    description: Always `null` for a document group template field. Kept for compatibility with `GET /document/{document_id}`.
                                  element_id:
                                    type:
                                    - string
                                    - 'null'
                                    description: Always `null` for a document group template field. Kept for compatibility with `GET /document/{document_id}`.
                                  originator:
                                    type: string
                                    description: Email address of the document group template owner.
                                  json_attributes:
                                    type: object
                                    properties:
                                      x:
                                        type: integer
                                        description: Horizontal position of the field on the page, in pixels.
                                      y:
                                        type: integer
                                        description: Vertical position of the field on the page, in pixels.
                                      bold:
                                        type: boolean
                                        description: '`true` if the text is bold.'
                                      font:
                                        type: string
                                        description: Font name, for example `Arial`.
                                      name:
                                        type: string
                                        description: Name of the field.
                                      size:
                                        type: number
                                        description: Font size in the SignNow editor scale, where the page is rendered `890` pixels wide. From `8` to `72`.
                                      align:
                                        enum:
                                        - left
                                        - center
                                        - right
                                        type: string
                                        description: Horizontal text alignment.
                                      color:
                                        type: string
                                        description: Text color as a 6-character hex code without `#`, for example `000000`.
                                      label:
                                        type: string
                                        description: Label of the field shown to the recipient. Returned only if a label is set.
                                      value:
                                        type: string
                                        description: 'For `checkbox` fields: the checkbox label.'
                                      width:
                                        type: integer
                                        description: Width of the field, in pixels.
                                      height:
                                        type: integer
                                        description: Height of the field, in pixels.
                                      italic:
                                        type: boolean
                                        description: '`true` if the text is italic.'
                                      valign:
                                        enum:
                                        - top
                                        - middle
                                        - bottom
                                        type: string
                                        description: Vertical text alignment.
                                      required:
                                        type: boolean
                                        description: '`true` if the recipient must fill in the field.'
                                      font_size:
                                        type: number
                                        description: Font size on the document page, in PDF points. The same size as `size`, converted to the page scale.
                                      max_chars:
                                        type: integer
                                        description: Maximum number of characters the recipient can enter. From `0` to `999`; `0` means no limit.
                                      max_lines:
                                        type: integer
                                        description: Maximum number of lines the recipient can enter. From `0` to `99`; `0` means no limit.
                                      underline:
                                        type: boolean
                                        description: '`true` if the text is underlined.'
                                      arrangement:
                                        enum:
                                        - none
                                        - cells
                                        type: string
                                        description: 'How the text is laid out in the field. `none`: regular text. `cells`: one character per cell; `max_lines` is then `1`.'
                                      page_number:
                                        type: integer
                                        description: Zero-based number of the page the field is on.
                                      allowed_types:
                                        type: array
                                        items:
                                          type: string
                                        description: 'For `signature` fields: the ways the recipient can add a signature. Possible values: `type`, `draw`, `upload`.'
                                      prefilled_text:
                                        type: string
                                        description: 'Default value of the field, set in the template. For `text` fields: the default text, returned only if set. For `checkbox` fields: `"0"` if the checkbox is not checked by default.'
                                      custom_defined_option:
                                        type: string
                                        description: 'For `enumeration` (dropdown) fields: whether the recipient can enter their own value instead of choosing a listed option. An empty string or `false` means they can''t.'
                                    description: Position, size, and settings of the field. The set of keys depends on the field type.
                                  field_request_id:
                                    type:
                                    - string
                                    - 'null'
                                    description: Always `null` for a document group template field. Kept for compatibility with `GET /document/{document_id}`.
                                  template_field_id:
                                    type:
                                    - string
                                    - 'null'
                                    description: Always `null` for a document group template field. Kept for compatibility with `GET /document/{document_id}`.
                                  field_request_canceled:
                                    type:
                                    - string
                                    - 'null'
                                    description: Always `null` for a document group template field. Kept for compatibility with `GET /document/{document_id}`.
                              description: 'Fields in the document. Returned only with `?include=documents.fields`. An empty array if the document has no fields. Each object has the same format as an item of the `fields` array returned by [`GET /document/{document_id}`](/docs/document/operations/get-document). Fields are listed by type in this order: `text`, `signature`, `checkbox`, `initials`, `enumeration`, `attachment`, `radiobutton`, `hyperlink`, `stamp`.'
                            document_name:
                              type: string
                              description: Name of the document.
                        description: Active documents in the template, in template order.
                    description: Information about the document group template.
