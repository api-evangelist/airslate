  /v2/document-group-templates/{doc_group_template_id}/copy:
    post:
      operationId: post-v2-document-group-templates-doc-group-template-id-copy
      summary: Copy doc group template
      description: This endpoint allows users to copy the document group template. As a result, users get a copy of the doc group template and copies of all the templates in it.
      parameters:
      - in: path
        name: doc_group_template_id
        required: true
        description: ID of the document group template
        schema:
          type: string
      responses:
        '202':
          description: Successfully copied document group template
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: '* Request with any of cases:


            - invalid token of user

            - expired token of user

            - empty header

            - authorization = null

            - authorization without value


            * Invalid payload

            * Incorrect `name` attribute

            * Empty `name` attribute

            * Unsupported symbol in the `name` value

            * `name` value length limits

            * Incorrect `folder_id` data type

            * Invalid ID in `folder_id`

            * Not available type of a folder given

            * Not available name of new document group template'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Invalid payload:
                  errors:
                  - code: 65536
                    message: Invalid payload
                Authorization issues:
                  code: 1537
                  error: invalid_token
                Empty `name` attribute:
                  errors:
                  - code: 23003011
                    message: The `name` field must not be empty.
                Invalid ID in `folder_id`:
                  errors:
                  - code: 23003015
                    message: The `folder_id` field value must be valid unique_id.
                '`name` value length limits':
                  errors:
                  - code: 23003013
                    message: The `name` must not exceed 255 chars.
                Incorrect `folder_id` data type:
                  errors:
                  - code: 23003014
                    message: The `folder_id` field must be a string.
                'Incorrect data type for `name` ':
                  errors:
                  - code: 23003010
                    message: The `name` field must be a string.
                Not available type of a folder given:
                  errors:
                  - code: 23003019
                    message: Document Group Template could be created in folder or sub-folders of Templates only.
                Unsupported symbol in the `name` value:
                  errors:
                  - code: 23003012
                    message: Unsupported symbol at `name` field value. Allowed name can only include letters, numbers, and (_ - . & ; ` ' ” ” () ¿ ¡) characters
                Not available name of new document group template:
                  errors:
                  - code: 23003021
                    message: The name of new document group template must not be empty.
        '403':
          description: '* User is not owner of the doc group template

            * Document group template not active

            * User is not owner of the folder'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                User is not owner of the folder:
                  errors:
                  - code: 23003018
                    message: Access denied to the folder.
                Document group template not active:
                  errors:
                  - code: 23003020
                    message: Access denied to the document group template.
                User is not owner of the doc group template:
                  errors:
                  - code: 23003016
                    message: The user is not owner of the `%s` document group template.
        '404':
          description: '* Document group template not found.

            * Not permitted document group template'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Document group template not found.:
                  errors:
                  - code: 23001014
                    message: Document Group Template `%s` not found
