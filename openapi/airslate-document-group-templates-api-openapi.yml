openapi: 3.2.0
info:
  title: SignNow Document Group Templates API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Document Group Templates
paths:
  /v2/document-group-templates:
    post:
      operationId: post-v2-document-group-templates
      summary: Create doc group template
      description: 'This endpoint allows users to create an empty document group template. Once the document group template is created, users can add one or more templates or documents to this document group template.


        A successful request returns a document group template ID.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID of the document group template.
                x-examples:
                  Example 1:
                    data:
                      id: b12e4a885b513a6d9c4c2e7c2b7fa06a013a7412
              example:
                Example 1:
                  data:
                    id: b12e4a885b513a6d9c4c2e7c2b7fa06a013a7412
                Successful request:
                  data:
                    id: b12e4a885b513a6d9c4c2e7c2b7fa06a013abbbb
        '400':
          description: '- `name` is empty.

            - `name` is not a string.

            - `name` has unsupported symbols.

            - `name` length is too long.

            - Authorization is required.

            - `folder_id` is empty.

            - `folder_id` is not a string.

            - `folder_id` is incorrect.

            - `folder_id`is not a folder of templates.

            - `folder_id` is not accessible.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 13024001
                      message: The `name` value should not be blank.
              example:
                Example 1:
                  errors:
                  - code: 13024001
                    message: The `name` value should not be blank.
                name is empty:
                  errors:
                  - code: 13024001
                    message: The `name` value should not be blank.
                name too long:
                  errors:
                  - code: 13024004
                    message: The `name` value is too long. It should have 255 characters or less.
                Empty folder_id:
                  errors:
                  - code: 13024005
                    message: The `folder_id` value should not be blank.
                name not string:
                  errors:
                  - code: 13024002
                    message: The `name` value should be of type string.
                folder_id not string:
                  errors:
                  - code: 13024006
                    message: The `folder_id` value should be of type string.
                Authorization required:
                  code: 1537
                  error: invalid_token
                folder_id is incorrect:
                  errors:
                  - code: 13024007
                    message: The `folder_id` value is invalid unique id.
                folder_id not accessible:
                  errors:
                  - code: 13029002
                    message: User folder is not accessible.
                name has unsupported symbols:
                  errors:
                  - code: 13024003
                    message: The `name` value is not valid.
                folder_id not templates folder:
                  errors:
                  - code: 13029001
                    message: Folder of Templates available only.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  example: Test document group template
                  description: 'Document group template name.

                    '
                folder_id:
                  type: string
                  example: 5fcac949dce4e1d23e54ea5751dd649a947abbbb
                  description: ID of the templates folder that will be used to create a document group template. If provided, must refer to a valid and accessible folder of templates.
              x-examples:
                Example 1:
                  name: Document group template name
                  folder_id: 5fcac949dce4e1d23e54ea5751dd649a947abbbb
        required: true
      tags:
      - Document Group Templates
  /v2/document-group-templates/{doc_group_template_id}:
    patch:
      operationId: patch-v2-document-group-templates-doc-group-template-id
      summary: Edit doc group template
      description: This endpoint allows users to reorder documents, rename the document group template, and update the action performed upon completion of the document group template.
      parameters:
      - in: path
        name: doc_group_template_id
        required: true
        description: ID of the document group template.
        schema:
          type: string
      responses:
        '204':
          description: Success.
        '400':
          description: '**Authorization errors**


            **Validation errors:**

            - `order` type is incorrect.

            - Document IDs are not unique.

            - Document ID type is incorrect.

            - Document ID is incorrect.

            - `template_group_name` type is incorrect.

            - `template_group_name` has unsupported symbols.

            - `template_group_name` is too long. Max length is 255 symbols.

            - `email_action_on_complete` value type is incorrect.

            -  `email_action_on_complete` is incorrect. '
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 13022003
                      message: The order field must be an array
              example:
                Example 1:
                  errors:
                  - code: 13022003
                    message: The order field must be an array
                DGT name too long:
                  code: 13022009
                  message: Incorrect Length of document group template name
                Authorization error:
                  code: 1537
                  message: invalid_token
                Document ID incorrect:
                  errors:
                  - code: 13022006
                    message: The order array must include valid unique document ids
                Document IDs not unique:
                  errors:
                  - code: 13022004
                    message: The order array must include unique document ids
                Order type is incorrect:
                  errors:
                  - code: 13022003
                    message: The order field must be an array
                DGT name type is incorrect:
                  code: 13022007
                  message: Incorrect type of document group template name
                Document ID type incorrect:
                  errors:
                  - code: 13022005
                    message: The order array must include string type of document ids
                DGT name has unsupported symbols:
                  code: 13022008
                  message: Incorrect document group template name
                email_action_on_complete is incorrect:
                  code: 13022014
                  message: The email_action_on_complete value you selected is not a valid choice.
                email_action_on_complete type is incorrect:
                  code: 13022013
                  message: Incorrect type of document group template email_action_on_complete
        '403':
          description: Access to document group template denied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 13022001
                      message: Access to DocumentGroupTemplate is denied
              example:
                Example 1:
                  errors:
                  - code: 13022001
                    message: Access to DocumentGroupTemplate is denied
                Access denied:
                  errors:
                  - code: 13022001
                    message: Access to DocumentGroupTemplate is denied
        '404':
          description: '`doc_group_template_id` is incorrect.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  '404':
                    type: string
                x-examples:
                  Example 1:
                    '404': 'Unable to find a route to match the URI: v2/document-group-templates/1d33671c3c8741ce9dbbd8e106f3a6bb2842b4f'
              example:
                Example 1:
                  '404': 'Unable to find a route to match the URI: v2/document-group-templates/1d33671c3c8741ce9dbbd8e106f3a6bb2842b4f'
                DGT id is incorrect:
                  '404': 'Unable to find a route to match the URI: v2/document-group-templates/1d33671c3c8741ce9dbbd8e106f3a6bb284XXXX'
        '422':
          description: Payload documents do not match the document group template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 13022002
                      message: Documents in order are not equal to existing documents in DocumentGroupTemplate
              example:
                Example 1:
                  errors:
                  - code: 13022002
                    message: Documents in order are not equal to existing documents in DocumentGroupTemplate
                Documents do not match DGT:
                  errors:
                  - code: 13022002
                    message: Documents in order are not equal to existing documents in DocumentGroupTemplate
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items:
                    type: string
                  description: List of document IDs in the document group template.
                template_group_name:
                  type: string
                  example: HR documents
                  description: Name of the document group template.
                email_action_on_complete:
                  type: string
                  example: documents_and_attachments
                  description: 'Specifies the action to be taken upon invite completion. Allowed values: `documents_and_attachments`: Email documents and attachments to all parties. `documents_and_attachments_only_to_recipients`: Email documents and attachments only to recipients. `without_documents_and_attachments`: Do not email documents or any attachments.'
              x-examples:
                Example 1:
                  order:
                  - ffa1e7109013c26d5a706d34a9d0ad598f95afa1
                  - 06d34a9d0ad598f95afa1ffa1e7109013c26d5a7
                  template_group_name: Document group template name
                  email_action_on_complete: documents_and_attachments
        required: true
      tags:
      - Document Group Templates
  /v2/document-group-templates/{doc_group_template_id}/copies:
    get:
      operationId: get-v2-document-group-templates-doc-group-template-id-copies
      summary: Get doc groups created from template
      description: This endpoint allows users to retrieve a list of all document groups created and sent from a specific document group template. Use query parameters to filter, sort, paginate the results, or search for specific search keys.
      parameters:
      - in: path
        name: doc_group_template_id
        required: true
        description: ID of the document group template
        schema:
          type: string
      - in: query
        name: sort_by
        required: false
        description: 'Sort results by the date of the last update, the creation date, or the document group name. Possible values: `updated`, `created`, and `document_group_name`.'
        schema:
          type: string
          default: updated
      - in: query
        name: sort_order
        required: false
        description: 'Sort results in descending or ascending order. Possible values: `asc`, `desc`.'
        schema:
          type: string
          default: desc
      - in: query
        name: page
        required: false
        description: Page number to display in the results. For example, if `page=2` and `per_page=10`, you'll get results from 11 to 20.
        schema:
          type: integer
          default: 1
      - in: query
        name: per_page
        required: false
        description: Number of document groups displayed per page.
        schema:
          type: integer
          default: 15
      - in: query
        name: filters[signing_status]
        required: false
        description: 'Filter results by document group template signing status. Possible values: `waiting-for-me`, `waiting-for-others`, `signed`, `pending`, `has-invites`, `expired`.'
        schema:
          type: string
      - in: query
        name: search_key
        required: false
        description: Search by key (word, part of word, or phrase).
        schema:
          type: string
      - in: query
        name: search_by
        required: false
        description: 'Specify where to look for the `search_key`. Possible values: `document-name`, `signer-email`, `inviter-email`, `document-text`, and `document-id`.'
        schema:
          type: string
      - in: query
        name: filters[entity_labels]
        required: false
        description: 'Filter results by declined or undelivered document group templates. Possible values: `declined`, `undelivered`.'
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        owner:
                          type: string
                        state:
                          type: string
                        created:
                          type: integer
                        invites:
                          type: array
                          items:
                            type: object
                        updated:
                          type: integer
                        user_id:
                          type: string
                        documents:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              roles:
                                type: array
                                items:
                                  type: string
                        invite_id:
                          type:
                          - string
                          - 'null'
                        parent_id:
                          type: string
                        freeform_actions:
                          type: array
                          items:
                            type: object
                        freeform_invite_id:
                          type:
                          - string
                          - 'null'
                        document_group_name:
                          type: string
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          count:
                            type: integer
                          links:
                            type: object
                          total:
                            type: integer
                          per_page:
                            type: integer
                          total_pages:
                            type: integer
                          current_page:
                            type: integer
                x-examples:
                  Example 1:
                    data:
                    - id: 8a8bc73bd272439e853e8d0faf892d4107287c8a
                      owner: owner@email.com
                      state: created
                      created: 1688481787
                      invites: []
                      updated: 1688481787
