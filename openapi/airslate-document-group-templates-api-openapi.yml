  /v2/document-group-templates/{document_group_template_id}/roles:
    post:
      operationId: share-document-group-template
      summary: Share document group template
      description: 'This endpoint allows API users to share a document group template with a user by email, assigning them a specified role. If the user does not have an account, one is created automatically.


        **Notes**


        * **Viewer** - can view, download, and make copies of documents in a document group template; **sender** - can view, download, make copies, invite to sign, and manage document invites.

        * Only the owner of the document group template can share it.

        * A document group template can be shared only once with the same user. Attempting to share again (even with a different role) returns an error.

        * The user receives an email notification about the shared template.

        * If the user does not exist in the system, a new account is created automatically.'
      parameters:
      - in: path
        name: document_group_template_id
        required: true
        description: Document group template ID.
        schema:
          type: string
      responses:
        '200':
          description: Document group template successfully shared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier of the user.
                  role:
                    type: string
                    description: User's role in the document group template (e.g., `viewer`, `sender`).
                  email:
                    type: string
                    description: Email address of the user.
                x-examples:
                  Example 1:
                    id: def456abc123def456abc123def456abc123defg
                    role: viewer
                    email: user@example.com
              example:
                Example 1:
                  id: def456abc123def456abc123def456abc123defg
                  role: viewer
                  email: user@example.com
                application/json:
                  id: def456abc123def456abc123def456abc123defg
                  role: viewer
                  email: user@example.com
        '400':
          description: 'Bad request. Possible errors:


            * Document group template not found.

            * You can''t share document to yourself.

            * Entity can only be shared once.

            * Email validation errors.

            * Role validation errors.

            * Message validation errors.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 12029025
                      message: Document group template not found.
              example:
                Example 1:
                  errors:
                  - code: 12029025
                    message: Document group template not found.
                Already shared:
                  errors:
                  - code: 12029008
                    message: Entity can only be shared once.
                Message too long:
                  errors:
                  - code: 12029028
                    message: Field `message` should not exceed 10000 characters.
                Role is required:
                  errors:
                  - code: 12029004
                    message: Role is required.
                Email is required:
                  errors:
                  - code: 12029002
                    message: Email is required.
                Message too short:
                  errors:
                  - code: 12029028
                    message: Field `message` should be not less than 1 characters.
                Email is not valid:
                  errors:
                  - code: 12029003
                    message: Email is not valid.
                Role must be string:
                  errors:
                  - code: 12029005
                    message: Role must be string.
                Incorrect role value:
                  errors:
                  - code: 12030014
                    message: 'Field `role` value should be one of ["viewer", "sender"], value: ["..."] given.'
                Email must be a string:
                  errors:
                  - code: 12029001
                    message: Email must be a string.
                Message must be string:
                  errors:
                  - code: 12029027
                    message: 'Field `message` should be string, value: [...] given.'
                Can't share to yourself:
                  errors:
                  - code: 12029007
                    message: You can't share document to yourself.
                Message must not be empty:
                  errors:
                  - code: 12029029
                    message: Field `message` must not be empty.
                Document group template not found:
                  errors:
                  - code: 12029025
                    message: Document group template not found.
        '403':
          description: Forbidden. You don't have access to the document group template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 12029012
                      message: You don't have access to the entity.
              example:
                Example 1:
                  errors:
                  - code: 12029012
                    message: You don't have access to the entity.
                Forbidden:
                  errors:
                  - code: 12029012
                    message: You don't have access to the entity.
        '404':
          description: Incorrect document group template ID format (not a 40-character hex string).
          content:
            application/json:
              schema:
                type: object
                properties:
                  '404':
                    type: string
                x-examples:
                  Example 1:
                    '404': 'Unable to find a route to match the URI: v2/document-groups/{id}/roles'
              example:
                Example 1:
                  '404': 'Unable to find a route to match the URI: v2/document-groups/{id}/roles'
                Not found:
                  '404': 'Unable to find a route to match the URI: v2/document-groups/{id}/roles'
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - role
              properties:
                role:
                  type: string
                  example: viewer
                  description: 'Role to assign. Allowed values: `viewer`, `sender`.'
                email:
                  type: string
                  example: user@email.com
                  description: Email address of the user to share with.
                message:
                  type: string
                  example: Please review this template.
                  description: Custom message to include in the notification email.
        required: true
      tags:
      - Document Group Templates
    get:
      operationId: list-document-group-template-roles
      summary: Get document group template roles
      description: 'This endpoint allows API users to retrieve a paginated list of users who have access to the specified document group template, including their roles, names, and avatar links.


        **Notes**


        * The owner sees all users with roles (including themselves as `owner`).

        * A non-owner (shared user) sees only the owner and themselves.'
      parameters:
      - in: path
        name: document_group_template_id
        required: true
        description: Document group template ID.
        schema:
          type: string
      - in: query
        name: per_page
        required: false
        description: 'Number of items per page. Min: `1`, Max: `100`. Default: `15`.'
        schema:
          type: integer
      - in: query
        name: page
        required: false
        description: 'Page number. Min: `1`. Default: `1`.'
        schema:
          type: integer
      responses:
        '200':
          description: Success. Retrieves a paginated list of users with access to the document group template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the user.
                        role:
                          type: string
                          description: User's role in the document group template (e.g., `viewer`, `sender`, `owner`).
                        email:
                          type: string
                          description: Email address of the user.
                        full_name:
