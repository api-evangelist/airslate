openapi: 3.2.0
info:
  title: SignNow Event Subscriptions API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Event Subscriptions
paths:
  /v2/event-subscriptions/{subscription_id}/callbacks:
    get:
      operationId: get-v2-dashboard-event-history
      summary: Get list of callbacks by event subscription
      description: 'Allows users to get the list of webhook events (events history) by the subscription ID.


        The results can be filtered and sorted. If the `sort` parameter is not indicated, the results are sorted by the `start_time` in descending order. The `filters` and `sort` parameters need URL-encoding.'
      parameters:
      - in: path
        name: subscription_id
        required: true
        description: ID of the subscription
        schema:
          type: string
      - in: query
        name: sort:end_time
        required: false
        description: 'Sort results by the end time. Possible values: asc, desc. Format: `?sort[end_time]=desc`'
        schema:
          type: string
      - in: query
        name: sort:start_time
        required: false
        description: 'Sort results by the start time. Possible values: asc, desc. Format: `?sort[start_time]=desc`'
        schema:
          type: string
      - in: query
        name: sort:code
        required: false
        description: 'Sort results by the response code. Possible values: asc, desc. Format: `?sort[code]=desc`'
        schema:
          type: string
      - in: query
        name: filters:initiator_id
        required: false
        description: 'Search for a string in initiator IDs. Format: `?filters=[{"_OR":[{"initiator_id ":{"type":"like","value":"21a28b47"}}]}]`'
        schema:
          type: string
      - in: query
        name: filters:date
        required: false
        description: 'Filter results by the timestamps of start time. Format: `?filters=[{"date":{"type":"between","value":[1580719773,1580720509]}}]`'
        schema:
          type: string
      - in: query
        name: filters:code
        required: false
        description: 'Filter results by the response codes. Format: `?filters=[{"code":{"type": "between", "value":[199,299]}}]`'
        schema:
          type: string
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      responses:
        '200':
          description: Correct request
          content:
            application/json:
              schema:
                type: object
              example:
                Correct request:
                  data:
                  - id: 12345
                    duration: 0.0125
                    entity_id: b9XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    event_name: document.delete
                    entity_type: document
                    callback_url: http://example.com/handle?hash=XXXXXXXX&Param={"docId":"b9XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"}
                    request_method: post
                    request_content:
                      meta:
                        event: document.delete
                        timestamp: 1661430933
                        environment: https://example.com
                        access_token: '********'
                        callback_url: http://example.com/handle?hash=XXXXXXXX&Param={"docId":"b9XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"}
                      content:
                        user_id: b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        document_id: b9XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        initiator_id: b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                        document_name: Sample document
                        initiator_email: initiator_email@email.com
                    request_headers:
                      int_head: 12
                      bool_head: false
                      float_head: 12.24
                      string_head: string_head
                    application_name: Sample application
                    request_end_time: 1661430936
                    response_content: '{"message":"Okay","timestamp":"2022-08-25 12:35:36.486"}'
                    request_start_time: 1661430936
                    response_status_code: 200
                  meta:
                    pagination:
                      count: 1
                      links: []
                      total: 1
                      per_page: 15
                      total_pages: 1
                      current_page: 1
        '400':
          description: '* Token issue

            * Incorrect filter format (each filter must contain `type` and `value` fields)

            * Incorrect filter expression (must be a string)

            * Incorrect `code` or `date` filter expression (must be `"type": "between"`)

            * Incorrect `initiator_id` filter expression (must be `"type": "like"`)

            * Incorrect `code` or `date` filter value (must be an array of 2 integers)

            * Incorrect `initiator_id` filter value (must be a string)



            '
          content:
            application/json:
              schema:
                type: object
              example:
                Authorization error:
                  code: 1537
                  error: invalid_token
                Incorrect filter format:
                  errors:
                  - code: 15006011
                    message: Incorrect filter format, filter must have `type` and `value` fields.
                Incorrect code filter value:
                  errors:
                  - code: 15006015
                    message: The `code` filter value must be of type array with 2 integer.
                Incorrect date filter value:
                  errors:
                  - code: 15006018
                    message: The `date` filter value must be of type array with 2 integer.
                Incorrect filter expression:
                  errors:
                  - code: 15006012
                    message: Incorrect filter format, filter `type` must be a string.
                Incorrect code filter expression:
                  errors:
                  - code: 15006013
                    message: The `code` filter expression must be equal to `between`.
                Incorrect date filter expression:
                  errors:
                  - code: 15006016
                    message: The `date` filter expression must be equal to `between`.
                Incorrect initiator_id filter value:
                  errors:
                  - code: 15006020
                    message: The `initiator_id` filter value must be a string.
                Incorrect initiator_id filter expression:
                  errors:
                  - code: 15006019
                    message: The `initiator_id` filter expression must be equal to `like`.
        '403':
          description: Request with token of another application
          content:
            application/json:
              schema:
                type: object
              example:
                Request with token of another application:
                  errors:
                  - message: Access to the subscription data is not allowed
        '404':
          description: '* Request with non-existing subscription_id

            * Request with invalid subscription_id'
          content:
            application/json:
              schema:
                type: object
              example:
                ' Invalid subscription_id':
                  '404': 'Unable to find a route to match the URI: v2/dashboard/event-subscriptions/23@/callbacks/12345'
                Non-existing subscription_id:
                  errors:
                  - message: UserEventSubscription `94XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX` not found
      security:
      - Bearer: []
      tags:
      - Event Subscriptions
  /v2/event-subscriptions/{subscription_id}/callbacks/{callback_id}:
    get:
      operationId: get-v2-dashboard-event-subscriptions-subscription-id-callbacks
      summary: Get callback info by ID
      description: This endpoint allows API users to get detailed info about one webhook by its ID.
      parameters:
      - in: path
        name: callback_id
        required: true
        description: ID of the webhook.
        schema:
          type: string
      - in: path
        name: subscription_id
        required: true
        description: ID of the subscription.
        schema:
          type: string
      responses:
        '200':
          description: "Depending on the type of event, the `initiator_id` parameter can be placed differently in response body (into the `request_content` object):\n* only in the `meta` object if `event_name` is:\n  * `document.update`\n  * `document.complete`\n  * `document.open`\n  * `template.copy`\n  * `document.fieldinvite.create` etc.\n  * `document_group.update`\n  * `document_group.invite.create` etc.;\n   \n* in the `meta` and in the `content` objects if `event_name` is:\n  * `document.delete`\n  * `document_group.delete`\n  * `document_group.open`\n  * `user.document_group.open`\n  * `document_group.invite.declined`\n  * `user.document_group.invite.declined`\n  * `document_group.complete`\n  * `user.document_group.complete`\n  \nThe type of event also affects the composition of the parameters of the `request_content` object. \n\n<details>\n  <summary>See the callback payload for each event</summary>\n<br>  \n<table>\n<tr>\n<td> Event </td> <td> \"request_content\" object </td>\n</tr>\n<tr>\n<td> <code>document.delete</code> <br> <code>user.document.delete</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document.delete\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"docId\\\":\\\"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"document_id\": \"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"document_name\": \"Sample Document\",\n      \"user_id\": \"b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"initiator_email\": \"signer@example.com\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>document.update</code> <br> <code>user.document.update</code> <br> <code>user.document.create</code> <br> <code>user.document.complete</code> <br> <code>document.complete</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document.update\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"docId\\\":\\\"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"document_id\": \"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"document_name\": \"Sample Document\",\n      \"user_id\": \"b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>document.open</code> <br> <code>user.document.open</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document.open\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"docId\\\":\\\"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"document_id\": \"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"document_name\": \"Sample Document\",\n      \"user_id\": \"b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"viewer_user_unique_id\": \"h7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>template.copy</code> <br> <code>user.template.copy</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"template.copy\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"docId\\\":\\\"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"document_id\": \"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"template_id\": \"g6XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"user_id\": \"b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"viewer_user_unique_id\": \"h7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>user.document.fieldinvite.create</code> <br> <code>user.document.fieldinvite.decline</code> <br> <code>user.document.fieldinvite.delete</code> <br> <code>user.document.fieldinvite.signed</code> <br> <code>user.document.fieldinvite.sent</code> <br> <code>user.document.freeform.create</code> <br> <code>user.document.freeform.signed</code> <br> <code>document.fieldinvite.create</code> <br> <code>document.fieldinvite.decline</code> <br> <code>document.fieldinvite.delete</code> <br> <code>document.fieldinvite.signed</code> <br> <code>document.fieldinvite.sent</code> <br> <code>document.freeform.create</code> <br> <code>document.freeform.signed</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document.fieldinvite.create\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"docId\\\":\\\"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"document_id\": \"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"invite_id\": \"e5XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"signer\": \"signer@example.com\",\n      \"status\": \"pending\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>user.document.fieldinvite.reassign</code> <br> <code>document.fieldinvite.reassign</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document.fieldinvite.reassign\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"docId\\\":\\\"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"document_id\": \"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"invite_id\": \"e5XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"signer\": \"signer@example.com\",\n      \"old_invite_unique_id\": \"i8XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>user.document.fieldinvite.replace</code> <br> <code>document.fieldinvite.replace</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document.fieldinvite.replace\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"docId\\\":\\\"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"document_id\": \"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"invite_id\": \"e5XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"signer\": \"signer@example.com\",\n      \"old_invite_unique_id\": \"i8XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"group_invite\": true\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>user.document_group.create</code> <br> <code>user.document_group.update</code> <br> <code>document_group.update</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document_group.update\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"groupId\\\":\\\"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"group_id\": \"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"group_name\": \"Sample Document Group\",\n      \"user_id\": \"b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>user.document_group.complete</code> <br> <code>document_group.complete</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document_group.complete\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"groupId\\\":\\\"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"group_id\": \"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"group_name\": \"Sample Document Group\",\n      \"user_id\": \"b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"initiator_email\": \"signer@example.com\",\n      \"completed_at\": 1748521868,\n      \"documents\": [\n         {\n            \"document_id\": \"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n            \"document_name\": \"Sample Document\",\n            \"status\": \"completed\"\n         }\n      ],\n      \"invite_steps\": [\n         {\n            \"order\": 1,\n            \"status\": \"completed\",\n            \"signers\": [\n               {\n                  \"email\": \"signer@example.com\",\n                  \"role_name\": \"Signer 1\",\n                  \"action\": \"sign\",\n                  \"status\": \"fulfilled\",\n                  \"document_id\": \"f7XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n                  \"signed_at\": 1748521800\n               }\n            ]\n         }\n      ]\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>document_group.delete</code> <br> <code>user.document_group.delete</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document_group.delete\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"groupId\\\":\\\"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"group_id\": \"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"group_name\": \"Sample Document Group\",\n      \"user_id\": \"b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"initiator_email\": \"signer@example.com\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>document_group.open</code> <br> <code>user.document_group.open</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document_group.open\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"groupId\\\":\\\"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"group_id\": \"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"group_name\": \"Sample Document Group\",\n      \"user_id\": \"b2XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"initiator_email\": \"signer@example.com\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>user.document_group.invite.create</code> <br> <code>user.document_group.invite.resend</code> <br> <code>user.document_group.invite.update</code> <br> <code>user.document_group.invite.cancel</code> <br> <code>document_group.invite.create</code> <br> <code>document_group.invite.resend</code> <br> <code>document_group.invite.update</code> <br> <code>document_group.invite.cancel</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document_group.invite.create\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"groupId\\\":\\\"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"group_id\": \"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"group_invite_id\": \"d4XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"status\": \"pending\"\n   }\n}\n```\n\n</td>\n</tr>\n<tr>\n<td> <code>document_group.invite.declined</code> <br> <code>user.document_group.invite.declined</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"document_group.invite.declined\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"groupId\\\":\\\"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"group_id\": \"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"group_invite_id\": \"d4XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"status\": \"canceled\",\n      \"initiator_id\": \"c3XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"initiator_email\": \"signer@example.com\"\n   }\n}\n```\n\n> **Note:** For SMS invitees, `initiator_email` contains a system-generated address in the format `sms_signer_{phone_number}@no.reply`.\n\n</td>\n</tr>\n<tr>\n<td> <code>user.document_group.invite.expired</code> </td>\n<td>\n\n\n```json\n\n{\n   \"meta\": {\n      \"timestamp\": 1748521868,\n      \"event\": \"user.document_group.invite.expired\",\n      \"environment\": \"https://api.signnow.com\",\n      \"initiator_id\": null,\n      \"callback_url\": \"https://example.com/webhook?Param={\\\"groupId\\\":\\\"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\\\"}\",\n      \"access_token\": \"********\",\n      \"metadata\": []\n   },\n   \"content\": {\n      \"group_id\": \"a1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"group_name\": \"Sample Document Group\",\n      \"group_invite_id\": \"d4XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"step\": 2,\n      \"signers\": [\n         \"signer@example.com\",\n         \"signer2@example.com\"\n      ]\n   }\n}\n```\n\n</td>\n</tr>\n</table>\n\n</details>\n\n<br>\n\n`Param` will be added to `callback_url` parameter, if `docid_queryparam` is `true`:\n\n```\n\"callback_url\":\"{{callback_url}}?Param={\\\"groupId\\\":\\\"{{document_unique_id}}\\\"}\n\n```\nSee [`docid_queryparam`](/docs/manage-event-subscriptions/operations/create-event-subscription-2) details\n\n`access_token` will be added only if `delete_access_token` will be `false`.\n\n<br>\n\nSee [`delete_access_token`](/docs/manage-event-subscriptions/operations/create-event-subscription-2) details.\n\n\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique ID of the callback record.
                      duration:
                        type: number
                        description: Duration of the callback request in seconds.
                      entity_id:
                        type: string
                        description: ID of the entity (document, document group, or template) that triggered the event.
                      event_name:
                        type: string
                        description: Name of the triggered event (for example, `document.delete`).
                      entity_type:
                        type: string
                        description: 'Type of entity. Possible values: `user`, `document`, `document_group`.'
                      callback_url:
                        type: string
                        description: URL to which the webhook payload was sent.
                      request_method:
                        type: string
                        description: HTTP method used for the callback request. Always `post`.
                      request_content:
                        type: object
                        properties:
                          meta:
                            type: object
                            properties:
                              event:
                                type: string
                                description: Name of the triggered event.
                              metadata:
                                type: array
                                items:
                                  type: object
                                description: Custom metadata attached to the entity at the time the event was triggered.
                              timestamp:
                                type: integer
                                description: Unix timestamp of when the event occurred.
                              environment:
                                type: string
                                description: API environment URL.
                              access_token:
                                type: string
                                description: Bearer access token. Present only if `delete_access_token` is `false`.
                              callback_url:
                                type: string
                                description: Callback URL, including any `docid_queryparam` query parameters if configured.
                              initiator_id:
                                type: string
                                description: ID of the user who triggered the event.
                          content:
                            type: object
                            properties:
                              status:
                                type: string
                                description: Status of the invite.
                              group_id:
                                type: string
                                description: ID of the document group.
                              initiator_id:
                                type: string
                                description: ID of the user who triggered the event.
                              group_invite_id:
                                type: string
                                description: ID of the document group invite.
                              initiator_email:
                                type: string
