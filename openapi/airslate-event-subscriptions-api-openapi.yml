      tags:
      - Event Subscriptions
  /v2/event-subscriptions/callbacks:
    get:
      operationId: get-v2-event-subscriptions-callbacks
      summary: Get list of callbacks
      description: 'Allows users to get the list of all webhook events (events history).


        The results can be filtered and sorted. If the `sort` parameter is not indicated, the results are sorted by `start_time` in descending order.'
      parameters:
      - in: query
        name: sort:end_time
        required: false
        description: 'Sort results by the end time. Possible values: asc, desc. Format: `?sort[end_time]=desc`'
        schema:
          type: string
      - in: query
        name: sort:start_time
        required: false
        description: 'Sort results by the start type. Possible values: asc, desc. Format: `?sort[start_time]=desc`'
        schema:
          type: string
      - in: query
        name: sort:code
        required: false
        description: 'Sort results by the response code. Possible values: asc, desc. Format: `?sort[code]=desc`'
        schema:
          type: string
      - in: query
        name: sort:event
        required: false
        description: 'Sort results by the specific type of event (from A to Z). Possible values: asc, desc. Format: `?sort[event]=desc`'
        schema:
          type: string
      - in: query
        name: sort:application
        required: false
        description: 'Sort results by the application name (from A to Z). Possible values: asc, desc. Format: `?sort[application]=desc`'
        schema:
          type: string
      - in: query
        name: filters:entity_id, callback_url, initiator_id
        required: false
        description: 'Search for a string in entity IDs, callback URLs, and initiator IDs. Format: `?filters=[{"_OR":[{"entity_id":{"type":"like","value":"21a28b47"}},{"callback_url":{"type":"like","value":"21a28b47"}},{"initiator_id":{"type":"like","value":"21a28b47"}}]}]`'
        schema:
          type: string
      - in: query
        name: filters:date
        required: false
        description: 'Filter results by the timestamps. Format: `?filters=[{"date":{"type":"between","value":[1580719773,1580720509]}}]`'
        schema:
          type: string
      - in: query
        name: filters:code
        required: false
        description: 'Filter results by the response codes. Format: `?filters=[{"code":{"type": "between", "value":[199,299]}}]`'
        schema:
          type: string
      - in: query
        name: filters:event
        required: false
        description: 'Filter results by the specific type of event. Format: `?filters=[{"event":{"type": "in", "value":["document.create", "document.update"]}}]`'
        schema:
          type: string
      - in: query
        name: filters:event_type
        required: false
        description: 'Filter results by the event type. Possible values: ''user'', ''document'', ''document_group''. Format: `?filters=[{"event_type":{"type": "in", "value":["user", "document", "document_group"]}}]`'
        schema:
          type: string
      - in: query
        name: filters:application
        required: false
        description: 'Filter results by the application. Format: `?filters=[{"application":{"type": "in", "value":["applicationUniqueId1", "applicationUniqueId2"]}}]`'
        schema:
          type: string
      responses:
        '200':
          description: Correct request.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: '* Incorrect filter format (each filter must contain type and value fields)

            * Incorrect filter expression (must be a string)

            * Incorrect `application`, `event`, or `event_type` filter expression (must be `"type": "in"`)

            * Incorrect `code` or `date` filter expression (must be `"type": "between"`)

            * Incorrect `entity_id`, `callback_url`, or `initiator_id` filter expression (must be `"type": "like"`)

            * Incorrect `application`, `event_type`, or `event` filter value (must be an array of strings)

            * Incorrect `application` filter value item (must be 40 symbols long or shorter and can contain only lowercase latin letters and digits)

            * Incorrect `event_type` filter value item (allowed values are `document`, `document_group`, `user`, and `template`)

            * Incorrect `event` filter value item (allowed values are listed [here](/docs/guides-webhooks#entity-events))

            * Incorrect `code` or `date` filter value (must be an array of 2 integers)

            * Incorrect `entity_id`, `callback_url`, or `initiator_id` filter value (must be a string)

            '
          content:
            application/json:
              schema:
                type: object
              example:
                Incorrect filter format:
                  errors:
                  - code: 15006011
                    message: Invalid filter format, filter must have `type` and `value` fields.
                Incorrect code filter value:
                  errors:
                  - code: 15006015
                    message: The `code` filter value must be of type array with 2 integer.
                Incorrect date filter value:
                  errors:
                  - code: 15006018
                    message: The `date` filter value must be of type array with 2 integer.
                Incorrect filter expression:
                  errors:
                  - code: 15006012
                    message: Invalid filter format, filter `type` must be a string.
                Incorrect event filter value:
                  errors:
                  - code: 15006033
                    message: The `event` filter value must be an array of strings.
                Incorrect code filter expression:
                  errors:
                  - code: 15006013
                    message: The `code` filter expression must be equal to `between`.
                Incorrect date filter expression:
                  errors:
                  - code: 15006016
                    message: The `date` filter expression must be equal to `between`.
                Incorrect entity_id filter value:
                  errors:
                  - code: 15006020
                    message: The `entity_id` filter value must be a string.
                Incorrect event filter expression:
                  errors:
                  - code: 15006031
                    message: The `event` filter expression must be equal to `in`
                Incorrect event filter value item:
                  errors:
                  - code: 15006034
                    message: The `event` must be one of valid events.
                Incorrect event_type filter value:
                  errors:
                  - code: 15006029
                    message: The `event_type` filter value must be an array of strings.
                Incorrect application filter value:
                  errors:
                  - code: 15006023
                    message: The `application` filter value should be an array of strings.
                Incorrect callback_url filter value:
                  errors:
                  - code: 15006025
                    message: The `callback_url` filter value must be a string.
                Incorrect initiator_id filter value:
                  errors:
                  - code: 15006027
                    message: The `initiator_id` filter value must be a string.
                Incorrect entity_id filter expression:
                  errors:
                  - code: 15006019
                    message: The `entity_id` filter expression must be equal to `like`.
                Incorrect event_type filter expression:
                  errors:
                  - code: 15006037
                    message: The `event_type` filter expression must be equal to `in`.
                Incorrect event_type filter value item:
                  errors:
                  - code: 15006030
                    message: The `event_type` must be one of 'document', 'document_group', 'user', 'template'.
                Incorrect application filter expression:
                  errors:
                  - code: 15006021
                    message: The `application` filter expression must be equal to `in`.
                Incorrect application filter value item:
                  errors:
                  - code: 15006036
                    message: The `application` filter item length must be 40 and it should contain only characters in [a-z0-9].
                Incorrect callback_url filter expression:
                  errors:
                  - code: 15006024
                    message: The `callback_url` filter expression must be equal to `like`.
                Incorrect initiator_id filter expression:
                  errors:
                  - code: 15006026
                    message: The `initiator_id` filter expression must be equal to `like`.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      tags:
      - Event Subscriptions
  /v2/event-subscriptions:
    get:
      operationId: get-v2-dashboard-event-subscriptions
      summary: Get list of event subscriptions
      description: 'This endpoint allows API users to retrieve the list of events the user account is subscribed to.


        The results can be filtered and sorted. If the `sort` parameter is not indicated, the results are sorted by the `created` parameter in descending order. The `filters` and `sort` parameters need URL-encoding.'
      parameters:
      - in: query
        name: page
        required: false
        description: In how many pages to display the response.
        schema:
          type: string
          default: '1'
      - in: query
        name: sort:created
        required: false
        description: 'Sort results by the date. Possible values: asc, desc. Format: `?sort[created]=desc`'
        schema:
          type: string
      - in: query
        name: sort:event
        required: false
        description: 'Sort results by the event type (from A to Z). Possible values: asc, desc. Format: `?sort[event]=desc`'
        schema:
          type: string
      - in: query
        name: sort:application
        required: false
        description: 'Sort results by the application name (from A to Z). Possible values: asc, desc. Format: `?sort[application]=desc`'
        schema:
          type: string
      - in: query
        name: filters:entity_id, callback_url
        required: false
        description: 'Search for a string in entity IDs and callback URLs. Format: `?filters=[{"_OR":[{"entity_id":{"type":"like","value":"21a28b47"}},{"callback_url":{"type":"like","value":"21a28b47"}}]}]`'
        schema:
          type: string
      - in: query
        name: filters:date
        required: false
        description: 'Filter results by the timestamps. Format: `?filters=[{"date":{"type":"between","value":[1580719773,1580720509]}}]`'
        schema:
          type: string
      - in: query
        name: filters:event
        required: false
        description: 'Filter results by the specific type of event. Format: `?filters=[{"event":{"type": "in", "value":["document.create", "document.update"]}}]`'
        schema:
          type: string
      - in: query
        name: filters:application
        required: false
        description: 'Filter results by the application. Format: `?filters=[{"application":{"type": "in", "value":["applicationUniqueId1", "applicationUniqueId2"]}}]`'
        schema:
          type: string
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      - in: query
        name: include_event_count
        required: false
        description: Include the number of events that triggered the webhook to the response. If set to `true`, the number is returned in the `event_count` field.
        schema:
          type: boolean
      responses:
        '200':
          description: Correct request with the filter by application ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the event subscription.
                        event:
                          type: string
                          description: Event name that triggers the subscription. Check [list of events](/docs/guides-webhooks#entity-events).
                        action:
                          type: string
                          description: Action performed when the event occurs (for example, callback).
                        active:
                          type: boolean
                          description: Indicates whether the subscription is currently active.
                        created:
                          type: integer
                          description: Timestamp (Unix time) indicating when the subscription was created.
                        version:
                          type: integer
                          description: Subscription schema version.
                        entity_id:
                          type: integer
                          description: Internal numeric ID of the entity.
                        entity_type:
                          type: string
                          description: Type of entity the subscription is linked to (`document`, `document_group`, `user`).
                        event_count:
                          type: 'null'
                          description: Number of events sent (null if none or not tracked).
                        request_method:
                          type: string
                          description: HTTP method used for the callback request.
                        json_attributes:
                          type: object
                          properties:
                            use_tls_12:
                              type: boolean
                              description: Whether TLS 1.2 should be used for the callback.
                            callback_url:
                              type: string
                              description: URL that receives the event callback.
                            docid_queryparam:
                              type: boolean
                              description: Whether the document ID is included as a query parameter.
                            include_metadata:
                              type: boolean
                              description: Whether document metadata is included in the callback payload.
                          description: Additional callback configuration details.
                        application_name:
                          type: string
                          description: Name of the application that owns the subscription.
                        entity_unique_id:
                          type: string
                          description: Unique string ID of the entity.
                        event_subscription_owner_email:
                          type: string
                          description: Email address of the user who created the subscription.
                    description: List of event subscriptions.
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          count:
                            type: integer
                            description: Number of items returned in this response.
                          links:
                            type: array
                            items:
                              type: object
                              properties: {}
                            description: Pagination links (next, previous, etc).
                          total:
