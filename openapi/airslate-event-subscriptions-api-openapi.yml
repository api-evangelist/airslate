      summary: Resend callback
      description: This endpoint allows users to resend a callback.
      parameters:
      - in: path
        name: callback_id
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: subscription_id
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                Example 1:
                  message: Webhook resend successful.
        '400':
          description: '* Incorrect or missing token.

            * Either `callback_url` is still unavailable or it returns an error.'
          content:
            application/json:
              schema:
                type: object
              example:
                Error persists:
                  code: 15006043
                  message: Failed to send callback. Check the current callback info endpoint for details.
                Incorrect or missing token:
                  code: 1537
                  error: invalid_token
        '403':
          description: '* User is trying to resend a successful callback.

            * Thus subscription is deactivated.

            * Either access token or subscription ID belongs to another user.'
          content:
            application/json:
              schema:
                type: object
              example:
                Incorrect user:
                  code: 15006004
                  message: Event subscription is not allowed.
                Deactivated subscription:
                  code: 15006041
                  message: Event subscription has to be active to resend a webhook.
                Resending successful callback:
                  code: 15006042
                  message: Successful webhook resending is not allowed.
        '404':
          description: '* `subscription_id` does not exist

            * `callback_id` does not exist

            * Incorrect `subscription_id`

            * Incorrect `callback_id`'
