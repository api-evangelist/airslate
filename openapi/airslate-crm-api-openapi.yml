openapi: 3.2.0
info:
  title: SignNow CRM API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: CRM
paths:
  /v2/crm/contacts/{contact_id}/groups:
    get:
      operationId: get-v2-crm-contacts-contact-id-groups
      summary: Get contact groups list by contact
      description: Allows users to retrieve the list of contact groups stored in the CRM.
      parameters:
      - in: path
        name: contact_id
        required: true
        description: Contact ID.
        schema:
          type: string
      - in: query
        name: per_page
        required: false
        description: 'How many search items to view per page. Allowed values: positive integers from 1 to 100.'
        schema:
          type: string
          default: '15'
      - in: query
        name: page
        required: false
        description: 'How many pages to fit the results in. Allowed values: any positive integer starting from 1.'
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                Success:
                  data:
                  - id: 8fXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    name: My group
                    created_at: 1672242682
                    updated_at: 1672242682
                  meta:
                    pagination:
                      count: 10
                      links:
                        next: https://example.com/v2/crm/contacts/contact_id/groups?per_page=10&page=3
                        previous: https://example.com/v2/crm/contacts/contact_id/groups?per_page=10&page=1
                      total: 50
                      per_page: 15
                      total_pages: 5
                      current_page: 2
        '400':
          description: '* Request with any of these cases: invalid token of user, expired token of user, empty header, authorization = null, authorization without value

            * Request with incorrect `per_page` parameter type

            * Request with `per_page` less than 0

            * Request with `per_page` more than 100

            * Request with incorrect `page` parameter type

            * Request with `page` less than 0

            '
          content:
            application/json:
              schema:
                type: object
              example:
                Authorization issues:
                  code: 1537
                  message: invalid_token
                Incorrect `page` parameter type:
                  code: 27400904
                  message: Query parameter `page` must be a digit
                Request with `page` less than 0:
                  code: 27400905
                  message: Query parameter `page` must be more than 0
                Incorrect `per_page` parameter type:
                  code: 27400901
                  message: Query parameter `per_page` must be a digit
                Request with `per_page` less than 0:
                  code: 27400902
                  message: Query parameter `per_page` must be more than 0
                Request with `per_page` more than 100:
                  code: 27400903
                  message: Query parameter `per_page` must be less than or equal 100
        '404':
          description: Contact does not exist or does not belong to authorized user
          content:
            application/json:
              schema:
                type: object
              example:
                'Contact does not exist ':
                  code: 27404001
                  message: Contact `contactUniqueId` not found
      security:
      - Bearer: []
      tags:
      - CRM
  /v2/crm/groups:
    post:
      operationId: post-v2-crm-groups
      summary: Create contact group
      description: This endpoint allows users to create the contacts group from your CRM contacts.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
              example:
                Created:
                  data:
                    id: 29XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        '400':
          description: '* Request with any of these cases:


            invalid token of user

            expired token of user

            empty header

            authorization = null

            authorization without value


            * Request without group name or with empty group name

            * Group name must be a string

            * Group name contains invalid characters

            * Group name length exceeded'
          content:
            application/json:
              schema:
                type: object
              example:
                Authorization issues:
                  code: 1537
                  message: invalid_token
                Group name length exceeded:
                  code: 27405005
                  message: Group name length must be not more than 40 characters
                Group name must be a string:
                  code: 27405003
                  message: Group name must be a string
                Group name contains invalid characters:
                  code: 27405004
                  message: Group name contains invalid characters
                Request without group name or empty group name:
                  code: 27405002
                  message: Group name is required
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                type: object
              example:
                Not allowed to use this HTTP method:
                  message: 'The GET method is not supported for this route. Supported methods: DELETE.'
        '422':
          description: Group name already exists
          content:
            application/json:
              example:
                Group name already exists:
                  code: 27405006
                  message: Group with such a name already exists
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: The new contact group name.
              x-examples:
                Example 1:
                  name: My client`s group
        required: true
      tags:
      - CRM
    get:
      operationId: get-v2-crm-groups
      summary: Get the list of groups
      description: Allows users to retrieve the list of groups.
      parameters:
      - in: query
        name: 'filters: id'
        required: false
        description: 'Format: `filters=[{"id":{"type":"in","value": ["01XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"]}}]`'
        schema:
          type: string
      - in: query
        name: 'filters: name'
        required: false
        description: 'Format: `filters=[{"name":{"type":"like","value":"My group"}}]`'
        schema:
          type: string
      - in: query
        name: per_page
        required: false
        description: 'How many search items to view per page. Allowed values: positive integers from 1 to 100.'
        schema:
          type: string
      - in: query
        name: page
        required: false
        description: 'How many pages to fit the results in. Allowed values: any positive integer starting from 1.'
        schema:
          type: string
      - in: header
        name: Accept
        required: false
        description: application/json
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                Success:
                  data:
                  - id: 8fXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    name: My group
                    created_at: 1672242682
                    updated_at: 1672242682
                  meta:
                    pagination:
                      count: 10
                      links:
                        next: https://example.com/v2/crm/groups?per_page=10&page=3
                        previous: https://example.com/v2/crm/groups?per_page=10&page=1
                      total: 50
                      per_page: 15
                      total_pages: 5
                      current_page: 2
        '400':
          description: '* Request with any of these cases: invalid token of user, expired token of user, empty header, authorization = null, authorization without value

            * Request with incorrect `per_page` parameter type

            * Request with `per_page` less than 0

            * Request with `per_page` more than 100

            * Request with incorrect `page` parameter type

            * Request with `page` less than 0

            * Request without `filter` parameters value or type

            * Request with invalid type of `filter` parameter type

            * Request with invalid expression of `email` filter parameter type

            * Request with invalid type of `email` filter parameter value

            * Request with invalid expression of `name` filter parameter type

            * Request with invalid type of `name` filter parameter value

            * Request with invalid filter format

            * Request with invalid `sort` value

            * Request with invalid `sort` order value

            * Request with invalid `sort` format (expected array)

            * Request with invalid `sort` format (more than one field for sorting)

            '
          content:
            application/json:
              schema:
                type: object
              example:
                Invalid sort value:
                  code: 27400906
                  message: The `sort` key must be one of the following values:` created_at`, `full_name`, `company_name`, `email`, `last_interaction_at`
                Authorization issues:
                  code: 1537
                  message: invalid_token
                Invalid filter format:
                  code: 0
                  message: Wrong filters format.
                Incorrect `per_page` type:
                  code: 27400901
                  message: Query parameter `per_page` must be a digit
                Invalid `sort` order value:
                  code: 27400907
                  message: 'The `sort` value must be one of the following values: `asc, desc`'
                Incorrect `page` parameter type:
                  code: 27400904
                  message: Query parameter `page` must be a digit
                Request with `page` less than 0:
                  code: 27400905
                  message: Query parameter `page` must be more than 0
                Invalid data type of `type` filter:
                  code: 27400052
                  message: Invalid filter format, filter `type` should be string
                Invalid type of email filter value:
                  code: 27400054
                  message: The `email` filter value should be of type string
                Invalid type of `name` filter value:
                  code: 27400056
                  message: The `first_name` filter value should be of type string
                Request with `per_page` less than 0:
                  code: 27400902
                  message: Query parameter `per_page` must be more than 0
                Invalid sort format (expected array):
                  code: 0
                  message: 'Expected array, but got {{ type }}: {{ value }}'
                Request with `per_page` more than 100:
                  code: 27400903
                  message: Query parameter `per_page` must be less than or equal 100
                Invalid expression of email filter type:
                  code: 27400053
                  message: The `email` filter expression should be `=` or `like`
                Invalid expression of `name` filter type:
                  code: 27400055
                  message: The `first_name` filter expression should be equal to `like`
                Invalid `sort` format (more than one field):
                  code: 27400908
                  message: The `sort` must contain only one field for sorting
                Request without `filter` parameters value or type:
                  code: 27400051
                  message: Invalid filter format, filter must have `type` and `value` fields
        '404':
          description: Contact does not exist or does not belong to authorized user
          content:
            application/json:
              schema:
                type: object
              example:
                Contact does not exist or does not belong to authorized user:
                  code: 27404001
                  message: Contact `contactUniqueId` not found
      security:
      - Bearer: []
      tags:
      - CRM
  /v2/crm/groups/{group_id}:
    get:
      operationId: get-v2-crm-groups-group-id
      summary: Get contact group
      description: Allows users to retrieve properties of the contact group.
      parameters:
      - in: path
        name: group_id
        required: true
        description: ID of the contact group.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                Success:
                  data:
                  - id: 8fXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    name: My group
                    created_at: 1672242682
                    updated_at: 1672242682
                    contacts_count: 5
        '400':
          description: 'Request with any of cases:


            invalid token of user

            expired token of user

            empty header

            authorization = null

            authorization without value'
          content:
            application/json:
              schema:
                type: object
              example:
                Authorization issues:
                  code: 1537
                  message: invalid_token
        '404':
          description: '* Contacts group not found

            * Contacts group does not belong to authorized user'
          content:
            application/json:
              schema:
                type: object
              example:
                Contacts group not found:
                  code: 27405001
                  message: Group not found
                Contacts group does not belong to authorized user:
                  code: 27405001
                  message: Group not found
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                type: object
              example:
                Not allowed to use this HTTP method:
                  message: 'The DELETE method is not supported for this route. Supported methods: GET.'
      security:
      - Bearer: []
      tags:
      - CRM
    put:
      operationId: put-v2-crm-groups-group-id
      summary: Update contact group
      description: Allows users to rename the contact group.
      parameters:
      - in: path
        name: group_id
        required: true
        description: ID of the contact group.
        schema:
          type: string
      responses:
        '204':
          description: Contacts group has been updated successfully
        '400':
          description: '* Request with any of these cases:


            invalid token of user

            expired token of user

            empty header

            authorization = null

            authorization without value


            * Request without group name or with empty group name

            * Group name must be a string

            * Group name contains invalid characters

            * Group name length exceeded'
          content:
            application/json:
              schema:
                type: object
              example:
                Authorization issues:
                  code: 1537
                  message: invalid_token
                Group name length exceeded:
                  code: 27405005
                  message: Group name length must be not more than 40 characters
                Group name must be a string:
                  code: 27405003
                  message: Group name must be a string
                Group name contains invalid characters:
                  code: 27405004
                  message: Group name contains invalid characters
                Request without group name or empty group name:
                  code: 27405002
                  message: Group name is required
        '404':
          description: Contacts group not found or does not belong to authorized user
          content:
            application/json:
              schema:
                type: object
              example:
                'Contacts group not found ':
                  code: 27405001
                  message: Group not found
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                type: object
              example:
                Not allowed to use this HTTP method:
                  message: 'The GET method is not supported for this route. Supported methods: DELETE.'
        '422':
          description: Group name already exists
          content:
            application/json:
              example:
                Group name already exists:
                  code: 27405006
                  message: Group with such a name already exists
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: The updated group name.
        required: true
      tags:
      - CRM
    delete:
      operationId: delete-v2-crm-groups-group-id
      summary: Remove contact group
      description: Allows users to delete the contact group.
      parameters:
      - in: path
        name: group_id
        required: true
        description: ID of the contact group.
        schema:
          type: string
      responses:
        '204':
          description: "\t\nContacts group has been deleted successfully"
        '400':
          description: 'Request with any of cases:


            invalid token of user

            expired token of user

            empty header

            authorization = null

            authorization without value'
          content:
            application/json:
              schema:
                type: object
              example:
                Authorization issues:
                  code: 1537
                  message: invalid_token
        '404':
          description: '* Contacts group not found

            * Contacts group does not belong to authorized user'
          content:
            application/json:
              schema:
                type: object
              example:
                Contacts group not found:
                  code: 27405001
                  message: Group not found
                Contacts group does not belong to authorized user:
                  code: 27405001
                  message: Group not found
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                type: object
              example:
                Not allowed to use this HTTP method:
                  message: 'The DELETE method is not supported for this route. Supported methods: GET.'
      security:
      - Bearer: []
      tags:
      - CRM
  /v2/crm/groups/{group_id}/contacts:
    get:
      operationId: get-v2-crm-groups-group-id-contacts
      summary: Get contacts from group
      description: Allows users to retrieve contacts from the group.
      parameters:
      - in: path
        name: group_id
        required: true
        description: ID of the group
        schema:
          type: string
      - in: query
        name: sort
        required: false
        description: 'Format: `sort[last_interaction_at]="desc"`. Allowed values: `asc` for ascending order, `desc` for descending order.'
        schema:
          type: string
      - in: query
        name: filter:owners
        required: false
        description: 'Format: `filters=[{"owners":{"type":IN,"value":["e6XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"]}}]'
        schema:
          type: string
      - in: query
        name: filters:shared_with_me
        required: false
        description: 'Format: `filters=[{"shared_with_me":{"type":"=","value":"true"}}]`'
        schema:
          type: string
      - in: query
        name: combined filter with `OR` for email `first_name` and `last_name` and `full_name`
        required: false
        description: 'Format: `filters=[{"_OR":[{"email":{"type":"like","value":"%value%"}},{"first_name":{"type":"like","value":"%value%"}},{"last_name":{"type":"like","value":"%value%"}},{"full_name":{"type":"like","value":"%value%"}}]}]`'
        schema:
          type: string
      - in: query
        name: combined filter with `OR`
        required: false
        description: 'Format: `filters=[{"_OR":[{"interaction":{"type":">","value":1652965774}},{"company":{"type":"=","value":"Best company"}}]}]`'
        schema:
          type: string
      - in: query
        name: combined filter
        required: false
        description: 'Format: `filters=[{"interaction":{"type":">","value":1652918152}, "company":{"type":"=","value":"Best company"}}]`'
        schema:
          type: string
      - in: query
        name: filters:interaction_before
        required: false
        description: 'Filter by interaction before. Format: `filters=[{"interaction":{"type":"<","value":1652918152}}]`'
        schema:
          type: string
      - in: query
        name: filters:interaction_after
        required: false
        description: 'Filter by interaction after. Format: `filters=[{"interaction":{"type":">","value":1652918152}}]`'
        schema:
          type: string
      - in: query
        name: filters:not_company
        required: false
        description: 'Filter out users without a company. Format: `filters=[{"company":{"type":"!=","value":"Best company"}}]`'
        schema:
          type: string
      - in: query
        name: filters:company
        required: false
        description: 'Filter by company. Format: `filters=[{"company":{"type":"=","value":"Best company"}}]`'
        schema:
          type: string
      - in: query
        name: filters:full_name
        required: false
        description: 'Filter by contact last name. Format: `filters=[{"full_name":{"type":"like","value":"value"}}]`'
        schema:
          type: string
      - in: query
        name: filters:last_name
        required: false
        description: 'Filter by contact last name. Format: `filters=[{"last_name":{"type":"like","value":"value"}}]`'
        schema:
          type: string
      - in: query
        name: filters:first_name
        required: false
        description: 'Filter by contact first name. Format: `filters=[{"first_name":{"type":"like","value":"value"}}]`'
        schema:
          type: string
      - in: query
        name: 'filters:email '
        required: false
        description: 'Filter by email. Format: `filters=[{"email":{"type":"=","value":"crm@email.com"}}]`'
        schema:
          type: string
      - in: query
        name: per_page
        required: false
        description: 'How many search items to view per page. Allowed values: positive integers from 1 to 100.'
        schema:
          type: string
      - in: query
        name: page
        required: false
        description: 'How many pages to fit the results in. Allowed values: any positive integer starting from 1.'
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                Example 1:
                  data:
                  - id: 8fXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    meta:
                      created_at: 1649926419
                      updated_at: 1649926419
                      interacted_at: 1649926419
                    email: crm@email.com
                    phone:
                      number: '1234567890'
                      country_code: US
                    address:
                      city: New York
                      state: New York
                      street: 5 Avenue
                      country: US
                      zip_code: '0'
                      apartment: Penthouse
                    company:
                      name: SignNow
                      job_title: PHP Developer
                    last_name: Doe
                    first_name: John
                    description: Best client
                  meta:
                    pagination:
                      count: 10
                      links:
                        next: https://https://example.com/v2/crm/groups/group_id/contacts?per_page=10&page=3
                        previous: https://https://example.com/v2/crm/groups/group_id/contacts?per_page=10&page=1
                      total: 50
                      per_page: 15
                      total_pages: 5
                      current_page: 2
        '400':
          description: '* Request with any of these cases: invalid token of user, expired token of user, empty header, authorization = null, authorization without value

            * Request with incorrect `per_page` parameter type

            * Request with `per_page` less than 0

            * Request with `per_page` more than 100

            * Request with incorrect `page` parameter type

            * Request with `page` less than 0

            * Request without `filter` parameters value or type

            * Request with invalid type of `filter` parameter type

            * Request with invalid expression of `email` filter parameter type

            * Request with invalid type of `email` filter parameter value

            * Request with invalid expression of `first_name` filter parameter type

            * Request with invalid type of `first_name` filter parameter value

            * Request with invalid expression of `last_name` filter parameter type

            * Request with invalid type of `last_name` filter parameter value

            * Request with invalid expression of `full_name` filter parameter type

            * Request with invalid type of `full_name` filter parameter value

            * Request with invalid expression of `company` filter parameter type

            * Request with invalid type of `company` filter parameter value

            * Request with invalid expression of `interaction` filter parameter type

            * Request with invalid type of `interaction` filter parameter value

            * Request with invalid filter format

            * Request with invalid `sort` value

            * Request with invalid `sort` order value

            * Request with invalid `sort` format (expected array)

            * Request with invalid `sort` format (more than one field for sorting)

            * Request with invalid expression of `shared_with_me` filter parameter type

            * Request with invalid type of `shared_with_me` filter parameter type

            * Request with invalid type of `shared_with_me` filter parameter value

            * Request with invalid expression of `owners` filter parameter type

            * Request with invalid type of `owners` filter parameter type

            * Request with invalid type of `owners` filter parameter value'
          content:
            application/json:
              schema:
                type: object
              example:
                Invalid sort value:
                  code: 27400906
                  message: The `sort` key must be one of the following values:` created_at`, `full_name`, `company_name`, `email`, `last_interaction_at`
                Authorization issues:
                  code: 1537
                  message: invalid_token
                Invalid filter format:
                  code: 0
                  message: Wrong filters format.
                Invalid `sort` order value:
                  code: 27400907
                  message: 'The `sort` value must be one of the following values: `asc, desc`'
                Incorrect `page` parameter type:
                  code: 27400904
                  message: Query parameter `page` must be a digit
                Request with `page` less than 0:
                  code: 27400905
                  message: Query parameter `page` must be more than 0
                Invalid type of email filter value:
                  code: 27400054
                  message: The `email` filter value should be of type string
                Invalid type of owners filter type:
                  code: 274001152
                  message: The `owners` filter value should be of type string
                Incorrect `per_page` parameter type:
                  code: 27400901
                  message: Query parameter `per_page` must be a digit
                Invalid type of owners filter value:
                  code: 27400153
                  message: The `owners` contains invalid unique_id ("123")
                Request with `per_page` less than 0:
                  code: 27400902
                  message: Query parameter `per_page` must be more than 0
                Invalid sort format (expected array):
                  code: 0
