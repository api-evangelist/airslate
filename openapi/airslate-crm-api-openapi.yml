  /v2/crm/contacts/import:
    post:
      operationId: post-v2-crm-contacts-import
      summary: Import CRM contacts in bulk
      description: 'This endpoint allows users to import contacts from a CSV file into the authenticated user account. Users can map CSV columns to contact fields and configure how duplicate contacts are handled.


        **Notes:**

        * The CSV file must contain a header row. Data rows start from line 2.

        * Rows where the email value is missing or invalid are skipped and reported under `failed`.

        * Rows with invalid non-email fields (phone, address, etc.) are still created with those fields set to `null` and reported as `created_partial`.

        * CSV separator is auto-detected from the header row (supported: `,`, `;`, `\t`, `|`).

        * Phone country codes are auto-detected from the phone number format (e.g., `+1` → `US`, `+44` → `GB`).

        * If `duplicates` is not specified and duplicate contacts (by email) already exist, a `409 Conflict` is returned.


        **Sample CSV**


        ```csv

        First Name,Last Name,Email,Phone,Company Name,Job Title,Country,Street Address,Apartment,City,State,ZIP Code,Description

        John,Smith,john@example.com,5551234567,Sample Company,Manager,US,17 Station St,Suite 101,Brookline,Massachusetts,02445,This is a sample contact to demonstrate how the columns should be filled out. Don''t forget to remove this contact before importing your contacts.

        ```


        > Values in `mapping[...]` must exactly match the column headers in your CSV (case-sensitive, including spaces and punctuation). Set an optional `mapping[...]` to `null` to skip a field.'
      responses:
        '201':
          description: Contacts imported successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      failed:
                        type: object
                        properties:
                          rows:
                            type: array
                            items:
                              type: integer
                            description: Row numbers (starting at 2) of failed rows.
                          count:
                            type: integer
                            description: Number of failed rows.
                        description: Rows that could not be created due to a missing or incorrect email.
                      created:
                        type: integer
                        description: Number of contacts fully created (excludes partially created).
                      created_partial:
                        type: object
                        properties:
                          rows:
                            type: array
                            items:
                              type: integer
                          count:
                            type: integer
                        description: Contacts created with some non-email fields set to `null` due to validation errors.
              example:
                Import succeeded:
                  data:
                    failed:
                      rows:
                      - 5
                      - 12
                      - 27
                      count: 3
                    created: 45
                    created_partial:
                      rows:
                      - 8
                      - 19
                      count: 2
        '400':
          description: '* Missing or incorrect bearer token.

            * Incorrect `mapping` type.

            * The `mapping` is empty.

            * The `file` is missing or larger than 5 MB.

            * Incorrect `file` type.

            * Incorrect file extension.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                Incorrect `file` type:
                  errors:
                  - code: 27405153
                    message: The `file` type is invalid.
                The `mapping` is empty:
                  errors:
                  - code: 27405149
                    message: The `mapping` value can not be empty.
                Incorrect `mapping` type:
                  errors:
                  - code: 27405148
                    message: The `mapping` should be of type array.
                Incorrect file extension:
                  errors:
                  - code: 27405155
                    message: The allowed file extension is .csv.
                Missing or incorrect bearer token:
                  errors:
                  - code: 1537
                    message: invalid_token
                The `file` is missing or larger than 5 MB:
                  errors:
                  - code: 27405152
                    message: The `file` is required and maximum allowed file size is 5 MB.
        '409':
          description: Returned when the `duplicates` parameter is not set and contacts with matching emails already exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                Duplicate contacts found:
                  errors:
                  - code: 27405161
                    message: Duplicate contacts found
        '422':
          description: '* Incorrect `mapping` value.

            * Incorrect `duplicates` value.

            * The `file` exceeds 5 MB.

            * The `file` exceeds 3000 lines.

            * The `file` is empty.

            * The email column is missing in the file.

            * Some mapping columns are missing in the file.

            * Unable to import contacts.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                The `file` is empty:
                  errors:
                  - code: 27405157
                    message: File can not be empty
                The `file` exceeds 5 MB:
                  errors:
                  - code: 27405154
                    message: The maximum allowed file size is 5 MB
                Incorrect `mapping` value:
                  errors:
                  - code: 27405150
                    message: The `mapping` value is invalid
                Unable to import contacts:
                  errors:
                  - code: 27405160
                    message: Unable to import contacts. Please, try again later
                Incorrect `duplicates` value:
                  errors:
                  - code: 27405151
                    message: Duplicates should be ["skip", "replace"]
                The `file` exceeds 3000 lines:
                  errors:
                  - code: 27405156
                    message: The maximum allowed file size is 3000 lines
                The email column is missing in the file:
                  errors:
                  - code: 27405158
                    message: Column with email is required
                Some mapping columns are missing in the file:
                  errors:
                  - code: 27405159
                    message: Columns from mapping are missed in file
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'CSV file to import. Maximum size: 5 MB. Maximum rows: 3000 (excluding header).'
                duplicates:
                  type: string
                  enum:
                  - skip
                  - replace
                  default: replace
                  description: 'Duplicate handling strategy. Allowed values: `skip`, `replace`. If omitted, the request returns `409 Conflict` when contacts with matching emails already exist.'
                mapping[email]:
                  type: string
                  description: 'Maps the contact email to a CSV column. The value is the column header name in your CSV. Required. Email values in the column must be valid and cannot end with `@no.reply`. Example value: `Email`.'
                mapping[first_name]:
                  type: string
                  description: 'Maps the contact first name to a CSV column. The value is the column header name. Maximum 128 characters. Example value: `First Name`.'
                mapping[last_name]:
                  type: string
                  description: 'Maps the contact last name to a CSV column. The value is the column header name. Maximum 128 characters. Example value: `Last Name`.'
                mapping[description]:
                  type: string
                  description: 'Maps the contact description to a CSV column. The value is the column header name. Maximum 408 characters. Example value: `Description`.'
                mapping[phone]:
                  type: string
                  description: 'Maps the contact phone number to a CSV column. The value is the column header name. Phone values must contain 10–15 digits; country code is auto-detected from the format. Example value: `Phone`.'
                mapping[company][name]:
                  type: string
                  description: 'Maps the company name to a CSV column. The value is the column header name. Maximum 128 characters. Example value: `Company Name`.'
                mapping[company][job_title]:
                  type: string
                  description: 'Maps the contact job title to a CSV column. The value is the column header name. Maximum 128 characters. Example value: `Job Title`.'
                mapping[address][country]:
                  type: string
                  description: 'Maps the contact country to a CSV column. The value is the column header name. Country values must use ISO 2-character codes. Required when `mapping[address][zip_code]` is provided. Example value: `Country`.'
                mapping[address][street]:
                  type: string
                  description: 'Maps the street address to a CSV column. The value is the column header name. Maximum 255 characters. Example value: `Street Address`.'
                mapping[address][apartment]:
                  type: string
                  description: 'Maps the apartment / unit to a CSV column. The value is the column header name. Maximum 255 characters. Example value: `Apartment`.'
                mapping[address][city]:
                  type: string
                  description: 'Maps the city to a CSV column. The value is the column header name. Maximum 128 characters. Example value: `City`.'
                mapping[address][state]:
                  type: string
                  description: 'Maps the state to a CSV column. The value is the column header name. United States only. Maximum 128 characters. Example value: `State`.'
                mapping[address][zip_code]:
                  type: string
                  description: 'Maps the zip code to a CSV column. The value is the column header name. Maximum 10 characters. Requires `mapping[address][country]` to be provided. Example value: `ZIP Code`.'
              required:
              - file
              - mapping[email]
      tags:
      - CRM
  /v2/crm/contacts/{contact_id}/users:
    get:
      operationId: get-v2-crm-contact-id-users
      summary: Get users by contact
