        schema:
          type: integer
      responses:
        '200':
          description: 'List of users with access to contacts '
          content:
            application/json:
              schema:
                type: object
              example:
                List of users with access to contacts:
                  data:
                  - id: feXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    email: crm_user1@emaildomain.com
                    contact:
                      last_name: Doe
                      first_name: John
                    permission:
                      created_at: 1670934578
                      permission: owner
                      updated_at: 1670934578
                  - id: f5XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    email: crm_user2@emaildomain.com
                    contact:
                      last_name: Dow
                      first_name: Jane
                    permission:
                      created_at: 1670934578
                      permission: owner
                      updated_at: 1670934578
                  meta:
                    pagination:
                      count: 2
                      links: {}
                      total: 2
                      per_page: 2
                      total_pages: 1
                      current_page: 1
        '400':
          description: '* Request with any of cases: invalid token, expired token, empty header, authorization = null, authorization without value

            * Request with incorrect per_page parameter type

