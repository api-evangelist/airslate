      parameters:
      - in: path
        name: contact_id
        required: true
        description: ID of the CRM contact.
        schema:
          type: string
      - in: query
        name: per_page
        required: false
        description: 'How many search items to view per page. Allowed values: positive integers from 1 to 100.'
        schema:
          type: string
