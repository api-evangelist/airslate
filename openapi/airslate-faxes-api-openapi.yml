openapi: 3.2.0
info:
  title: SignNow Faxes API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Faxes
paths:
  /v2/faxes/send:
    post:
      operationId: post-v2-faxes-send
      summary: Send fax
      description: This endpoint allows users to send one or several documents by fax.
      responses:
        '204':
          description: Success, no content
          content:
            application/json:
              schema:
                type: object
        '400':
          description: '* Incorrect or missing token

            * No access to the document'
          content:
            application/json:
              schema:
                type: object
              example:
                No access to document:
                  code: 20003014
                  message: Not readable.
                Incorrect or missing token:
                  code: 1537
                  error: invalid_token
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - recipient_number
              - documents
              properties:
                message:
                  type: string
                  description: Fax message
                subject:
                  type: string
                  description: Fax subject
                documents:
                  type: array
                  items:
                    type: string
                  description: Array holding one or more document IDs
                recipient_name:
                  type: string
                  description: Recipient's name
                client_timestamp:
                  type: integer
                  description: UNIX timestamp
                recipient_number:
                  type: string
                  description: Recipient's fax number
                recipient_company:
                  type: string
                  description: Recipient's company name
              x-examples:
                Example 1:
                  message: Custom message
                  subject: Custom subject
                  documents:
                  - 19bef1ba082840888a460c2a4512823114cc2759
                  recipient_name: Some recipient name
                  client_timestamp: 1715265630
                  recipient_number: '+11231231231'
                  recipient_company: Company
        required: true
      tags:
      - Faxes
components:
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
    Basic:
      type: http
      scheme: basic
x-provenance:
  method: harvested
  publisher: airSlate
  source: https://docs.signnow.com/api/swagger.json
