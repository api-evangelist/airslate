  /user:
    post:
      operationId: post-user
      summary: Create user
      description: 'Creates an account for a `user`


        `user` object in SignNow allows you to track the `invite`s, `document`s and `template`s associated with one user. Using API you can create, update and delete users, retrieve their info, verify their emails, reset passwords, track changes with user''s documents, templates, document groups, folders and teams, add them to or remove from organizations. The `user` object is also crucial to event subscriptions: SignNow enables you to trigger callbacks by an event of a specific user.'
      parameters:
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  verified:
                    type: integer
                x-examples:
                  Example 1:
                    id: aad13814e8f369089ee2f12b533545f9534e6cf8
                    email: user@signnow.com
                    verified: 0
              example:
                Example 1:
                  id: aad13814e8f369089ee2f12b533545f9534e6cf8
                  email: user@signnow.com
                  verified: 0
                application/json:
                  id: aaXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                  email: user@email.com
                  verified: 0
        '400':
          description: "* \"unverified_email\" - email has been registered on site before, but not verified\n* \"internal api error\" - request without a required field in body \n* \"User with email exists\" - email has been registered and verified on site before\n* \"Invalid payload\" - request without body"
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                email exists:
                  errors:
                  - code: 66330
                    message: User with email exists
                invalid payload:
                  errors:
                  - code: 65536
                    message: Invalid payload
                unverified email:
                  errors:
                  - code: 66396
                    message: unverified_email
                internal api error:
                  errors:
                  - code: 65544
                    message: internal api error
      security:
      - Basic: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
