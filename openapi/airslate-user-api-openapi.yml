    put:
      operationId: update-user-info
      summary: Change user details
      description: Updates user informaition i.e. first name, last name
      parameters:
      - in: header
        name: Content-Type
        required: false
        description: ''
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: '* Correct change of the first and last name

            * First\last name is a space

            * Too long last name more than 64 chars is cut to 64 chars

            * Correct change password

            * Old password is empty '
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  last_name:
                    type: string
                  first_name:
                    type: string
              example:
                Old password is empty:
                  id: unique_id
                  last_name: last_name
                  first_name: fist_name
                Correct change password:
                  id: unique_id
                  last_name: last_name
                  first_name: first_name
                First\last name is a space:
                  id: unique_id
                  last_name: ''
                  first_name: ''
                Correct change of the first and last name:
                  id: unique_id
                  last_name: new_last_name
                  first_name: new_first_name
                Too long last name more than 64 chars is cut to 64 chars:
                  id: 26XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                  last_name: New last name
                  first_name: '123456789_123456789_123456789_123456789_123456789_123456789_1234'
        '400':
          description: "* Too long fist name (first name more than 64 charters)\n* Incorrect old password \n* The value of \"old_password\" is a space\n* New password is empty \n* The value of \"password\" is a space\n* User password which doesn't respect the rules added to \"password_creation_rules\" if there are any\n* airSlate is not reachable"
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                'New password is empty ':
                  errors:
                  - code: 65563
                    message: Must provide password
                'Incorrect old password ':
                  errors:
                  - code: 65563
                    message: Incorrect old password
                airSlate is not reachable:
                  code: 5001
                  message: Temporary unable to process this request. Please try again later.
                The value of "password" is a space:
                  errors:
                  - code: 65563
                    message: Must provide password
                The value of "old_password" is a space:
                  errors:
                  - code: 65563
                    message: Incorrect old password
                Too long fist name (first name more than 64 charters):
                  errors:
                  - code: 65564
                    message: First name is too long
                User password which doesn't respect the rules added to "password_creation_rules" if there are any:
                  errors:
                  - code: 65662
                    message: 'Password must contain at least one letter. Password Policy: Passwords must contain one letter, one number and one special character. Passwords must be at minimum 8 characters long. When updating passwords, reusing a password form the last 12 passwords is not allowed.'
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                last_name:
                  type: string
                first_name:
                  type: string
                logout_all:
                  type: string
                  description: "if \"true\" - all user tokens with \"scope =*\" expire\n\nif \"false\" - all user tokens except current one are expired \n\nNote: parameter must have string format. \n\nDefault value - \"true\""
                old_password:
                  type: string
                  description: if "password" parameter is added to the body, then this one is required
        required: true
