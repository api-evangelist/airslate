  /user/forgotpassword:
    post:
      operationId: user-forgot-password
      summary: Reset password
      description: Sends password reset link via email
      parameters:
      - in: header
        name: Content-type
        required: false
        description: ''
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: '* Correct request

            * Correct re-request'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Correct request:
                  status: success
                Correct re-request:
                  errors:
                  - code: 0
                    message: The limit of attempts has been exceeded. Please try again later.
        '400':
          description: 'Request with incorrect or missing email '
          content:
            application/json:
              example:
                application/json:
                  errors:
                  - code: 65544
                    message: Invalid email.
      security:
      - Basic: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  description: user's email address that receives the password reset link
        required: true
      tags:
      - User
  /user/verifyemail:
    post:
      operationId: post-user-verifyemail
      summary: Send verification email
      description: This endpoint allows API users to send a verification email to a new user’s email address. Once the user clicks the link in the email, their account will be verified.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                x-examples:
                  Example 1:
                    status: success
              example:
                Example 1:
                  status: success
        '400':
          description: '- The email address is incorrect.

            - The email address is required.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 65536
                      message: Could not send verification email
              example:
                Example 1:
                  errors:
                  - code: 65536
                    message: Could not send verification email
                Email required:
                  errors:
                  - code: 65582
                    message: Email is required.
                Incorrect email:
                  errors:
                  - code: 65536
                    message: Could not send verification email
      security:
      - Basic: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  description: The user's email address where the verification email will be sent.
              x-examples:
                Example 1:
                  email: user@email.com
        required: true
      tags:
      - User
