            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Error code.
                        message:
                          type: string
                          description: Error message.
                    description: List of errors.
              example:
                Missing name:
                  errors:
                  - code: 65536
                    message: Invalid payload
                Folder not found:
                  errors:
                  - code: 65611
                    message: resource does not exist
      security:
      - Bearer: []
      requestBody:
        content:
