                Request with query param `per_page=0` or `page=0`:
                  errors:
                  - code: 0
                    message: Query parameter `per_page` must be more than 0
                  - code: 0
                    message: Query parameter `page` must be more than 0
                Request with query param `per_page` more than 100:
                  errors:
                  - code: 0
