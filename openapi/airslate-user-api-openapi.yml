  /user/folder:
    post:
      operationId: create-folder
      summary: Create folder
      description: 'This endpoint allows API users to create a folder inside the specified parent folder.


        **Notes**


        * To get the ID of a parent folder, such as `Documents`, call `GET /user/folder`.'
      responses:
        '200':
          description: The folder was created. Returns its ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the created folder.
              example:
                Folder created:
                  id: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        '400':
          description: '* `name` is missing or empty

            * The parent folder does not exist'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Error code.
                        message:
                          type: string
                          description: Error message.
                    description: List of errors.
              example:
                Empty name:
                  errors:
                  - code: 65536
                    message: name must not be empty
                Parent folder not found:
                  errors:
                  - code: 65626
                    message: parent resource does not exist
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - parent_id
              properties:
                name:
                  type: string
                  description: Name of the new folder.
                parent_id:
                  type: string
                  description: ID of the folder to create the new folder in.
        required: true
      tags:
      - User
    get:
      operationId: get-all-folders
      summary: Get all folders
      description: 'This endpoint allows API users to get the root folder of the user and its top-level folders, including the system folders (`Documents`, `Archive`, `Templates`, `Trash Bin`) and team folders.


        **Notes**


        * The same operation is also available at `GET /folder`.

        * `document_count` and `template_count` depend on `entity_type`. By default (`document-all`), a folder counts only documents or only templates, depending on the folder type.

        * To get the contents of a specific folder, call `GET /folder/{folder_id}`.'
      parameters:
      - in: query
        name: filters
        required: false
        description: 'Filter to apply to the document list. Possible values: `signing-status`, `documents-created`, `documents-updated`. Set the filter value in `filter-values`.'
        schema:
          type: string
      - in: query
        name: filter-values
        required: false
        description: 'Value for the filter set in `filters`. For `signing-status`: `signed`, `pending`, `waiting-for-me`, `waiting-for-others`, `unsent`. For `documents-created` and `documents-updated`: a Unix timestamp; documents created or updated from that time are returned. Date filters do not apply to templates.'
        schema:
          type: string
      - in: query
        name: sortby
        required: false
        description: 'Field to sort documents by. Possible values: `created`, `updated`, `recently_used`. `recently_used` sorts templates by the date the last invite was sent and applies to `Templates` folders.'
        schema:
          type: string
      - in: query
        name: order
        required: false
        description: 'Sort order. Can be used only with `sortby`. Possible values: `desc`, `asc`. Default: `desc`.'
        schema:
          type: string
      - in: query
        name: limit
        required: false
        description: 'Maximum number of documents to return. Max: `100`. Larger values are reduced to `100`.'
        schema:
          type: integer
      - in: query
        name: offset
        required: false
        description: Number of documents to skip before the returned page starts.
        schema:
          type: integer
      - in: query
        name: subfolder-data
        required: false
        description: 'Whether to include subfolders in the response. Possible values: `1`, `0`. Must be used with `include_documents_subfolders`.'
        schema:
          type: string
      - in: query
        name: include_documents_subfolders
        required: false
        description: 'Whether to include subfolders in the response. Possible values: `1`, `0`. Must be used with `subfolder-data`.'
        schema:
          type: string
      - in: query
        name: with_team_documents
        required: false
        description: 'Whether to include `Team Documents` folders. Possible values: `true`, `false`.'
        schema:
          type: string
      - in: query
        name: only_favorites
        required: false
        description: 'Whether to return only favorite documents and document groups. Possible values: `true`, `false`. Default: `false`.'
        schema:
          type: string
      - in: query
        name: entity_type
        required: false
        description: 'Entities counted in `document_count` and `template_count`. Possible values: `document-all` (default): only documents or only templates, depending on the folder type. `all`: all entity types in the folder. `document`: documents that are not in a document group; `Documents`, `Archive`, and `Trash Bin` folders only. `document-group`: documents in document groups; `Documents`, `Archive`, and `Trash Bin` folders only. `template`: templates; `Templates` and `Trash Bin` folders only. `dgt`: document group templates; `Templates` and `Trash Bin` folders only.'
        schema:
          type: string
      responses:
        '200':
          description: '* Success

            * With document group invite where user is the owner

            * With document group invite where user is the signer

            * With viewer field invites

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the root folder.
                  name:
                    type: string
                    description: Name of the root folder. Always `Root`.
                  shared:
                    type: boolean
                    description: Whether the folder is shared.
                  created:
                    type: string
                    description: Unix timestamp of when the root folder was created, as a string.
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID of the folder.
                        name:
                          type: string
                          description: Name of the folder, for example `Documents`, `Templates`, or `Trash Bin`.
                        shared:
                          type: boolean
                          description: Whether the folder is shared.
                        created:
                          type: string
                          description: Unix timestamp of when the folder was created, as a string.
                        team_id:
                          type: string
                          description: ID of the team. Team folders only.
                        user_id:
                          type: string
                          description: ID of the folder owner.
                        team_name:
                          type: string
                          description: Name of the team. Team folders only.
                        team_type:
                          type: string
                          description: Access type of the team folder, for example `VIEWABLE`. Team folders only.
                        folder_count:
                          type: string
                          description: Number of subfolders in the folder, as a string.
                        document_count:
                          type: string
                          description: Number of documents in the folder, as a string. Which entities are counted depends on `entity_type`.
                        template_count:
                          type: string
                          description: Number of templates in the folder, as a string. Which entities are counted depends on `entity_type`.
                    description: Top-level folders of the user, including system folders and team folders.
                  user_id:
                    type: string
                    description: ID of the user.
                  documents:
                    type: array
                    items:
                      type: object
                    description: Documents directly in the root folder. Usually empty.
                  parent_id:
                    type:
                    - string
                    - 'null'
                    description: ID of the parent folder. Always `null` for the root folder.
                  system_folder:
                    type: boolean
                    description: Whether the folder is a system folder. Always `true` for the root folder.
                  total_documents:
                    type: integer
                    description: Number of documents directly in the root folder.
              example:
