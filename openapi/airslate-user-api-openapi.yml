  /user/documentgroups:
    get:
      operationId: get-user-documentgroups
      summary: Get document groups
      description: 'Returns back all document groups the user owns.


        The call is paginated by last_updated, so offset and limit query parameters are required:

        1. Limit must be greater than 0 but less than or equal to 50.

        2. Offset must be 0 or greater.'
      parameters:
      - in: query
        name: limit
        required: true
        description: ''
        schema:
          type: integer
      - in: query
        name: offset
        required: true
        description: ''
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_groups:
                    type: array
                    items:
                      type: object
                      properties:
                        group_id:
