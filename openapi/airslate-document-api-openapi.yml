        required: true
      tags:
      - Document
  /document/{doc_id_for_sms}/invite:
    post:
      operationId: post-document-document-id-for-sms-invite-send-invite-via-sms
      summary: Invite to sign via SMS
      description: 'This endpoint allows users to send a document for signature via SMS. Recipients receive an SMS with a link to the document. It is the same `POST /document/{document_id}/invite` request as Invite to sign, with signers identified by `phone_invite`. Different signers of one invite can receive it by SMS or by email.


        Learn more about SMS invites.


        **Notes**


        * SMS delivery is available for signers in the `to` array. Viewers and approvers receive the invite by email.

        * Identify each signer by exactly one of `phone_invite`, `email`, or `email_group`.

        * Use `sms_message` to customize the SMS text. `subject`, `message`, and `header` in `to` apply only to signers invited by email.

        * `subject` and `message` in the request root are allowed when at least one signer receives the invite by email.

        * `phone_invite` is `+` followed by digits, max `14` characters.

        * SMS invites require the CFR and **Require login to sign** organization settings to be off, and cannot be used with `sso_login` authentication. See the errors in the `400` response.

        * Custom `sms_message` and `authentication_sms_message` require an API free trial, an active API subscription, or a Site License.'
      parameters:
      - in: header
        name: Content-type
        required: false
        description: application/json
        schema:
          type: string
      - in: path
        name: doc_id_for_sms
        required: true
        description: ID of the document. The same `document_id` as in [Invite to sign](/docs/document-field-invite/operations/post-document-doc-id-invite).
        schema:
          type: string
      responses:
        '200':
          description: Returns success if the request is correct.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    minLength: 1
                    description: The result of the request. Returns `success` when the SMS invite is sent.
                x-examples:
                  example-1:
                    status: success
              example:
                example-1:
                  status: success
        '400':
          description: "Incorrect phone number\n\nAll standard responses for invite: \n\n* Incorrect access token, \"code\": 1537. Message: \"invalid_token\"\n* Incorrect \"to\" email, \"code\": 65536. Message: \"To must be a valid email.\"\n* Incorrect \"from\" email, \"code\": 65536. Message: \"From must be a valid email.\"\n* Wrong role, \"code\": 65536. Message: \"Role {{role_id_1}} does not exist on document\"\n* The document doesn’t contain field, \"code\": 65594. Message: \"Cannot send a field invite: This document does not contain fields.\"\n* Send the same field invite for the second time, \"code\": 65629. Message: \"Could not create duplicate field invite\"\n* Incorrect document, \"code\": 65582. Message: \"Document not found\"\n* Authentication type is missing, \"code\": 65536. Message: \"Authentication type must not be empty\"\n* The password or phone parameter for the authentication type is missing, \"code\": 65536. Message:  Both password and phone must not be empty\n\n* `sms_message` value is too long, code 65536. Message : \"SMS message should not exceed 230 characters\".\n* `sms_message` value is blank , code 65536. Message : \"SMS message must not be empty\".\n* `sms_message` contains characters outside GSM-7, code 65536. Message: \"Only GSM-7 characters are allowed for `sms_message`.\"\n\n* `phone_invite` value is not valid, code 104833. Message: \"The phone_invite value is invalid.\"\n* `phone_invite` value is blank, code 104833. Message: \"The phone_invite must not be empty string.\"\n* `phone_invite` value is longer than 14 characters, code 104833. Message: \"The phone_invite value is too long. It should have 14 characters.\"\n*  Phone number doesn't exist, code 39297. Message: \"The phone_invite value holds a non-existent phone number.\"\n*  Incorrect data in 'phone_invite', code 104833. Message: \"The phone_invite value should be of type string.\"\n*  Must be email or phone number, not both at the same time, code 65582. Message: \"Either `phone_invite`, `email`, or `email_group` in `to` is required. Only one parameter at a time is allowed.\"\n*  Org setting ‘Require Login to Sign’ when the setting is ON, code 46. Message: \"The phone_invite cannot be used with require_login_for_signing setting enabled.\"\n* Org setting CFR is enabled, code 46. Message: \"phone_invite cannot be used with cfr setting enabled.\"\n* The signer's `authentication_type` is `sso_login`, code 19099002. Message: \"Authentication type sso_login is incompatible with SMS delivery type.\"\n\n* `subject` or `message` is set for a signer invited by SMS, code 65582. Message: \"The phone_invite field is not allowed with: message, subject\"\n* `electronic_consent_required` is `true` for a signer invited by SMS, code 65582. Message: \"Electronic consent cannot be required for invite via sms\"\n* Root `subject` or `message` is set and all signers are invited by SMS, code 65536. Message: \"The phone_invite field is not allowed with subject in root when all signers via sms.\" or \"The phone_invite field is not allowed with message in root when all signers via sms.\"\n* A viewer is identified by `phone_invite` instead of `email`, code 65536. Message: \"Either `email` or `email_group` in `viewers` is required. Only one parameter at a time is allowed.\"\n* An approver is identified by `phone_invite` instead of `email`, code 65585. Message: \"The `email` value should not be blank.\"\n\n* The custom SMS limit of a trial subscription is reached, code 46. Message: \"Custom SMS limit exceeded for trial subscription.\"\n* Phone verification is used on a subscription without it, code 46. Message: \"Phone authentication can't be used with the current subscription.\""
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                SMS for a viewer:
                  errors:
                  - code: 65536
                    message: Either `email` or `email_group` in `viewers` is required. Only one parameter at a time is allowed.
                CFR setting enabled:
                  errors:
                  - code: 46
                    message: phone_invite cannot be used with cfr setting enabled.
                SMS for an approver:
                  errors:
                  - code: 65585
                    message: The `email` value should not be blank.
                Subject or message for an SMS signer:
                  errors:
                  - code: 65582
                    message: 'The phone_invite field is not allowed with: message, subject'
                The selected phone number is incorrect:
                  errors:
                  - code: 65582
                    message: phone_invite is not valid phone for the sms sent.
                Could not create duplicate field invite:
                  errors:
                  - code: 65629
                    message: Could not create duplicate field invite.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - from
              - to
              properties:
                cc:
                  type: array
                  items:
                    type: string
                  description: Email addresses of CC recipients. Each address must be unique.
                to:
                  type: array
                  items:
                    type: object
                    required:
                    - role
                    properties:
                      role:
                        type: string
                        minLength: 1
                        description: Signer's role name, for example `Signer 1`. Required unless `role_id` is specified.
                      email:
                        type: string
                        minLength: 1
                        description: Signer's email address for an email invite. Use exactly one of `email`, `phone_invite`, or `email_group` per signer.
                      order:
                        type: integer
                        description: 'Order of signing: `1` - the signer signs the document first, then the document is sent to `2`, `3`, and so on. Several signers can have the same order. Min: `1`, Max: `127`.'
                      phone:
                        type: string
                        example: +1XXXXXXXXXX
                        description: 'Phone number used to verify the signer. Required with `"authentication_type": "phone"`.'
                      header:
                        type: string
                      method:
                        type: string
                        default: sms
                        description: 'Method of the `phone` authentication type. Required with `"authentication_type": "phone"`. Possible values: `sms`, `phone_call`.'
                      message:
                        type: string
                        minLength: 1
                        description: Custom email message for the signer. Not allowed for signers invited by SMS. Requires a paid API plan, an API free trial, or a Site License.
                      role_id:
                        type: string
                        minLength: 1
                        description: ID of the signer's role. Can be used instead of `role`.
                      subject:
                        type: string
                        minLength: 1
                        description: Custom email subject for the signer. Not allowed for signers invited by SMS. Requires a paid API plan, an API free trial, or a Site License.
                      language:
                        type: string
