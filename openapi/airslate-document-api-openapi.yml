  /document/{document_id}/attachment/{attachment_id}/download:
    get:
      operationId: download-document-attachment
      summary: Download document attachment
      description: Downloads a file attached to the document by signer
      parameters:
      - in: path
        name: document_id
        required: true
        description: 'Unique document id '
        schema:
          type: string
      - in: path
        name: attachment_id
        required: true
        description: 'unique id of the attachment.


          can be found in the response to `GET /document/{docuument_id}` request'
        schema:
          type: string
      responses:
        '200':
          description: Attachment file is returned in the response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
      - Bearer: []
      tags:
      - Document
  /document/{document_id}/download:
    get:
      operationId: download-document
      summary: Download document
      description: 'Downloads a document.


        Possible values for `type` query param are `collapsed`, `zip` and `email`.


        `Collapsed` returns the raw data of the pdf document that can be written to a blank .pdf file.


        `Zip` returns the raw data of a zip file containing the pdf and any attachments on that document that can be written to blank a .zip file.


        `Email` returns zip file with document that have ID on each page, attachments and history file in case history has been requested.'
      parameters:
      - in: path
        name: document_id
        required: true
        description: ''
        schema:
          type: string
      - in: query
        name: type
        required: true
        description: Types of document to download
        schema:
          type: string
      - in: query
        name: with_history
        required: false
        description: downloads collapsed document with a table containing the document's history if with_history=1
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
      - Bearer: []
      tags:
      - Document
  /document/{document_id}/download/link:
    post:
      operationId: get-document-download-link
      summary: Get document download link
      description: Returns a one-time use URL for anyone to download the document as a PDF.
      parameters:
      - in: path
        name: document_id
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: string
                    format: uri
              example:
                application/json:
                  link: https://example.com/document_download_id=67XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      security:
      - Bearer: []
      tags:
      - Document
  /document/{document_id}/metadata:
    get:
      operationId: get-document-document-id-metadata
      summary: Get metadata of a document
      description: This endpoint allows users to retrieve metadata for a selected document.
      parameters:
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      - in: path
        name: document_id
        required: true
        description: ID of the document.
        schema:
          type: string
      responses:
        '200':
          description: Correct request
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Correct request:
                  content:
                    key1: value
                    key2: value
                    key3: value
                    source: webhook
                  updated: '0'
                  application_id: application_id
        '400':
          description: '* Request with bearer token from another user

            * Invalid token'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Invalid token:
                  code: 1537
                  error: invalid_token
                Request with bearer token from another user:
                  errors:
                  - code: 65610
                    message: not readable
        '404':
          description: Request with `document_id` that doesn’t match the pattern `[a-z0-9]{40}`
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Request with `document_id` that doesn’t match the pattern `[a-z0-9]{40}`:
                  errors:
                  - '404': 'Unable to find a route to match the URI: document/{incorrect_document_id}/metadata'
      security:
      - Bearer: []
      tags:
      - Document
    put:
      operationId: put-document-document-id-metadata
      summary: Add metadata to a document
      description: This endpoint allows users to add metadata to the selected document. All added metadata will be linked to the document during the invite to sign. Also, if you'd like to use this metadata in any event subscription, you can add upon creating a webhook.
      parameters:
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      - in: path
        name: document_id
        required: true
        description: ID of the document.
        schema:
          type: string
      responses:
        '200':
          description: Correct request
          content:
            application/json:
              example:
                Correct request:
                  success: true
        '400':
          description: '* Incorrect or missing token

            * Request with bearer token from another user

            * Request without `source` key

            * `source` is not a string'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                source not string:
                  errors:
                  - code: 65916
                    message: Source must be a string
                Another user's token:
                  errors:
                  - code: 65610
                    message: not readable
                Request without source:
                  errors:
                  - code: 65916
                    message: Source must not be empty
                Incorrect or missing token:
                  code: 1537
                  error: invalid_token
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              properties:
                key:
                  type: string
                  description: Any type of metadata that should be added to the document. For example,`signer_id`.
                key1:
                  type: string
                  description: Any type of metadata that should be added to the document. For example, `timestamp`.
                key2:
                  type: string
                  description: Any type of metadata that should be added to the document. For example, `document_owner_id`.
                source:
                  type: string
                  description: 'The object that uses this metadata. Allowed values: `webhook`.'
              x-examples:
                Example 1:
                  key: value
                  key1: value
                  key2: value
                  source: webhook
        required: true
      tags:
      - Document
  /document/{document_id}/move:
