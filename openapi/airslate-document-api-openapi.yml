  /document/{document_id}/scheduled-invite:
    post:
      operationId: post-document-scheduled-invite
      summary: Create scheduled invite
      description: 'This endpoint allows API users to create a scheduled document invite. At the moment specified by `scheduled_timestamp`, the invite is sent to recipients automatically. Both freeform invite and field invite can be sent.


        **Notes**


        * A paid API plan or Site License is required to create a scheduled invite.

        * `scheduled_timestamp` must be a Unix timestamp (in seconds) that points to a moment in the future.

        * The invite type is detected from the `invite_data` payload shape:

        * If the document does **not** contain fields, pass a freeform invite payload in `invite_data`.

        * If the document contains fields, pass a field invite payload in `invite_data`.

        * Each document can have only one scheduled invite in the `active` status.'
      parameters:
      - in: path
        name: document_id
        required: true
        description: ID of the document for which the scheduled invite is created.
        schema:
          type: string
      responses:
        '204':
          description: Returned when the scheduled invite passes validation and is stored with the `active` status. The response body is empty.
        '400':
          description: 'Validation errors for the scheduled invite payload:


            * `scheduled_timestamp` is missing, null, not an integer, or points to a moment in the past.

            * `invite_data` is missing, null, of the wrong type, or empty.

            * The document already has an active scheduled invite.

            * The user is not the document owner.


            In addition, all validation errors that apply to the regular invite payload also apply to the contents of `invite_data`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                invite_data is null:
                  errors:
                  - code: 65536
                    message: The `invite_data` value should not be null.
                invite_data is empty:
                  errors:
                  - code: 65536
                    message: The `invite_data` value must not be an empty array.
                invite_data wrong type:
                  errors:
                  - code: 65536
                    message: The `invite_data` value should be of type array.
                Incorrect scheduled time:
                  errors:
                  - code: 65582
                    message: Incorrect scheduled time for invite.
                User is not document owner:
                  errors:
                  - code: 65582
                    message: User is not document owner
                scheduled_timestamp is null:
                  errors:
                  - code: 65536
                    message: The `scheduled_timestamp` value should not be null.
                scheduled_timestamp wrong type:
                  errors:
                  - code: 65536
                    message: The `scheduled_timestamp` value should be of type int.
                Scheduled invite already exists:
                  errors:
                  - code: 65582
                    message: A scheduled invite already exists.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - scheduled_timestamp
              - invite_data
              properties:
                invite_data:
                  type: object
                  description: 'The full document invite payload. The invite type is detected from the payload shape:


                    * Send the same body as the [Create freeform invite](/docs/doc-freeform-invite/operations/post-freeform-document-id-invite) endpoint when the document does not contain fields.

                    * Send the same body as the [Create field invite](/docs/document-field-invite/operations/post-document-doc-id-invite) endpoint when the document contains fields.'
                scheduled_timestamp:
                  type: integer
                  example: 1820000000
                  description: Unix timestamp (in seconds) of the moment when the prepared invite must be sent. Must be a positive integer that points to a moment in the future.
              x-examples:
                Field invite (document with fields):
                  invite_data:
                    cc:
                    - cc-recipient@email.com
                    to:
                    - role: Signer
                      email: signer1@email.com
                      order: 2
                      message: Hi, please sign this document.
                      subject: New signature request
                      password: '123456'
                      reminder:
                        remind_after: 5
                        remind_before: 3
                        remind_repeat: 2
                      redirect_uri: https://example.com/
                      expiration_days: 30
                      redirect_target: blank
                      authentication_type: password
                      decline_redirect_uri: https://example.com/
                    from: sender@email.com
                    message: Please sign the attached document.
                    subject: Needs your signature
                    viewers:
                    - role: Viewer
                      email: viewer@email.com
                      order: 3
                      message: Please review the document.
                      subject: Document for your review
                    approvers:
                    - role: Approver
                      email: approver@email.com
                      order: 1
                      phone: '+12025550123'
                      method: phone_call
                      message: Review and approve before sending to the signer.
                      subject: Please approve the document
                      redirect_uri: https://example.com/
                      expiration_days: 30
                      redirect_target: blank
                      authentication_type: phone
                    cc_message: CC on a signature request.
                    cc_subject: Signature requested
                  scheduled_timestamp: 1820000000
                Freeform invite (document without fields):
                  invite_data:
                    cc:
                    - cc-recipient@email.com
                    to: signer1@email.com
                    from: sender@email.com
                    message: Please sign this document.
                    subject: Please sign this document
                    language: en
                    cc_message: CC on a signature request.
                    cc_subject: Signature requested
                    redirect_uri: https://example.com/
                    redirect_target: blank
                  scheduled_timestamp: 1820000000
        required: true
      tags:
      - Document
    put:
      operationId: put-document-scheduled-invite
      summary: Update scheduled invite
      description: 'This endpoint allows API users to update the `scheduled_timestamp` of an active scheduled document invite. Only the timing can be changed; to change the invite payload itself, cancel the active scheduled invite and create a new one.


        **Notes**


        * A paid API plan or Site License is required.

        * The new `scheduled_timestamp` must be a Unix timestamp (in seconds) that points to a moment in the future.

        * The document must have a scheduled invite in the `active` status.'
      parameters:
      - in: path
        name: document_id
        required: true
        description: ID of the document for which the scheduled invite is created.
        schema:
          type: string
      responses:
        '200':
          description: Returned when the scheduled invite is successfully rescheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                x-examples:
                  Success:
                    result: success
              example:
                Success:
                  result: success
        '400':
          description: 'Validation errors for the update payload:


            * `scheduled_timestamp` is missing, null, not an integer, or points to a moment in the past.

            * The document does not have an active scheduled invite.

            * The user is not the document owner.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                Incorrect scheduled time:
                  errors:
                  - code: 65582
                    message: Incorrect scheduled time for invite.
                User is not document owner:
                  errors:
                  - code: 65582
                    message: User is not document owner
                scheduled_timestamp is null:
                  errors:
                  - code: 65536
                    message: The `scheduled_timestamp` value should not be null.
                scheduled_timestamp wrong type:
                  errors:
                  - code: 65536
                    message: The `scheduled_timestamp` value should be of type int.
                Active scheduled invite not found:
                  errors:
                  - code: 65582
                    message: Active scheduled invite not found.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - scheduled_timestamp
              properties:
                scheduled_timestamp:
                  type: integer
                  example: 1820000000
                  description: New Unix timestamp (in seconds) of the moment when the prepared invite must be sent. Must be a positive integer that points to a moment in the future.
              x-examples:
                Correct request:
                  scheduled_timestamp: 1820000000
        required: true
      tags:
      - Document
    delete:
      operationId: delete-document-scheduled-invite
      summary: Cancel scheduled invite
      description: This endpoint allows API users to cancel an active scheduled document invite. Once cancelled, the scheduled invite is no longer in the `active` status and will not be sent at the originally scheduled time. After cancellation, a new scheduled invite can be created for the same document.
      parameters:
      - in: path
        name: document_id
        required: true
        description: ID of the document for which the scheduled invite is created.
        schema:
          type: string
      responses:
        '200':
          description: Returned when the active scheduled invite is successfully cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                x-examples:
                  Success:
                    result: success
              example:
                Success:
                  result: success
        '400':
          description: 'Errors:


            * The document does not have an active scheduled invite.

            * The user is not the document owner.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                User is not document owner:
                  errors:
                  - code: 65582
                    message: User is not document owner
                Active scheduled invite not found:
                  errors:
                  - code: 65582
                    message: Active scheduled invite not found.
      security:
      - Bearer: []
      tags:
      - Document
  /document/{document_id}/scheduled-invite/send:
    post:
      operationId: post-document-scheduled-invite-send
      summary: Send scheduled invite
      description: This endpoint allows API users to send an active scheduled document invite immediately, bypassing the originally scheduled time. After the invite is sent, the scheduled record is removed from the `active` status.
      parameters:
      - in: path
        name: document_id
        required: true
        description: ID of the document whose scheduled invite is sent immediately.
        schema:
          type: string
      responses:
        '200':
          description: 'Returned when the scheduled invite is sent successfully. The response shape depends on the invite type: field invite returns `status`; freeform invite returns `result`, `id`, and `callback_url`.'
          content:
            application/json:
              schema:
                type: object
                description: 'Field invite shape: `{status}`. <br> Freeform invite shape: `{result, id, callback_url}`. <br> See examples.'
              example:
                Field invite:
                  status: success
                Freeform invite:
                  id: cf167dedcbe2466287033ddffb32fb18c4ad5346
                  result: success
                  callback_url: none
        '400':
          description: 'Errors:


            * The document does not have an active scheduled invite.

            * The user is not the document owner.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
              example:
                User is not document owner:
                  errors:
                  - code: 65582
                    message: User is not document owner
                Active scheduled invite not found:
                  errors:
                  - code: 65582
                    message: Active scheduled invite not found.
      security:
      - Bearer: []
      tags:
      - Document
