openapi: 3.2.0
info:
  title: SignNow Document API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Document
paths:
  /document/{document_id}/invite:
    post:
      operationId: post-document-document-id-invite
      summary: Send document invite with payment request
      description: 'This endpoint allows users to send a document invite with a payment request. Recipients will be redirected to the payment page after completing the documents.


        > To request a payment, users must either connect to the payment service individually or accept an invitation to an organization already connected to the payment service.


        - To invite a user to an organization, see Add members.


        - To accept an invitation to an organization, the user can click the link they receive, or see Accept invite to organization.


        - To connect your organization to the payment service, see Connect to merchant account.


        A payment request can be linked to a specific field (`calculated` type) or set as a fixed amount (`fixed`type).


        This article lists only the parameters required for a payment request. For other field invite parameters, see Send field invite.


        **Use additional attributes to customize the request**


        | Parameter | Description | Example |

        | --- | --- | --- |

        | `field_type` | Type of the field that sets the payment amount. Required if the request `type` is `calculated`. For a payment request invite, `filed_type` is `text_fields`. | |

        | `field_name` | Name of the field that sets the payment amount. Used if the `type` is `calculated`. Can be found in the Get document response (fields.name). | See the screenshot above. |

        | `type` | Defines how the payment amount is set. Allowed values: `fixed` (the amount is set in the amount field) and `calculated` (set using a document field).


        Learn how to add a payment request field. | |

        | `currency` | Payment currency in ISO format. | |

        | `amount` | Amount of payment. Required if `type` is ''fixed''. | See the screenshot above. |'
      parameters:
      - in: path
        name: document_id
        required: true
        description: Document ID.
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                x-examples:
                  Example 1:
                    status: success
              example:
                Success:
                  status: success
        '400':
          description: "- `field_id` is empty or missing. \n- `field_type` is missing or incorrect.\n- `amount` is empty or missing.\n- `currency` is missing.\n- `type` is missing.\n- `merchants` is empty.\n- Merchant ID is incorrect."
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 65536
                      message: 'Invalid field type, valid types are: text_fields'
              example:
                Merchants empty:
                  errors:
                  - code: 65536
                    message: Required at least one merchant account in payment request
                currency missing:
                  errors:
                  - code: 65536
                    message: Must provide currency type for payments
                Merchant ID incorrect:
                  errors:
                  - code: 65536
                    message: Invalid merchant_id in payment_field_request
                amount empty or missing:
                  errors:
                  - code: 65536
                    message: For fixed payment types, please enter non zero amount
                field_id empty or missing:
                  errors:
                  - code: 65536
                    message: Invalid field id provided
                field_type missing or incorrect:
                  errors:
                  - code: 65536
                    message: 'Invalid field type, valid types are: text_fields'
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              - from
              properties:
                to:
                  type: array
                  items:
                    type: object
                    required:
                    - email
                    - role
                    properties:
                      role:
                        type: string
                        example: Recipient 1
                        description: Recipient's role. Can be found in the response to [Get document](/docs/document/operations/get-document) request (roles.name).
                      email:
                        type: string
                        example: signer@email.com
                        description: Recipient's email address.
                      payment_request:
                        type: object
                        required:
                        - type
                        - currency
                        - merchants
                        properties:
                          type:
                            type: string
                            example: calculated
                            description: 'Defines how the payment amount is set. Possible values: `fixed` (the payment amount is set in the amount field) and `calculated` (the payment amount is set using a document field).'
                          amount:
                            type: string
                            example: '1000'
                            description: Payment amount. Required if `type` is `fixed`.
                            x-stoplight:
                              id: ai5r848z73xpb
                          currency:
                            type: string
                            example: USD
                            description: Payment currency in ISO format.
                          field_id:
                            type: string
                            example: 6d1511309f7f4d80b4df8e19a804d58846504000
                            description: ID of the field that sets the payment amount. Required if the request `type` is `calculated`. Can be found in the [Get document](/docs/document/operations/get-document) response (fields.id).
                          merchants:
                            type: array
                            items:
                              type: string
                              example: 44bdae1e20624166b8073b58560066fc68440000
                            description: IDs of connected payment service accounts. Found in the [Get user](/docs/user/operations/get-user-info) response and [Get merchant account](/docs/request-payments/operations/get-organizations-org-id-merchantaccount-merchant-account-id) response.
                          field_name:
                            type: string
                            example: payment_field
                            description: Name of the field that sets the payment amount. Used if the `type` is `calculated`. Can be found in the [Get document](/docs/document/operations/get-document) response (fields.name).
                          field_type:
                            type: string
                            example: text_fields
                            description: 'Type of the field that sets the payment amount. Required if the request `type` is `calculated`. Allowed value is `text_fields`.

                              '
                        description: Payment request details.
                  description: An array of objects with email addresses and settings for all recipients.
                from:
                  type: string
                  example: sender@email.com
                  description: Sender's email address.
              x-examples:
                Example 1:
                  to:
                  - role: Signer 1
                    email: signer@email.com
                    order: 1
                    role_id: dc594a43ed1d43b3abe4f50302420df507119111
                    payment_request:
                      type: calculated
                      currency: USD
                      field_id: 6d1511309f7f4d80b4df8e19a804d58846504000
                      merchants:
                      - 44bdae1e20624166b8073b58560066fc68440000
                      - e314905b9fa546f999013bf2551225f4e0190000
                      field_name: payment_field
                      field_type: text_fields
                  from: sender@email.com
                  document_id: 2274bf62786844e981584543275cdc0c88d67d45
        required: true
      tags:
      - Document
  /document:
    post:
      operationId: upload-document
      summary: Upload document
      description: 'Uploads a file to user''s account and returns unique id of the uploaded document. Accepts .pdf, .doc, .docx, .odt, .rtf, .png, .jpg, .jpeg, .gif, .bmp, .xml, .xls, .xlsx, .ppt, .pptx, .ps, and .eps file types.


        Maximum file size per upload is 50 Mb.


        The same limit works for the attachments uploaded by signers via SignNow editor.


        For more information, check out our video tutorial.


        **Video tutorial**


        Note: The design shown in the video is outdated, but the flow is still accurate. You can go ahead and follow the steps as demonstrated.


        Video tutorial'
      responses:
        '200':
          description: Successful request
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                application/json:
                  id: 9cXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: '@/path/to/your/file.pdf'
                check_fields:
                  type: boolean
                  description: If true, you can upload a document with simple text tags. For more information, see [Upload document with tags](/docs/document/operations/upload-document-with-text-tags).
              required:
              - file
      tags:
      - Document
  /document/{document_id}:
    put:
      operationId: put-document-document-id
      summary: Add payment request field
      description: 'This endpoint allows users to add a payment request field to a specific document.


        > The payment request field is a text field with a specific validator ID. You can only add one payment request field to your invite.


        For payment requests with field values, you must use the following validator IDs:

        - `7ef095fd94ce63b670b52b2e83457d59ac796a39` (currency amount format 1) - for European countries. Example: 8,100.00

        - `824085fd04ce63b670b11b2e83457d59ac796a39` (currency amount format 2) - for the United States. Example: 8.100,60


        > To request payment from the recipient, you have to connect to the payment service and send a signature invite with a payment request. The recipient will be asked to pay the amount you specified once they’ve completed the document.


        **Use additional attributes to customize the payment request field**


        | Parameter | Description | Example |

        | --- | --- | --- |

        | `type` | Field type. For the payment request field, the `type` is `text`. | |

        | `name` | Name of the payment field. | See the screenshot above. |

        | `validator_id` | A string that adds format validation. To use the field for the payment request, you must use the following validators: `7ef095fd94ce63b670b52b2e83457d59ac796a39` (currency amount format 1) - for European countries. Example: 8,100.00; `824085fd04ce63b670b11b2e83457d59ac796a39` (currency amount format 2) - for the United States. Example: 8.100,00. | |'
      parameters:
      - in: path
        name: document_id
        required: true
        description: Document ID.
        schema:
          type: string
      responses:
        '200':
          description: Returns ID of the updated document with a payment request field in case of successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  lines:
                    type: array
                    items:
                      type: object
                      properties: {}
                  texts:
                    type: array
                    items:
                      type: object
                      properties: {}
                  checks:
                    type: array
                    items:
                      type: object
                      properties: {}
                  hyperlinks:
                    type: array
                    items:
                      type: object
                      properties: {}
                  signatures:
                    type: array
                    items:
                      type: object
                      properties: {}
                  attachments:
                    type: array
                    items:
                      type: object
                      properties: {}
                  radiobuttons:
                    type: array
                    items:
                      type: object
                      properties: {}
                x-examples:
                  Example 1:
                    id: 2a4406b54049473fb709ed1191908eb6700f7347
                    lines: []
                    texts: []
                    checks: []
                    hyperlinks: []
                    signatures: []
                    attachments: []
                    radiobuttons: []
              example:
                Success:
                  id: 2a4406b54049473fb709ed1191908eb6700fXXXX
                  lines: []
                  texts: []
                  checks: []
                  hyperlinks: []
                  signatures: []
                  attachments: []
                  radiobuttons: []
                Example 1:
                  id: 2a4406b54049473fb709ed1191908eb6700f7347
                  lines: []
                  texts: []
                  checks: []
                  hyperlinks: []
                  signatures: []
                  attachments: []
                  radiobuttons: []
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - fields
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required:
                    - x
                    - y
                    - width
                    - height
                    - type
                    - role
                    properties:
                      x:
                        type: number
                        example: 358
                        description: A horizontal position of the field in pixels.
                      y:
                        type: number
                        example: 171
                        description: A vertical position of the field in pixels.
                      name:
                        type: string
                        example: payment_field
                        minLength: 1
                        description: A unique field name.
                      role:
                        type: string
                        example: Signer 1
                        minLength: 1
                        description: Recipient role assigned to the field.
                      type:
                        type: string
                        example: text
                        minLength: 1
                        description: Field type. For the payment request field, the `type` is `text`.
                      width:
                        type: number
                        example: 177
                        description: Field width in pixels.
                      height:
                        type: number
                        example: 50
                        description: Field height in pixels.
                      required:
                        type: boolean
                        description: 'Indicates whether the field is required. The field **must** be set to required to use it for the payment request.


                          '
                      page_number:
                        type: number
                        example: 0
                        description: The page number where the field will be placed. Page numbering starts at 0 (corresponding to page 1).
                      validator_id:
                        type: string
                        example: 7ef095fd94ce63b670b52b2e83457d59ac796a39
                        minLength: 1
                        description: 'A string that adds format validation. To use the field for the payment request, you **must** use the following validators:

                          `7ef095fd94ce63b670b52b2e83457d59ac796a39` (currency amount format 1) - for European countries. Example: `8,100.00`;

                          `824085fd04ce63b670b11b2e83457d59ac796a39` (currency amount format 2) - for the United States. Example: `8.100,00`

                          '
                      prefilled_text:
                        type: string
                        example: '8100'
                        description: 'The amount in the specified format shown in the field when the signer opens the document. For the payment request field, only numbers should be used.


                          '
                        x-stoplight:
                          id: u1mhkit828rse
                  minItems: 1
                  description: Array of field objects to add to the document.
                  uniqueItems: true
              x-examples:
                example-1:
                  fields:
                  - x: 358
                    y: 171
                    name: signature1
                    role: Signer 1
                    type: text
                    width: 177
                    height: 50
                    required: true
                    page_number: 0
                    validator_id: '{{number_validator_id}}'
                    custom_defined_option: false
                  elements: []
                  client_timestamp: timestamp
        required: true
      tags:
