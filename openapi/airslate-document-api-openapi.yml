      summary: Get template recipients
      description: This endpoint allows API users to retrieve detailed routing information for a template, including signers, viewers, approvers, and CC recipients, along with their specific roles and signing order.
      parameters:
      - in: path
        name: template_id
        required: true
        description: Template ID.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cc:
                    type: array
                    items:
                      type: string
                      description: Valid email address.
                    description: A list of email addresses that will receive a carbon copy of the document.
                  cc_step:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The display name for the CC recipient.
                        step:
                          type: integer
                          description: The specific step in the signing order when the email should be sent.
                        email:
                          type: string
                          description: The email address of the CC recipient.
                    description: A list of CC recipients assigned to specific steps in the signing order.
                  viewers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The display name of the viewer.
                        contact_id:
                          type: string
                          description: The unique identifier of the contact linked to the document.
                        inviter_role:
                          type: boolean
                          description: If true, the viewer can invite others.
                        default_email:
                          type: string
                          description: 'The email address of the viewer. Note: If `inviter_role` is `true`, this defaults to the document owner''s email (retrieved from `GET /user`) and the email input will be locked in the UI.'
                        signing_order:
                          type: integer
                          description: The step order for the viewer.
                    description: A list of users with view-only permissions.
                  approvers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The display name of the approver.
                        inviter_role:
                          type: boolean
                          description: If true, the approver can invite others.
                        default_email:
                          type: string
                          description: 'The email address of the approver. Note: If `inviter_role` is `true`, this defaults to the document owner''s email (retrieved from `GET /user`) and the email input will be locked in the UI.'
                        signing_order:
                          type: integer
                          description: The step order for the approver.
                        authentication:
                          type:
                          - object
                          - 'null'
                          required:
                          - type
                          properties:
                            type:
                              enum:
                              - phone
                              - password
                              type: string
                              example: phone
                              description: Authentication type used for the recipient authentication during the signing session.
                            phone:
                              type: string
                              example: '+15550109988'
                              description: Phone number used to authenticate the recipient. Required inside `authentication` object with the `phone` method.
                            method:
                              enum:
                              - sms
                              - phone_call
                              type: string
                              example: sms
                              description: Method of the `phone` authentication type. Required inside `authentication` object with the `phone` authentication type.
                            password:
                              type: string
                              example: '123456'
                              description: Password set for the recipient authentication. Required inside the `authentication` object with the `password` authentication type.
                            sms_message:
                              type: string
                              example: Enter the password {password} to unlock your document.
                              maxLength: 140
                              description: Custom sms message sent to the recipient, containing the `{password}` placeholder. Used with the `sms` method. Without this parameter, the recipient receives a default sms with an autogenerated password.
                          description: Authentication settings used to verify the recipient identity.
                        expiration_days:
                          type: integer
                          description: Number of days before the approval request expires.
                    description: A list of users required to approve the document.
                  attributes:
                    type: object
                    properties:
                      brand_id:
                        type: string
                        description: The unique identifier of the brand to apply.
                      on_complete:
                        type: string
                        description: The action to take when the document is completed.
                      redirect_uri:
                        type: string
                        description: The URL to redirect users to after signing.
                    description: General attributes regarding the document's completion settings and branding.
                  routing_details:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The display name of the recipient role.
                        role_id:
                          type: string
                          description: The unique identifier of the role.
                        inviter_role:
                          type: boolean
                          description: If set to `true`, designates the document owner (current API user) as the recipient for this role. This corresponds to the 'I am recipient' setting in the UI.
                        default_email:
                          type: string
                          description: 'The email address of the recipient. Note: If `inviter_role` is `true`, this defaults to the document owner''s email (retrieved from `GET /user`) and the email input will be locked in the UI.'
                        signing_order:
                          type: integer
                          description: The order in the signing workflow.
                    description: A list of signers and their role configurations.
                  invite_link_instructions:
                    type: string
                    description: Custom instructions to be displayed when the invite link is accessed.
