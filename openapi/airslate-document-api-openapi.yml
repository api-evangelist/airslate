                      type: object
                    description: List of text elements added to the document.
                  checks:
                    type: array
                    items:
                      type: object
                    description: List of checkmark elements added to the document.
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        role:
                          type: string
                        type:
                          type: string
                        role_id:
                          type: string
                        field_id:
                          type: string
