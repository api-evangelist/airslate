                      ccd_message: Se te ha copiado en esta invitación junto con {cc_emails}.
                      body_message: '{signer_email} ha completado y firmado {document_name} enviado por {sender_email}.'
                      footer_message: Unique Solutions Inc.
                    fr:
                      from: Nom de l'expéditeur
                      subject: '{signer_email} a signé le document'
