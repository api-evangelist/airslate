  /v2/brands:
    get:
      operationId: get-v2-brands
      summary: Get all brands
      description: 'This endpoint allows API users to retrieve all brands associated with their account.


        **Notes**


        Each brand has an `owner_type` field that defines who owns it and what access is allowed. There are three ownership types:


        * **`common`** — system default SignNow brand. Read-only; cannot be edited or customized. Appears in the brand list, but any modification attempt returns a "No access to brand" error.

        * **`organization`** — custom brand owned by the organization. Full access for organization admins. This is the brand type customers should create and use.

        * **`user`** — custom brand owned by an individual user.'
      responses:
        '200':
          description: '* At least one brand was created.

            * No brands were created, but SignNow default brand is returned.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        link:
                          type: string
                          description: Link to retrieve the brand.
                        title:
                          type: string
                          description: Brand name.
                        resources:
                          description: Brand resources. Empty array `[]` if no resources are configured. Object with resource type keys (`general`, `editor`, `email`, `logo`, `send-invite`, etc.) if resources exist.
                          additionalProperties:
                            type: object
                            properties:
                              data:
                                type:
                                - object
                                - 'null'
                                description: Resource data. `null` if not yet configured.
                              link:
                                type: string
                                description: Link to retrieve the resource.
                        unique_id:
                          type: string
                          description: Brand unique ID.
                        owner_type:
                          type: string
                          description: 'Brand owner type. Allowed values: `common`, `organization`, `user`.'
                    description: List of brands.
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          count:
                            type: integer
                            description: Number of brands on the current page.
                          links:
                            properties:
                              next:
                                type: string
                                description: Link to the next page. Present only if there are more pages.
                            description: Pagination links. Empty array `[]` if on the last page. Object with `next` key if more pages exist.
                          total:
                            type: integer
                            description: Total number of brands.
                          per_page:
