  /v2/brands/upload-file:
    post:
      operationId: post-v2-brands-upload-file
      summary: Create brand from template file
      description: 'This endpoint allows users to upload a template in JSON/XML file with brand settings and current resources.


        Get the up-to-date template file here.


        Assign the created brand ID to any of these levels:


        * Brand your documents.

        * Brand your document groups.

        * Brand your applications.


        The template structure consists of two required objects:


        * `title`: a string parameter with a brand title.

        * `resources`: an array of objects with the list of resources and their properties.


        Example schema:


        ```

        {

        "title": "some brand title",

        "resources": [

        "general": {...},

        "editor": {...},

        "send-invite": {...},

        "logo": {...},

        "email-general": {...},

        "email-invite": {...},

        ...

        ]

        }


        ```'
      parameters:
      - in: header
        name: Content-Type
        required: false
        description: multipart/form-data
        schema:
          type: string
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Success:
                  data:
                    id: 17XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        '400':
          description: '* Incorrect or missing token.

            * Template file missing.

            * Template file is empty.

            * JSON is empty.

            * Resources parameter is missing.

            * Incorrect file format.

