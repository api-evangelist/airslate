openapi: 3.2.0
info:
  title: SignNow Brands API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Brands
paths:
  /v2/brands/{brand_id}/resources/email-cc-invite:
    put:
      operationId: put-v2-brands-brand-id-resources-email-cc-invite
      summary: Brand invite CC email
      description: 'This endpoint allows users to add and edit branding for CC emails that are sent with invite emails.


        Branding for invite CC emails is available for the following invite types:


        * Document field invite

        * Document group field invite

        * Document freeform invite

        * Document group freeform invite'
      parameters:
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      - in: path
        name: brand_id
        required: true
        description: 'ID of the brand. Must match the pattern: [a-z0-9]{40}.'
        schema:
          type: string
      responses:
        '204':
          description: Success, no content
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Brand with this `brand_id` doesn't exist
          content:
            application/json:
              schema:
                type: object
              example:
                Example 1:
                  code: 25002016
                  message: Brand not found.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                en:
                  type: object
                  properties:
                    from:
                      type: string
                      maxLength: 300
                      description: Custom text indicating sender.
                    subject:
                      type: string
                      maxLength: 300
                      description: Email subject text. Placeholder `{sender_email}` is available.
                    body_header:
                      type: string
                      maxLength: 300
                      description: Email header text. Placeholder `{sender_email}` is available.
                    ccd_message:
                      type: string
                      maxLength: 300
                      description: Custom CC message text. Placeholder `{cc_emails}` that lists other recipients of CC emails is available.
                    body_message:
                      type: string
                      maxLength: 300
                      description: Email body text. Placeholders `{document_name}`, `{sender_email}`, and `{signer_email}` are available.
                    footer_message:
                      type: string
                      maxLength: 300
                      description: Email footer message.
                  description: 'Language of the email. Possible values: `en` for English, `es` for Spanish, and `fr` for French. You need to add translated texts. For more information, see [Language branding](/docs/guides-branding#language-branding).'
              x-examples:
                Example 1:
                  en:
                    from: 'From user '
                    subject: My custom subject {document_name}
                    expiration: Expiration message {days}
                    body_header: Body header message
                    body_message: Body message {document_name}
                    footer_message: Footer message EN
                  es:
                    from: From user
                    subject: My custom subject {document_name}
                    expiration: Expiration message {days}
                    body_header: Body header message
                    body_message: Body message {document_name}
                    footer_message: Footer message
                  fr:
                    from: From user
                    subject: My custom subject {document_name}
                    expiration: Expiration message {days}
                    body_header: Body header message
                    body_message: Body message {document_name}
                    footer_message: Footer message
        required: true
      tags:
      - Brands
    get:
      operationId: get-v2-brands-brand-id-resources-email-cc-invite
      summary: Get invite CC email branding
      description: This endpoint allows users to view branding for CC emails that are sent with invite emails.
      parameters:
      - in: path
        name: brand_id
        required: true
        description: 'ID of the brand. Must match the pattern: [a-z0-9]{40}.'
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                Example 1:
                  data:
                    en:
                      from: Sender Name
                      subject: '{sender_email} has CC''d you on an invitation'
                      body_header: '{sender_email} has CC''d you on an invitation'
                      ccd_message: You have been CC’d on this invitation along with {cc_emails}.
                      body_message: '{sender_email} has invited {signer_email} to review and sign: {document_name}.'
                      footer_message: Unique Solutions Inc.
                    es:
                      from: Nombre del remitente
                      subject: '{sender_email} te ha puesto en copia en una invitación'
                      body_header: '{sender_email} te ha puesto en copia en una invitación'
                      ccd_message: Se te ha copiado en esta invitación junto con {cc_emails}.
                      body_message: '{sender_email} ha invitado a {signer_email} a revisar y firmar: {document_name}.'
                      footer_message: Unique Solutions Inc.
                    fr:
                      from: Nom de l'expéditeur
                      subject: '{sender_email} vous a mis en copie d''une invitation'
                      body_header: '{sender_email} vous a mis en copie d''une invitation'
                      ccd_message: Vous avez été mis en copie de cette invitation avec {cc_emails}.
                      body_message: '{sender_email} a invité {signer_email} à examiner et signer: {document_name}.'
                      footer_message: Unique Solutions Inc.
        '404':
          description: Brand with this `brand_id` doesn't exist
          content:
            application/json:
              schema:
                type: object
              example:
                Example 1:
                  code: 25002016
                  message: Brand not found.
      security:
      - Bearer: []
      tags:
      - Brands
    delete:
      operationId: delete-v2-brands-brand-id-resources-email-cc-invite
      summary: Delete invite CC email branding
      description: This endpoint allows users to remove branding for CC emails that are sent with invite emails.
      parameters:
      - in: path
        name: brand_id
        required: true
        description: 'ID of the brand. Must match the pattern: [a-z0-9]{40}.'
        schema:
          type: string
      responses:
        '204':
          description: Success, no content
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Brand with this `brand_id` doesn't exist
          content:
            application/json:
              schema:
                type: object
              example:
                Example 1:
                  code: 25002016
                  message: Brand not found.
      security:
      - Bearer: []
      tags:
      - Brands
