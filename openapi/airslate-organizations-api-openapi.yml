  /v2/organizations/{org_unique_id}/documents/search:
    get:
      operationId: get-v2-organizations-org-unique-id-documents-search
      summary: Get user's documents
      description: 'Endpoint allows you to search through the documents of users of the organization. Available only to the Administrator of the organization.


        The `filters` query parameter is array of optional filter parameters. At least one filter must be added.


        **Pay attention**: emails must be encoded in such format `sample_name%40email.com`'
      parameters:
      - in: query
        name: 'filters:name '
        required: false
        description: 'Searches documents by document name. Example: `?filters=[{"name":{"type":"=","value":"sample name"}}]`'
        schema:
          type: string
      - in: query
        name: 'filters:signer '
        required: false
        description: 'Searches documents by signer email. Example: `?filters=[{"signer":{"type":"=","value":"signer%40email.com"}}]`'
        schema:
          type: string
      - in: query
        name: filters:owner
        required: false
        description: 'Searches documents by owner email. Example: `?filters=[{"owner":{"type":"=","value":"owner%40email.com"}}]`'
        schema:
          type: string
      - in: query
        name: 'filters:text '
        required: false
        description: 'Searches documents by the text in their text fields. Example: `?filters=[{"text":{"type":"=","value":"Some sample text"}}]`'
        schema:
          type: string
      - in: query
        name: filters:status
        required: false
        description: 'Searches documents by document status. Possible values: `waiting_for_signing`, `signed`, `pending_payment`. Example: `?filters=[{"status":{"type":"=","value":"signed"}}]`'
        schema:
          type: string
      - in: query
        name: page
        required: false
        description: 'Page number of the search results. Min: `1`. Example: `?page=3`'
        schema:
          type: number
      - in: query
        name: sort:name
        required: false
        description: 'Sorts documents by document name. Possible values: `asc`, `desc`. Example: `?sort[name]=asc`'
        schema:
          type: string
      - in: query
        name: sort:added
        required: false
        description: 'Sorts documents by the date they were added. Possible values: `asc`, `desc`. Example: `?sort[added]=asc`'
        schema:
          type: string
      - in: query
        name: sort:changed
        required: false
        description: 'Sorts documents by the date they were last changed. Possible values: `asc`, `desc`. Example: `?sort[changed]=asc`'
        schema:
          type: string
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      - in: query
        name: per_page
        required: false
        description: 'Number of search results per page. Min: `1`. Example: `?per_page=12`'
        schema:
          type: number
      - in: path
        name: org_unique_id
        required: true
        description: ID of organization
        schema:
          type: string
      responses:
        '200':
          description: Search by Signer email
