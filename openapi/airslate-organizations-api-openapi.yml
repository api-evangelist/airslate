    delete:
      operationId: delete-v2-organizations-organization-id-brands-brand-id-resources-editor
      summary: Delete org editor brand resource
      description: This endpoint allows users to delete an editor brand resource for an organization. Only an admin or moderator of the organization can perform this action.
      parameters:
      - in: path
        name: organization_id
        required: true
        description: 'ID of the organization. Must match the pattern: [a-z0-9]{40}.'
        schema:
          type: string
      - in: path
        name: brand_id
        required: true
        description: 'ID of the brand. Must match the pattern: [a-z0-9]{40}.'
        schema:
          type: string
      responses:
        '204':
          description: Success, no content
          content:
            application/json:
              schema:
                type: object
