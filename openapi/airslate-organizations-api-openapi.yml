openapi: 3.2.0
info:
  title: SignNow Organizations API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Organizations
paths:
  /v2/organizations/{org_id}/email-footers:
    post:
      operationId: post-v2-organizations-org-id-email-footers
      summary: Create email footer
      description: Allows users to create email footer text that is added to every email sent on behalf of the organization.
      parameters:
      - in: path
        name: org_id
        required: true
        description: ID of the organization where the email footer is set.
        schema:
          type: string
      responses:
        '200':
          description: 'Returns the footer id in case of successful response for the admins and moderators with trial, professional and enterprise subscription. Returns an error when:


            * If user is not admin/moderator of the Org, "code": 12003003. Message: "Access denied for current administration role in your organization."

            * If user who does not have appropriate subscription tries to update settings, "code": 12003002. Message: "Access denied for current asubscription."

            * If user tries to update settings of the organization that is not active or does not exist, "code": 12003001. Message: "Organization `deXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX` is not found."

            * The `footer` field is required, "code": 12010002. Message: "The `footer` field is required."

            * The `footer` field must be a string, "code": 12010001. Message: "The `footer` field must be a string."

            * The `footer` field length must be less than 65536 characters, "code": 12010005. Message: "The `footer` field length must be less than 65536 characters."'
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
                    minLength: 1
                x-examples:
                  example-1:
                    id: unique_id
                description: ''
              example:
                example-1:
                  id: 12XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - footer
              properties:
                footer:
                  type: string
                  minLength: 1
                  description: The email footer text that is added to every email sent on behalf of the organization.
              x-examples:
                example-1:
                  footer: footer text
              description: ''
        required: true
      tags:
      - Organizations
    get:
      operationId: get-v2-organizations-org-id-email-footers
      summary: Get all email footers
      description: Allows users to retrieve all email footers of the organization.
      parameters:
      - in: path
        name: org_id
        required: true
        description: ID of the organization where the email footer is set.
        schema:
          type: string
      responses:
        '200':
          description: 'Returns the list of footers in case of successful response for the admins and moderators with trial, professional and enterprise subscription. Returns an error when:


            * If user is not admin/moderator of the Org, "code": 12003003. Message: "Access denied for current administration role in your organization."

            * If user who does not have appropriate subscription tries to update settings, "code": 12003002. Message: "Access denied for current asubscription."

            * If user tries to update settings of the organization that is not active or does not exist, "code": 12003001. Message: "Organization `deXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX` is not found."'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      required:
                      - id
                      - footer
                      - active
                      - created_at
                      - updated_at
                      properties:
                        id:
                          type: string
                          minLength: 1
                        active:
                          type: boolean
                        footer:
                          type: string
                          minLength: 1
                        created_at:
                          type: number
                        updated_at:
                          type: number
                    minItems: 1
                    uniqueItems: true
                  meta:
                    type: object
                    required:
                    - pagination
                    properties:
                      pagination:
                        type: object
                        required:
                        - total
                        - count
                        - per_page
                        - current_page
                        - total_pages
                        - links
                        properties:
                          count:
                            type: number
                          links:
                            type: array
                            items:
                              required: []
                              properties: {}
                          total:
                            type: number
                          per_page:
                            type: number
                          total_pages:
                            type: number
                          current_page:
                            type: number
                x-examples:
                  example-1:
                    data:
                    - id: ca5fe90fc8cc46c9abf84fff101e0df3fcd34334
                      active: true
                      footer: footer text
                      created_at: 1600251592
                      updated_at: 1600251592
                    - id: e8ba8568015149188017aaea51610f70d6d1414f
                      active: false
                      footer: footer text
                      created_at: 1600249745
                      updated_at: 1600251592
                    meta:
                      pagination:
                        count: 3
                        links: []
                        total: 3
                        per_page: 15
                        total_pages: 1
                        current_page: 1
                description: ''
              example:
                example-1:
                  data:
                  - id: caXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    active: true
                    footer: footer text
                    created_at: 1600251592
                    updated_at: 1600251592
                  - id: e8XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    active: false
                    footer: footer text
                    created_at: 1600249745
                    updated_at: 1600251592
                  meta:
                    pagination:
                      count: 3
                      links: []
                      total: 3
                      per_page: 15
                      total_pages: 1
                      current_page: 1
      security:
      - Bearer: []
      tags:
      - Organizations
  /v2/organizations/{org_id}/email-footers/{footer_id}:
    get:
      operationId: get-v2-organizations-org-id-email-footers-footer-id
      summary: Get email footer text
      description: Allows users to retrieve a specific email footer text of the organization.
      parameters:
      - in: path
        name: org_id
        required: true
        description: ID of the organization the email footer is retrieved for.
        schema:
          type: string
      - in: path
        name: footer_id
        required: true
        description: ID of the retrieved footer.
        schema:
          type: string
      responses:
        '200':
          description: 'Returns the list of footers in case of successful response for the admins and moderators with trial, professional and enterprise subscription. Returns an error when:


            * If user is not admin/moderator of the Org, "code": 12003003. Message: "Access denied for current administration role in your organization."

            * If user who does not have appropriate subscription tries to update settings, "code": 12003002. Message: "Access denied for current asubscription."

            * If user tries to update settings of the organization that is not active or does not exist, "code": 12003001. Message: "Organization `deXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX` is not found."

            * Email footer is not found, "code": 12010003. Message: "EmailFooter `%` is not found."'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - footer
                    - active
                    - created_at
                    - updated_at
                    properties:
                      id:
                        type: string
                        minLength: 1
                      active:
                        type: boolean
                      footer:
                        type: string
                        minLength: 1
                      created_at:
                        type: number
                      updated_at:
                        type: number
                x-examples:
                  example-1:
                    data:
                      id: '%?'
                      active: true
                      footer: footer text
                      created_at: 1600254668
                      updated_at: 1600254668
                description: ''
              example:
                example-1:
                  data:
                    id: 12XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    active: true
                    footer: footer text
                    created_at: 1600254668
                    updated_at: 1600254668
      security:
      - Bearer: []
      tags:
      - Organizations
    put:
      operationId: put-v2-organizations-org-id-email-footers-footer-id
      summary: Update email footer
      description: Allows users to update a specific email footer text of the organization.
      parameters:
      - in: path
        name: org_id
        required: true
        description: ID of the organization the email footer is retrieved for.
        schema:
          type: string
      - in: path
        name: footer_id
        required: true
        description: ID of the retrieved footer.
        schema:
          type: string
      responses:
        '204':
          description: 'Returns the 204: No content in case of successful response for the admins and moderators with trial, professional and enterprise subscription. Returns an error when:


            * If user is not admin/moderator of the Org, "code": 12003003. Message: "Access denied for current administration role in your organization."

            * If user who does not have appropriate subscription tries to update settings, "code": 12003002. Message: "Access denied for current asubscription."

            * If user tries to update settings of the organization that is not active or does not exist, "code": 12003001. Message: "Organization `deXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX` is not found."

            * Email footer is not found, "code": 12010003. Message: "EmailFooter `%` is not found."

            * The `footer` field must be a string, "code": 12010001. Message: "The `footer` field must be a string."

            * The `footer` field length must be less than 65536 characters, "code": 12010005. Message: "The `footer` field length must be less than 65536 characters."

            * The `active` field must be a boolean value, "code": 12010006. Message: "The `active` field must be a boolean value."'
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - footer
              - active
              properties:
                active:
                  type: boolean
                  description: 'Set this footer active or not. Possible values: `true` - set active, `false` - deactivate.'
                footer:
                  type: string
                  minLength: 1
                  description: The footer text.
              x-examples:
                example-1:
                  active: true
                  footer: footer text
              description: ''
        required: true
      tags:
      - Organizations
  /v2/organizations:
    post:
      operationId: post-v2-organizations
      summary: Create organization
      description: Creates an Organization. The user who created the organization - automatically becomes the admin(old - super admin) of this organization
      responses:
        '200':
          description: 'Returns the id of the created organization in case of successful response. Returns an error when:


            * If user with a trial sub tries to create more than 5 organizations or If user with Professional or Enterprise subscription tries to create more than 50 organizationsIf user with Professional or Enterprise subscription tries to create more than 50 organizations, "code": 12001006. Message: "The number of created organizations has been exceeded."

            * If user who does not have Trial, Professional or Enterprise subscription tries to create an organization, "code": 12003002. Message: "Access denied for current subscription."

            * Request without mandatory parameters, "code": 12001002. Message: "The `name` field is required."

            * Request with name more than 255 chars length, "code": 12001004. Message: "The `name` field length must be less than 255 characters."

            * Request with invalid format of name parameter value, "code": 12001003. Message: "The `name` field must be a string."'
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
                    minLength: 1
                x-examples:
                  example-1:
                    id: 1afee427a35e404e9eb6f98cb6586f5e3ccef0a2
                description: ''
              example:
                example-1:
                  id: 1afee427a35e404e9eb6f98cb6586f5e3ccef0a2
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: 'Name of the organization. Max length: 255 chars.'
              x-examples:
                example-1:
                  name: Test ORG
              description: ''
        required: true
      tags:
      - Organizations
    get:
      operationId: get-v2-organizations
      summary: Get admin's organizations
      description: Retrieves a list of organizations in which the user has the role of moderator/admin.
      parameters:
      - in: query
        name: per_page
        required: false
        description: 'Allowed values: positive integers from 1 to 100.'
        schema:
          type: string
      - in: query
        name: page
        required: false
        description: 'Allowed values: any positive integer starting from 1.'
        schema:
          type: string
      - in: query
        name: filter:status
        required: false
        description: 'Possible values: active, pending. Format: `?filters=[{"status":{"type": "=", "value":"active|pending"}}]`'
        schema:
          type: string
      - in: query
        name: filter:type
        required: false
        description: 'Possible values: member/admin/moderator. Format: `?filters=[{"type":{"type": "in", "value":["member|admin|moderator"]}}]`'
        schema:
          type: string
      responses:
        '200':
          description: 'Returns the list of organization objects in case of successful response. Returns an error when:


            * Request with invalid format of parameters (page, per_page), "code": 12006001. Message: "Query parameter `per_page` must be a digit"; 12006003 - "Query parameter `per_page` must be less than or equal 100"; 12006004 - "Query parameter `page` must be a digit".'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      required:
                      - id
                      - name
                      - active
                      properties:
                        id:
                          type: string
                          minLength: 1
                        logo: {}
                        name:
                          type: string
                          minLength: 1
                        active:
                          type: boolean
                        membership:
                          type: object
                          required:
                          - type
                          - status
                          - invited_by
                          properties:
                            type:
                              type: string
                              minLength: 1
                            status:
                              type: string
                              minLength: 1
                            invited_by:
                              type: object
                              required:
                              - id
                              - email
                              properties:
                                id:
                                  type: string
                                  minLength: 1
                                email:
                                  type: string
                                  minLength: 1
                    minItems: 1
                    uniqueItems: true
                  meta:
                    type: object
                    required:
                    - pagination
                    properties:
                      pagination:
                        type: object
                        required:
                        - total
                        - count
                        - per_page
                        - current_page
                        - total_pages
                        - links
                        properties:
                          count:
                            type: number
                          links:
                            type: object
                            required:
                            - next
                            properties:
                              next:
                                type: string
                                minLength: 1
                          total:
                            type: number
                          per_page:
                            type: number
                          total_pages:
                            type: number
                          current_page:
                            type: number
                x-examples:
                  example-1:
                    data:
                    - id: 960c8d6e24314f0d86118f128b3284d2bb36cb00
                      logo: null
                      name: Test
                      active: true
                      membership:
                        type: admin
                        status: active
                        invited_by:
                          id: user_unique_id
                          email: test@signnow.com
                    meta:
                      pagination:
                        count: 1
                        links:
                          next: http://team.signnow-dev.int/v2/organizations?page=2
                        total: 22
                        per_page: 1
                        total_pages: 22
                        current_page: 1
                description: ''
              example:
                example-1:
                  data:
                  - id: 96XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    logo: null
                    name: Sample Organization
                    active: true
                    membership:
                      type: admin
                      status: active
                      invited_by:
                        id: user_unique_id
                        email: user@email.com
                  meta:
                    pagination:
                      count: 1
                      links:
                        next: http://example.com/v2/organizations?page=2
                      total: 22
                      per_page: 1
                      total_pages: 22
                      current_page: 1
      security:
      - Bearer: []
      tags:
      - Organizations
  /v2/organizations/{org_id}:
    put:
      operationId: put-v2-organizations-org-id
      summary: Rename organization
      description: Renames an Organization.
      parameters:
      - in: path
        name: org_id
        required: true
        description: ID of the requested organization
        schema:
          type: string
      responses:
        '204':
          description: 'Success, no content


            Returns an error when:


            * If user who is not the superadmin of org tries to change name of org or user is not related to org at all, "code": 12003001. Message: "Access denied."

            * If user tries to change org with expired trial, professional or enterprise subs or has another (not trial, professional or enterprise) type of subscription, "code": 12003002. Message: "Access denied for current subscription."

            * If user tries to change deleted org or org, "code": 12003001. Message: "Organization `63XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX` is not found."

            * If user who is not the superadmin tries to change org name, "code": 12003003. Message: "Access denied for current administration role in your organization."

            * Request without mandatory parameters, "code": 12001002. Message: "The `name` field is required."

            Request with name more than 255 chars length, "code": 12001004. Message: "The `name` field length must be less than 255 characters."

            * Request with invalid format of name parameter value, "code": 12001003. Message: "The `name` field must be a string."'
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: 'Name of the organization. Max length: 255 chars.'
              x-examples:
                example-1:
                  name: Test ORG
              description: ''
        required: true
      tags:
      - Organizations
    delete:
      operationId: delete-v2-organizations-org-id
      summary: Delete organization
      description: Deletes an organization.
      parameters:
      - in: path
        name: org_id
        required: true
        description: ID of the requested organization
        schema:
          type: string
      responses:
        '204':
          description: 'Returns empty 204 in case of successful response. Returns an error when:


            * If organization is not active, "code": 12003001. Message: "Organization `475fe6e7894344e0ad200bc3442d022792b3b7e0` is not found."

            * If user who is not admin of org tries to delete it, "code": 12003003. Message: "Access denied for current administration role in your organization."'
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
      - Bearer: []
      tags:
      - Organizations
  /v2/organizations/{org_id}/activity:
    get:
      operationId: get-v2-organizations-org-id-activity
      summary: Get organization activity
      description: Allows users to view fetching statistics about the organization.
      parameters:
      - in: query
        name: date_from
        required: false
        description: 'Filter by the date. Format: `?date_from=timestamp&date_to=timestamp`'
        schema:
          type: string
      - in: path
        name: org_id
        required: true
        description: ID of the organization where the organization activity is retrieved.
        schema:
          type: string
      responses:
        '200':
          description: 'Returns the audit log of organization activity in case of successful response for the admins and moderators with trial, professional and enterprise subscription. Returns an error when:


            * If user is not admin/moderator of the Org, "code": 12003003. Message: "Access denied for current administration role in your organization."

            * If user who does not have appropriate subscription tries to update settings, "code": 12003002. Message: "Access denied for current asubscription."

            * If user tries to update settings of the organization that is not active or does not exist, "code": 12003001. Message: "Organization `deXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX` is not found."'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - documents
                    - sent_documents
                    - signed_documents
                    - signers
                    - senders
                    - average_complete_time
                    - active_users
                    properties:
                      senders:
                        type: number
                      signers:
                        type: number
                      documents:
                        type: number
                      active_users:
                        type: number
                      sent_documents:
                        type: number
                      signed_documents:
                        type: number
                      average_complete_time:
                        type: string
                        minLength: 1
                x-examples:
                  example-1:
                    data:
                      senders: 26
                      signers: 218
                      documents: 2042
                      active_users: 4652
                      sent_documents: 451
                      signed_documents: 101
                      average_complete_time: 0:8:22
                description: ''
              example:
                example-1:
                  data:
                    senders: 26
                    signers: 218
                    documents: 2042
                    active_users: 4652
                    sent_documents: 451
                    signed_documents: 101
                    average_complete_time: 0:8:22
      security:
      - Bearer: []
      tags:
      - Organizations
  /v2/organizations/{org_id}/admins:
    get:
      operationId: get-v2-organizations-org-id-admins
      summary: Get the list of admins
      description: Retrieves a list of moderators and admins of an organization.
      parameters:
      - in: query
        name: filters:email
        required: false
        description: 'Filter by email. Format: `?filters=[{"email":{"type": "=", "value": user_email}}] (email should be encoded as url)`'
        schema:
          type: string
      - in: query
        name: filter:type
        required: false
        description: 'Filter by organization type. Possible values: active, pending, declined. Format: `?filters=[{"status":{"type": "=", "value":"active/pending/declined"}}]`'
        schema:
          type: string
      - in: query
        name: filter:type
        required: false
        description: 'Possible values: admin/moderator. Format: `?filters=[{"type":{"type": "in", "value":["admin|moderator"]}}]`'
        schema:
          type: string
      - in: path
        name: org_id
        required: true
        description: ID of the requested organization
        schema:
          type: string
      responses:
        '200':
          description: 'Returns the list of organization objects in case of successful response. Returns an error when:


            * If user does not have active trial professional or enterprise subscription, "code": 12003002. Message: "Access denied for current subscription."

            * If user is not the moderator or admin of organization, "code": 12003003. Message: "Access denied for current administration role in your organization."

            * If org is not active or does not exist at all, "code": 12003001. Message: "Organization `92XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX` is not found."

            * Request with invalid filter value or format, "code": 12006006. Message: "Unsupported filter mail was given."; 12004018 - "The `email` filter value should be of type string"; 12004017 - "The `email` filter expression should be equal to `=`"; 12004019 - "Invalid filter format, filter must have `type` and `value` fields".'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      required:
                      - id
                      - email
                      - type
                      - status
                      properties:
                        id:
                          type: string
                          minLength: 1
                        type:
                          type: string
                          minLength: 1
                        email:
                          type: string
                          minLength: 1
                        status:
                          type: string
                          minLength: 1
                    minItems: 1
                    uniqueItems: true
                  meta:
                    type: object
                    required:
                    - pagination
                    properties:
                      pagination:
                        type: object
                        required:
                        - total
                        - count
                        - per_page
                        - current_page
                        - total_pages
                        - links
                        properties:
                          count:
                            type: number
                          links:
                            type: array
                            items:
                              properties: {}
                          total:
                            type: number
                          per_page:
                            type: number
                          total_pages:
                            type: number
                          current_page:
                            type: number
                x-examples:
                  example-1:
                    data:
                    - id: 37a95ec9e51d4b168c74ffc23f6089b04ed679ff
                      type: admin
                      email: asdfhshhs@email.com
                      status: active
                    - id: 7d0083222c04fe245152739f977bf9f4741659b2
                      type: moderator
                      email: org_owner@email.com
                      status: pending
                    meta:
                      pagination:
                        count: 2
                        links: []
                        total: 2
                        per_page: 15
                        total_pages: 1
                        current_page: 1
                description: ''
              example:
                example-1:
                  data:
                  - id: 37XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    type: admin
                    email: user@email.com
                    status: active
                  - id: 7dXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    type: moderator
                    email: org_owner@email.com
                    status: pending
                  meta:
                    pagination:
                      count: 2
                      links: []
                      total: 2
                      per_page: 15
                      total_pages: 1
                      current_page: 1
      security:
      - Bearer: []
      tags:
      - Organizations
    post:
      operationId: post-v2-organizations-org-id-admins
      summary: Add moderator or admin
      description: Adds admin or moderator to organization.
      parameters:
      - in: path
        name: org_id
        required: true
        description: ID of the requested organization
        schema:
          type: string
      responses:
        '200':
          description: 'Returns ID of the invitation to become moderator/admin in case of successful response. Returns an error when:


            * If moderator tries to add admin to org, "code": 12004007. Message: "Access denied."

