  /organizations/{org_id}/merchantaccount:
    post:
      operationId: post-organizations-org-id-merchantaccount
      summary: Connect to merchant account
      description: 'This endpoint allows an organization admin to connect a SignNow organization to the payment service.


        Currently, the organization can be connected to Stripe and Stripe Connect. To receive payments, you''ll need a valid payment system account.


        > An organization is limited to one active account per payment service. The connected payment service will apply to all organization members by default.


        **Use additional attributes to customize the request**


        | Parameter | Description | Example |

        | --- | --- | --- |

        | `display_ach_form` | Boolean indicating whether to display the ACH payment form by Stripe to the recipient. | |

        | `display_credit_card_form` | Boolean indicating whether to display the credit card form by Stripe to the recipient. Note that either `display_ach_form` or `display_credit_card_form` should be set to `true`. | |'
      parameters:
      - in: path
        name: org_id
        required: true
        description: ID of the requested organization.
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                x-examples:
                  Example 1:
                    id: 5f793dfe081e4bf7a3dd25d245cdff1bebe3a188
              example:
                Example 1:
                  id: 5f793dfe081e4bf7a3dd25d245cdff1bebe3a188
                example-1:
                  status: success
        '400':
          description: '- `account_type` is incorrect or empty.

            - `account_name` is empty.

            - `publishable_key` is empty.

            - `secure_key` is empty.

            - Either `display_ach_form`or `display_credit_card_form` must be set to `true`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 29004017
                      message: 'Parameter `account_type` is required and must be one of: Stripe, StripeConnect, PayPal.'
              example:
                secure_key empty:
                  errors:
                  - code: 29004007
                    message: Secure key is empty.
                account_name empty:
                  errors:
                  - code: 29004001
                    message: Account name is required.
                Display form required:
                  errors:
                  - code: 29004014
                    message: At least one display form is required
                publishable_key empty:
                  errors:
                  - code: 29004004
                    message: Publishable key is empty.
                account_type incorrect or empty:
                  errors:
                  - code: 29004017
                    message: 'Parameter `account_type` is required and must be one of: Stripe, StripeConnect, PayPal.'
        '403':
          description: The organization has too many active accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 132
                      message: Forbidden to create multiple active accounts of the same type.
              example:
                Active accounts limit:
                  errors:
                  - code: 132
                    message: Forbidden to create multiple active accounts of the same type.
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - account_name
              - account_type
              properties:
                currency:
                  type: string
                  default: USD
                  example: USD
                  description: The currency used for recipient transactions.
                secure_key:
                  type: string
                  example: sk_yyyy_0vkrljcpCb9qbdk8IMXNyyyy
                  description: Secure API key (secret) given by Stripe. Required if `account_type` is `Stripe`.
                account_name:
                  type: string
                  example: My Stripe
                  description: Name of the new merchant account.
                account_type:
                  type: string
                  example: Stripe
                  description: 'The type of payment service. Allowed values: `Stripe`, `StripeConnect`.'
                publishable_key:
                  type: string
                  example: pk_xxxx_y16i7GDlOVChs1OowXjAiYYY
                  description: Publishable API key given by Stripe. Required if `account_type` is `Stripe`.
                display_ach_form:
                  type: boolean
                  description: Boolean indicating whether to display the ACH payment form by Stripe. Required if `account_type` is `Stripe`.
                display_credit_card_form:
                  type: boolean
                  description: 'Boolean indicating whether to display the credit card form by Stripe. Required if `account_type` is `Stripe`.

                    '
              x-examples:
                Example 1:
                  currency: USD
                  secure_key: sk_yyyy_0vkrljcpCb9qbdk8IMXNyyyy
                  account_name: My Stripe
                  account_type: Stripe
                  publishable_key: pk_xxxx_y16i7GDlOVChs1OowXjAiYYY
                  display_ach_form: true
                  display_credit_card_form: true
        required: true
      tags:
      - Organizations
