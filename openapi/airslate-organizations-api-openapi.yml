  /v2/organizations/{organization_id}/members/last-logins/export:
    post:
      operationId: post-v2-organizations-org-id-members-last-logins-export
      summary: Export last logins of members
      description: This endpoint allows for admin of the organization to get a CSV file with login data for the selected date range. The file is sent by email.
      parameters:
      - in: query
        name: date_from
        required: true
        description: A timestamp that defines the timeframe for the data collection (from).
        schema:
          type: integer
      - in: query
        name: date_to
        required: true
        description: A timestamp that defines the timeframe for the data collection (to).
        schema:
          type: integer
      - in: path
        name: organization_id
        required: true
        description: ID of the organization
        schema:
          type: string
      responses:
        '204':
          description: Success, no content
          content:
            application/json:
              schema:
                type: object
        '400':
          description: '* Period values are missing.

            * Incorrect period value or format.

            * date_from is greater than date_to.

            * date_from is not integer.

            * date_to is not integer.

            * Report for this date range was requested 30 minutes again or less.'
          content:
            application/json:
              example:
                date_to missing:
                  errors:
                  - code: 12006009
                    message: The `date_to` field is required.
                Incorrect date_to:
                  errors:
                  - code: 12006015
                    message: The `date_to` field value must be positive, non zero value.
                date_from missing:
                  errors:
                  - code: 12006007
                    message: The `date_from` field is required.
                Incorrect date_from:
                  errors:
                  - code: 12006014
                    message: The `date_from` field value must be positive, non zero value.
                date_to not integer:
                  errors:
                  - code: 12006010
                    message: The `date_to` field must be an integer.
                date_from not integer:
                  errors:
                  - code: 12006008
                    message: The `date_from` field must be an integer.
                This request already exists:
                  errors:
                  - code: 12020001
                    message: A report with the same filtering criteria is already being generated. Try again later.
                date_from greater than date_to:
                  errors:
                  - code: 12006011
                    message: '`date_to` should be greater than `date_from`.'
        '403':
          description: '* User doesn''t have active trial professional or enterprise subscription.

            * User is not an administrator of the organization.

            * Organization is not active.'
          content:
            application/json:
              example:
                User not admin:
                  errors:
                  - code: 12003003
                    message: Access denied for current administration role in your organization.
                Subscription error:
                  errors:
                  - code: 12003002
                    message: Access denied for current subscription.
                Organization not active:
                  errors:
                  - code: 12003005
                    message: Organization is not active.
        '404':
          description: Organization is not active or doesn't exist.
          content:
            application/json:
              example:
                Example 1:
                  errors:
                  - code: 12003001
                    message: Organization {organization_id} is not found.
      security:
      - Bearer: []
      tags:
      - Organizations
  /v2/organizations/{organization_id}/users-activity/export:
    post:
      operationId: post-v2-organizations-organization-id-users-activity-export
      summary: Export last activity of members
      description: This endpoint allows for admin or moderator of the organization to get a CSV file of users activity of the organization. The file is sent by email.
      parameters:
      - in: query
        name: date_from
        required: true
        description: A timestamp that defines the timeframe for the data collection (from).
        schema:
          type: integer
      - in: query
        name: date_to
        required: true
        description: A timestamp that defines the timeframe for the data collection (to).
        schema:
          type: integer
      - in: query
        name: sort[email]
        required: false
        description: 'Sort results by email. Possible values: asc, desc.'
        schema:
          type: string
      - in: query
        name: email
        required: false
        description: 'Filter results by email. Format: `&filters=[{"email":{"type":"=","value":"user@mail.com"}}]`'
        schema:
          type: string
      - in: query
        name: ban
        required: false
        description: 'Filter results by users that were banned from the organization or not. Format: `&filters=[{"ban":{"type": "=", "value": true/false}}]`'
        schema:
          type: boolean
      - in: query
        name: subscriptionStatus
        required: false
        description: 'Filter results by subscription status. Possible values: active, not_active. Format: `&filters=[{"subscriptionStatus":{"type": "=", "value": active/not_active}}]`'
        schema:
          type: string
      - in: path
        name: organization_id
        required: true
        description: ID of the organization
        schema:
          type: string
      responses:
        '204':
          description: Success, no content
          content:
            application/json:
              schema:
                type: object
        '400':
          description: '* The same request was made 30 minutes ago or less.

            * Incorrect period value or format.

            * Period values are missing.

            * date_from is greater than date_to.

            * date_from is not integer.

            * date_to is not integer.

            * The date range is more than 31 days.

            * email filter type is not string.

            * email filter type is not equal to ''=''.

            * email filter value is not string.

            * email filter value is not a valid email.

            * email filter type or value is missing.

            * ban filter type is not string.

            * ban filter type is not equal to ''=''.

            * ban filter value is not boolean.

            * ban filter type or value is missing.

            * subscriptionStatus filter type is not string.

            * subscriptionStatus filter type is not equal to ''=''.

            * subscriptionStatus filter value is not string.

            * subscriptionStatus filter value is not equal to ''active'' or ''not_active''.

