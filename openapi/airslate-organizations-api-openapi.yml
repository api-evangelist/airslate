          description: '* Request with a valid bearer token from another user logged in.

            * The user is authorized with a token from an app they don’t own.

            * The user is neither admin, nor moderator of the organization.

            * The brand exists but it is not an organization brand.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                x-examples:
                  Example 1:
                    code: 25002030
                    message: No access to the brand.
              example:
                Example 1:
                  code: 25002030
                  message: No access to the brand.
                Another user's token:
                  code: 25002002
                  message: No access to the brand
                Non-organization brand:
                  code: 25002030
                  message: No access to the brand.
                User doesn't own the app:
                  code: 25002001
                  message: Brand action not allowed
                User not admin or moderator:
                  code: 25006002
                  message: Insufficient organization rights.
        '404':
          description: '* The organization is not found.

            * The brand is not found.

            * `brand_id` cannot be null.

            * Editor resource for this `brand_id` doesn''t exist.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
