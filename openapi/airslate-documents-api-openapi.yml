openapi: 3.2.0
info:
  title: SignNow Documents API
  version: 1.0.0
servers:
- url: https://api.signnow.com/
tags:
- name: Documents
paths:
  /v2/documents/{document_id}/free-form-invites:
    get:
      operationId: get-v2-documents-document-id-free-form-invites
      summary: Get freeform invites
      description: Retrieve the list of FreeForm invites by document ID.
      parameters:
      - in: query
        name: per_page
        required: false
        description: 'How many search items to view per page. Allowed values: positive integers from 1 to 100.'
        schema:
          type: integer
      - in: query
        name: page
        required: false
        description: 'How many pages to fit the results in. Allowed values: any positive integer starting from 1.'
        schema:
          type: integer
      - in: query
        name: filters
        required: false
        description: JSON encoded array of filters.
        schema:
          type: array
      - in: path
        name: document_id
        required: true
        description: ID of the document.
        schema:
          type: string
      responses:
        '200':
          description: '* Correct request (invite has been sent)

            * Invite has been canceled

            * No invites

            * Invite is accepted, document is signed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        status:
                          type: string
                        created:
                          type: integer
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          count:
                            type: integer
                          links:
                            type: array
                            items:
                              type: object
                              properties: {}
                          total:
                            type: integer
                          per_page:
                            type: integer
                          total_pages:
                            type: integer
                          current_page:
                            type: integer
                x-examples:
                  Example 1:
                    data:
                    - id: 395a2cd89d3048a1856dbe1cdb144f519b82857e
                      email: jessicamoorejm843@gmail.com
                      status: canceled
                      created: 1735658991
                    meta:
                      pagination:
                        count: 1
                        links: []
                        total: 1
                        per_page: 15
                        total_pages: 1
                        current_page: 1
              example:
                Example 1:
                  data:
                  - id: 395a2cd89d3048a1856dbe1cdb144f519b82857e
                    email: jessicamoorejm843@gmail.com
                    status: canceled
                    created: 1735658991
                  meta:
                    pagination:
                      count: 1
                      links: []
                      total: 1
                      per_page: 15
                      total_pages: 1
                      current_page: 1
                No invites:
                  meta:
                    pagination:
                      count: 1
                      links: []
                      total: 1
                      per_page: 15
                      total_pages: 1
                      current_page: 1
                Invite has been canceled:
                  data:
                  - id: 5bXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    email: signer1@email.com
                    status: canceled
                    created: 1578561895
                  meta:
                    pagination:
                      count: 1
                      links: []
                      total: 1
                      per_page: 15
                      total_pages: 1
                      current_page: 1
                Correct request (invite sent):
                  data:
                  - id: 5bXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    email: signer1@email.com
                    status: pending
                    created: 1578561895
                  meta:
                    pagination:
                      count: 1
                      links: []
                      total: 1
                      per_page: 15
                      total_pages: 1
                      current_page: 1
                Invite accepted, document signed:
                  data:
                  - id: 96XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    email: signer1@email.com
                    status: fulfilled
                    created: 1578562606
                  meta:
                    pagination:
                      count: 2
                      links: []
                      total: 2
                      per_page: 15
                      total_pages: 1
                      current_page: 1
        '400':
          description: '* Invalid authorization

            * Document not found'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Document not found:
                  errors:
                  - code: 65582
                    message: Document not found
                Invalid authorization:
                  code: 1537
                  error: invalid_token
      security:
      - Bearer: []
      tags:
      - Documents
  /v2/documents/{document_id}/fields:
    get:
      operationId: get-v2-documents-document-unique-id-fields
      summary: Get fields data from completed document
      description: Retrieve contents from the fields completed by the signer.
      parameters:
      - in: header
        name: Content-Type
        required: false
        description: application/json
        schema:
          type: string
      - in: path
        name: document_id
        required: true
        description: ID of the document.
        schema:
          type: string
      responses:
        '200':
          description: "* Correct request for a document with fields filled in \n* If there are no fields in the document\n* If there are non-filled fields in the document"
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                If there are no fields in document:
                  data: []
                  meta:
                    pagination:
                      count: 4
                      links: []
                      total: 4
                      per_page: 15
                      total_pages: 1
                      current_page: 1
                If there are non-filled fields in the document:
                  data:
                  - id: 88XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    name: TextName
                    type: text
                    value: null
                  - id: 93XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    name: datetime
                    type: text
                    value: 10/11/2021
                  - id: c9XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    name: CalculatedName
                    type: text
                    value: '25'
                  - id: 11XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    name: Dropdown_1
                    type: enumeration
                    value: aa
                  meta:
                    pagination:
                      count: 4
                      links: []
                      total: 4
                      per_page: 15
                      total_pages: 1
                      current_page: 1
                'Correct request for a document with fields filled in ':
                  data:
                  - id: 350b5dce53694e2eb17b432ad75cc1d288827831
                    name: TextName
                    type: text
                    value: dev test search
                  - id: 9320dbacf5cf4d208deabd62dd1a7b4f0b9eed68
                    name: datetime
                    type: text
                    value: 10/11/2021
                  - id: c9f7c33cf3734572bb94352a5157bd6f40db4ba8
                    name: CalculatedName
                    type: text
                    value: '25'
                  - id: 11a1b00380044b86b346da6c6fbc4dd7eb2c9cb0
                    name: Dropdown_1
                    type: enumeration
                    value: aa
                  meta:
                    pagination:
                      count: 4
                      links: []
                      total: 4
                      per_page: 15
                      total_pages: 1
                      current_page: 1
        '400':
          description: '* Incorrect or missing token

            * Document with this `document_id` doesn''t exist

            * This user has no rights to access the document'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                document_id doesn't exist:
                  code: 65544
                  message: internal api error
                Incorrect or missing token:
                  code: 1537
                  error: invalid_token
                User has no rights for this document:
                  code: 65610
                  message: not readable
        '403':
          description: If user's email is not verified
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                If user's email is not verified:
                  code: 9001
                  message: Email verification required
        '404':
          description: "* If the document has been deleted or is in the trash bin \n* If {document_id} has incorrect format (too many or not enough symbols)"
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                'If the document has been deleted or is in the trash bin ':
                  '404': Document not found
                If {document_id} has incorrect format (too many or not enough symbols):
                  _message:
                    '404': 'Unable to find a route to match the URI: v2/documents/bade662638c640b5b7b712cf4fbec9afd5ffc0a/fields'
      security:
      - Bearer: []
      tags:
      - Documents
  /v2/documents/{document_id}/prefill-texts:
    put:
      operationId: put-v2-documents-document-id-prefill-texts
      summary: Prefill text fields
      description: 'This endpoint allows users to prefill text fields that signers can edit. Only fields of type `text` can be prefilled.


        **Example**'
      parameters:
      - in: path
        name: document_id
        required: true
        description: ' ID of the requested document.'
        schema:
          type: string
      responses:
        '204':
          description: 'Returns 204: Success, no content, when the text fields have been successfully prefilled. Returns an error when the request is sent with an invalid ID, or the added value doesn''t pass the field validation setting.'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                example-1:
                  Status: 204 Success, no content
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - fields
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required:
                    - field_name
                    - prefilled_text
                    properties:
                      field_name:
                        type: string
                        minLength: 1
                        description: The unique field name that identifies the field. Can be found in the `name` parameter of the field in response from `GET /document/{document_id}`.
                      prefilled_text:
                        type: string
                        minLength: 1
                        description: The value that should appear on the document.
                  minItems: 1
                  description: The array that contains field objects to add values to. Each field object is identified by the `field_name`.
                  uniqueItems: true
              x-examples:
                example-1:
                  fields:
                  - field_name: first_name
                    prefilled_text: Jane
                  - field_name: last_name
                    prefilled_text: Mitchell
              description: ''
        required: true
      tags:
      - Documents
  /v2/documents/url:
    post:
      operationId: post-v2-documents-url
      summary: Upload document from URL
      description: 'This endpoint allows users to upload a document to their SignNow account.


        Accepts .pdf, .doc, .docx, .odt, .rtf, .png, .jpg, .jpeg, .gif, .bmp, .xml, .xls, .xlsx, .ppt, .pptx, .ps, and .eps file types.


        Maximum file size per upload is 50 MB.


        > The link to the document must be publicly accessible.'
      responses:
        '200':
          description: 'Success: ID of the uploaded document.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                x-examples:
                  Example 1:
                    id: 4c8ddf3fe55e496bb332b4cc98c513b18903c048
              example:
                Example 1:
                  id: 4c8ddf3fe55e496bb332b4cc98c513b18903c048
                'Document ID ':
                  id: ccXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        '400':
          description: "\t\nSomething wrong with generating document dimensions"
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 21004000
                      message: Error during upload
              example:
                Example 1:
                  errors:
                  - code: 21004000
                    message: Error during upload
                Upload error:
                  errors:
                  - code: 21004000
                    message: Error during upload
                Restricted URL:
                  code: 21004004
                  message: Restricted url
                Parameter name is too long:
                  code: 65581
                  message: Document name is too long. Max size is 255 symbols
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  example: https://example.com/path/to/your/document.{file_extension}
                  description: URL with the file to upload. The link to the file must be publicly accessible.
                  x-stoplight:
                    id: mrvqtsr47wvwh
                check_fields:
                  type: boolean
                  description: If true, you can upload a document with simple text tags. For more information, see [Upload document with tags](/docs/document/operations/upload-document-with-text-tags).
                  x-stoplight:
                    id: 08br87vyow68f
        required: true
      tags:
      - Documents
  /v2/documents/{document_id}/roles:
    get:
      operationId: get-document-roles
      summary: Get document users
      description: 'This endpoint allows API users to retrieve a paginated list of users who have access to the document, including their emails, roles, names, and avatars.


        **Notes**


        * The owner sees all users with roles (including themselves as `owner`).

        * A non-owner (shared user) sees only the owner and themselves.'
      parameters:
      - in: query
        name: per_page
        required: false
        description: 'Number of items per page. Min: `1`, Max: `100`. Default: `15`.'
        schema:
          type: integer
      - in: query
        name: page
        required: false
        description: 'Page number. Min: `1`. Default: `1`.'
        schema:
          type: integer
      - in: path
        name: document_id
        required: true
        description: Document ID.
        schema:
          type: string
      responses:
        '200':
          description: Success. Returns a paginated list of users with access to the document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the user.
                        role:
                          type: string
                          description: User's role in the document (`owner`, `viewer`, or `sender`).
                        email:
                          type: string
                          description: Email address of the user.
                        full_name:
                          type: string
                          description: Full name of the user.
                        avatar_url:
                          type:
                          - string
                          - 'null'
                          description: URL of the user's avatar image.
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          count:
                            type: integer
                          total:
                            type: integer
                          per_page:
                            type: integer
                          total_pages:
                            type: integer
                          current_page:
                            type: integer
                        description: Pagination details for the response.
                x-examples:
                  Example 1:
                    data:
                    - id: abc123def456abc123def456abc123def456abc1
                      role: owner
                      email: owner@example.com
                      full_name: John Doe
                      avatar_url: https://example.com/avatars/abc123/download
                    - id: def456abc123def456abc123def456abc123def4
                      role: viewer
                      email: viewer@example.com
                      full_name: Jane Smith
                      avatar_url: null
                    meta:
                      pagination:
                        count: 2
                        total: 2
                        per_page: 15
                        total_pages: 1
                        current_page: 1
              example:
                Example 1:
                  data:
                  - id: abc123def456abc123def456abc123def456abc1
                    role: owner
                    email: owner@example.com
                    full_name: John Doe
                    avatar_url: https://example.com/avatars/abc123/download
                  - id: def456abc123def456abc123def456abc123def4
                    role: viewer
                    email: viewer@example.com
                    full_name: Jane Smith
                    avatar_url: null
                  meta:
                    pagination:
                      count: 2
                      total: 2
                      per_page: 15
                      total_pages: 1
                      current_page: 1
                application/json:
                  data:
                  - id: abc123def456abc123def456abc123def456abc1
                    role: owner
                    email: owner@example.com
                    full_name: John Doe
                    avatar_url: https://example.com/avatars/abc123/download
                  - id: def456abc123def456abc123def456abc123def4
                    role: viewer
                    email: viewer@example.com
                    full_name: Jane Smith
                    avatar_url: null
                  meta:
                    pagination:
                      count: 2
                      total: 2
                      per_page: 15
                      total_pages: 1
                      current_page: 1
        '400':
          description: 'Bad request. Possible errors:


            * Document not found.

            * You don''t have access to the entity.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 12029021
                      message: Document not found.
              example:
                Example 1:
                  errors:
                  - code: 12029021
                    message: Document not found.
                Document not found:
                  errors:
                  - code: 12029021
                    message: Document not found.
                No access to entity:
                  errors:
                  - code: 12029012
                    message: You don't have access to the entity.
        '401':
          description: Incorrect or missing bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error:
                    type: string
                x-examples:
                  Example 1:
                    code: 1537
                    error: invalid_token
              example:
                Example 1:
                  code: 1537
                  error: invalid_token
                Unauthorized:
                  code: 1537
                  error: invalid_token
        '404':
          description: Incorrect document ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  '404':
                    type: string
                x-examples:
                  Example 1:
                    '404': 'Unable to find a route to match the URI: V2/documents/a8a70c6f26744bcfa6f03abfb5ae00694fed5d73/roles'
              example:
                Example 1:
                  '404': 'Unable to find a route to match the URI: V2/documents/a8a70c6f26744bcfa6f03abfb5ae00694fed5d73/roles'
                Incorrect document ID:
                  '404': 'Unable to find a route to match the URI: V2/documents/{document_id}/roles'
      security:
      - Bearer: []
      tags:
      - Documents
    delete:
      operationId: unshare-document-all
      summary: Unshare document from all users
      description: 'This endpoint allows API users to remove sharing access for all users from the document.


        **Notes**


        * Only the owner of the document can perform this action.

        * All shared users are removed.'
      parameters:
      - in: path
        name: document_id
        required: true
        description: Document ID.
        schema:
          type: string
      responses:
        '204':
          description: All users successfully unshared. No content returned.
        '400':
          description: 'Bad request. Possible errors:


            * Document not found.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                x-examples:
                  Example 1:
                    code: 12029021
                    message: Document not found.
              example:
                Example 1:
                  code: 12029021
                  message: Document not found.
                Document not found:
                  code: 12029021
                  message: Document not found.
        '401':
          description: Incorrect or missing bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error:
                    type: string
                x-examples:
                  Example 1:
                    code: 1537
                    error: invalid_token
              example:
                Example 1:
                  code: 1537
                  error: invalid_token
                Unauthorized:
                  code: 1537
                  error: invalid_token
        '403':
          description: User is not the document owner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                x-examples:
                  Example 1:
                    code: 12029012
                    message: You don't have access to the entity.
              example:
                Example 1:
                  code: 12029012
                  message: You don't have access to the entity.
                Not an owner:
                  code: 12029012
                  message: You don't have access to the entity.
      security:
      - Bearer: []
      tags:
      - Documents
  /v2/documents/{document_id}/roles/{user_id}:
    delete:
      operationId: unshare-document-from-user
      summary: Unshare document from user
      description: 'This endpoint allows API users to remove sharing access for a specific user from the document.


        **Notes**


        * The owner can unshare any user except themselves.

        * A shared user can unshare only themselves (self-unshare).'
      parameters:
      - in: path
        name: document_id
        required: true
        description: Document ID.
        schema:
          type: string
      - in: path
        name: user_id
        required: true
        description: ID of the user to unshare.
        schema:
          type: string
      responses:
        '204':
          description: User successfully unshared. No content returned.
        '400':
          description: 'Bad request. Possible errors:


            * Document not found.

            * User role not found.

            * Managing user not found.

            * Entity owner can''t unshare it from himself.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
                x-examples:
                  Example 1:
                    errors:
                    - code: 12029021
                      message: Document not found.
              example:
                Example 1:
                  errors:
                  - code: 12029021
                    message: Document not found.
                Document not found:
                  errors:
                  - code: 12029021
                    message: Document not found.
                User role not found:
                  errors:
                  - code: 12029011
                    message: User role not found.
                Managing user not found:
                  errors:
                  - code: 12029023
                    message: Managing user not found.
                Owner can't unshare themselves:
                  errors:
                  - code: 12029022
                    message: Entity owner can't unshare it from himself.
        '401':
          description: Incorrect or missing bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error:
                    type: string
                x-examples:
                  Example 1:
                    code: 1537
                    error: invalid_token
              example:
                Example 1:
                  code: 1537
                  error: invalid_token
                Unauthorized:
                  code: 1537
                  error: invalid_token
        '403':
          description: You don't have access to the entity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                x-examples:
                  Example 1:
                    code: 12029012
                    message: You don't have access to the entity.
              example:
                Example 1:
                  code: 12029012
                  message: You don't have access to the entity.
                Forbidden:
                  code: 12029012
                  message: You don't have access to the entity.
      security:
      - Bearer: []
      tags:
      - Documents
  /v2/documents/{document_id}/embedded-invites:
    post:
      operationId: create-embedded-signing-invite
      summary: Create embedded invite
      description: 'This endpoint allows users to create an embedded signing invite for a document. Once the invite is created, generate an embedded signing link using `POST v2/documents/{{document_id}}/embedded-invites/{{embedded_invite_id}}/link` with the ID you got in the response. Before sending your request, ensure the following:

        - You are the owner of the document to be signed. - The invite is being created for a document (not a template). - Your document contains fields. - The document is not part of any other invite (pending or signed). - Signers'' email addresses are unique and do not exceed 150 characters. - All roles or role IDs in the document are included in the invite (specifying extra roles will result in an error). - The document owner cannot be assigned as a signer. You can also include `approvers`. These recipients review the document without signing or filling fields. Each approver requires `email`, `role`, `order`, and `auth_method`. Note that `order` values must be unique across `invites` and `approvers`. Parameters `role` and `role_id` can be retrieved from the response from `GET /document/{{document_id}}`. Specify a role either by `role` (unique role name, e.g. “Signer 1”), `role_id` (unique role identifier), or both `role` and `role_id`. Ensure they correspond to each other. Use these parameters to customize the request:


        Recipient authentication for the signing session


        Use the `authentication` object to set up the signer''s authentication for the signing session. * Authentication type: `phone`, method: `sms`. Note that `sms_message` parameter must contain `{password}` placeholder. This method is used to authenticate the signer using a password sent via SMS. ```json

        "authentication": {

        "type": "phone",

        "method": "sms",

        "phone": "+1XXXXXXXXX",

        "sms_message": "Custom test message with {password}"

        }

        ```


        * Authentication type: `phone`, method: `phone_call`

        This method is used to authenticate the signer with a password delivered via a phone call. ```json

        "authentication": {

        "type": "phone",

        "method": "phone_call",

        "phone": "+1XXXXXXXXX"

        }

        ```

        * Authentication type: `password`

        This method is used to authenticate the signer using a pre-set password. ```json

        "authentication": {

        "type": "password",

        "password": "123456"

        }

        ```


        name_formula parameter


        Use the `name_formula` parameter to generate a completed document name based on the `text_prefix` (can be any text) and fillable field data. For example, let''s set the first part of the completed document name as `Contract` and use data from two document fields (we can use up to five fields):

        * `signer_name` (filled as `John Smith`)

        * `signed_date` (filled as `20.01.2023`)


        After the signer completes the document, the document will have the name `Contract John Smith 20.01.2023`. Note that you can not use signature fields for `name_formula`. auth_method used in the integrated application


        The `auth_method` parameter is defined by the application owner to specify the method used to authenticate the signer within the integrated application. Possible values are: `password`, `email`, `social`, `mfa`, `biometric`, `other`, `none`. **Note**: The `auth_method` parameter does not influence the signer''s authentication method during the signing session. Use the `authentication` object to configure authentication for the signing session. from_email, from_name


        Use `from_email` and `from_name` parameters to customize the appearance of the sender''s email address and name. Note that both parameters are optional and applicable only when `delivery_type`=`email`. Explore the three scenarios of passing the from_name and from_email parameters:


        **When both `from_email` and `from_name` are passed:**


        The custom `from_name` appears:


        - in email subject of the invite, reassign, reminder, and completed emails. The custom `from_email` appears:


        - in email body of the invite, reassign, reminder, and completed emails. - when clicking **Contact Sender** and in **Reply-to** in the emails.'
