  /v2/documents/{document_id}/embedded-editor:
    post:
      operationId: post-v2-documents-document-unique-id-embedded-editor
      summary: Create link for document
      description: 'This endpoint allows API users to generate a link to embed the SignNow document editor into their app, allowing their customers to edit documents without sending them for signing.


        To generate an embedded editor link, make sure that:


        - the document has not been sent for signing or signed.

        - the document is not deleted or archived.'
      parameters:
      - in: path
        name: document_id
        required: true
        description: ID of the document to open in the embedded editor.
        schema:
          type: string
      responses:
        '200':
          description: Returns a link in case of correct request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                x-examples:
                  example-1:
                    data:
                      url: https://app3.signnow/webapp/document/9dcff427c3694e0294d412736bd68466529eb720?access_token=1be4687037b9c34291f91e7b1821337d91fb6c9be671fc79f8e2a6fb72d54aba&redirect_uri=https%3A%2F%2Fwww.google.com&embedded=1
              example:
                Correct request:
                  data:
                    url: https://example.com/document/9dXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX?access_token={access_token}&redirect_uri=https%3A%2F%2Fwww.example.com&embedded=1&redirect_target=blank
        '400':
          description: '* Incorrect or missing token.

            * Document was already sent.


            **Validation errors:**


            * `redirect_uri` is not a string.

            * Empty `redirect_uri`.

            * `redirect_uri` is longer than 2048 characters.

            * `redirect_uri` is not a correct URL.

            * `link_expiration` is not an integer.

            * `link_expiration` must be between 15 and 45.

            * Custom `link_expiration` is more than 43200 minutes.

            * `redirect_target` is not a string.

            * Incorrect `redirect_target`. Allowed values: `self`, `blank`.

            * `redirect_uri` is required if `redirect_target` is added.'
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Empty redirect_uri:
                  errors:
                  - code: 19046002
                    message: Parameter `redirect_uri` must not be an empty string.
                Missing redirect_uri:
                  errors:
                  - code: 19046009
                    message: The `redirect_uri` field is required when `redirect_target` is added.
                redirect_uri too long:
                  errors:
                  - code: 19046003
                    message: Parameter `redirect_uri` must not exceed 2048 characters.
                redirect_uri not a URL:
                  errors:
                  - code: 19046004
                    message: Parameter `redirect_uri` must be a valid URL.
                link_expiration too big:
                  errors:
                  - code: 19049001
                    message: The link expiration should be less than or equal to 45 minutes.
                redirect_uri not string:
                  errors:
                  - code: 19046001
                    message: Parameter `redirect_uri` must be a string.
                Document was already sent:
                  errors:
                  - code: 19001047
                    message: Document has been already sent to a signer.
                Incorrect redirect_target:
                  errors:
                  - code: 19046008
                    message: 'The `redirect_target` field is invalid, allowed values: self, blank.'
                Incorrect or missing token:
                  code: 1537
                  error: invalid_token
                link_expiration too little:
                  errors:
                  - code: 19046006
                    message: The link expiration should be greater than or equal to 15 minutes.
                redirect_target not string:
                  errors:
                  - code: 19046007
                    message: The `redirect_target` field must be a string.
                link_expiration not integer:
                  errors:
                  - code: 19046005
                    message: The link expiration value should be of type int.
                Custom link_expiration too big:
                  errors:
                  - code: 19049001
                    message: The link expiration should be less than or equal to 43200 minutes.
        '403':
          description: User doesn't own the document
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                User is not document owner:
                  code: 19001002
                  message: User is not document owner.
        '422':
          description: "* Document is in the Trash: 19001021\n  Message: \"Cannot fulfill request for the document in Trash folder.\"\n* Document deleted (from the Trash as well): 19001022\n  Message: \"Document not found\"  "
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                Document is in the Trash:
                  errors:
                  - code: 19001021
                    message: Cannot fulfill request for the document in Trash folder.
                Document deleted (from the Trash as well):
                  errors:
                  - code: 19001022
                    message: Document not found
      security:
      - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                  description: The page that opens after the signing session ends.
                  x-stoplight:
                    id: kxpmc6cagjvqz
                link_expiration:
                  type: integer
                  description: 15 minutes by default. Can be set max to 43200 minutes by a user with Admin level of access.
                redirect_target:
                  type: string
                  description: 'Determines whether to open the redirect link in the new tab in the browser, or in the same tab after the signing session. Possible values: `blank` - opens the link in the new tab, `self` - opens the link in the same tab, default value.'
                  x-stoplight:
                    id: lxwrbfcdu3pnc
              x-examples:
                example-1:
                  redirect_uri: some_valid_url
                  link_expiration: 15
                  redirect_target: blank
